<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:;">
<title>Uptime</title>
<style>
/* UPTIME · style.css — phone-first layout; menus readable in light and dark.
   Colour tokens: Classic uses these defaults; the other palettes (engine/settings.js) set them on <html>.
   paper = modal pages, box = dialogue panel and battle cards, hud = the status band. */
:root{
  --bg:#10141f; --ink:#e9edf5; --paper:#f4f2ec; --paper-ink:#1b2233; --muted:#4a5163;
  --cur:#e6f5c8; --accent:#2f6e3e; --warn:#b8432f; --gold:#ffd96a;
  --hud-bg:#161b29; --hud-ink:#ffffff; --box:#ffffff; --box-ink:#1b2233; --box-muted:#4a5163; --box-cur:#e6f5c8; --box-accent:#2f6e3e;
  --line:#1b2233; --foot:#8b93a7; --toast:#1b2233; --toast-ink:#ffffff;
  --fs:14px; --s:1;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1f2533; --paper-ink:#e9edf5; --muted:#aab3c5; --cur:#2c4a35; --accent:#a6d96a; --warn:#ff8a70; }
}
:root[data-theme="dark"]{ --paper:#1f2533; --paper-ink:#e9edf5; --muted:#aab3c5; --cur:#2c4a35; --accent:#a6d96a; --warn:#ff8a70; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;max-width:100vw}
body{font-family:var(--mono);-webkit-text-size-adjust:100%;touch-action:manipulation;min-height:100vh;min-height:100dvh;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#app{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;width:100%}
body.portrait #app{height:100vh;height:100dvh;min-height:0}
#stage{position:relative;max-width:100vw}
#screen{position:relative;overflow:hidden;background:#000;margin:0 auto}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD: its own band above the map (never over it); both lines wrap, nothing is cut off */
#hud{flex:none;width:var(--hudW,100%);max-width:100vw;padding:3px 8px 4px;font-size:13px;line-height:1.3;color:var(--hud-ink);background:var(--hud-bg);
  pointer-events:none;white-space:normal;overflow-wrap:anywhere;min-height:calc(2 * 1.3em + 7px)}
body.portrait #hud{width:100%;font-size:11.5px;min-height:calc(3 * 1.3em + 7px)}
#hud.off{visibility:hidden}
#hud .obj{color:var(--gold)}
/* Toasts: on the map, inside the screen (never over the HUD band above it). While a modal is open they move to the modal's
   own toast lane below its box (.mtoast), which takes its own space, so a toast never covers modal text, options or the HUD. */
#toast{position:absolute;z-index:40;left:50%;top:24%;transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);border:2px solid var(--gold);
  padding:3px 8px;font-size:calc(var(--fs) * .8);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#screen.battle #toast{top:50%}

/* Battle panels (real text over the canvas) */
.bpanel{position:absolute;display:none;background:var(--box);color:var(--box-ink);border:2px solid var(--line);padding:3px 6px;font-size:var(--fs);line-height:1.25}
.bpanel.show{display:block}
/* positions match BATTLE_LAYOUT in game.js: alert card top-left, opponent top-right; tool bottom-left, tool card bottom-right */
#bcard{left:2.5%;top:3%;width:52%}
#btool{right:2.5%;bottom:4%;width:52%}
.bt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bcard .bt{white-space:normal}
.bs{font-size:.8em;color:var(--box-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:4px;font-size:.8em;margin-top:2px}
.bl{width:5.6em;flex:none}
.bo{flex:1;height:.8em;border:2px solid var(--line);display:block;position:relative}
.bi{display:block;height:100%}
.bi.hatch{background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--box) 3px 5px)}  /* Dwell: hatched, never the same fill as Evidence */
.bn{width:3.6em;flex:none;text-align:right}

/* Dialogue / choice panel */
#panel{background:var(--box);color:var(--box-ink);font-size:var(--fs);line-height:1.4;display:none}
#panel.show{display:block}
body.landscape #panel{position:absolute;left:0;right:0;bottom:0;max-height:58%;overflow:auto;border-top:3px solid var(--line);padding:.5em .9em;z-index:5}
/* Desktop with room to spare: the dialogue sits below the map instead of over it (the battle scene stays whole) */
body.landscape.below #panel{position:static;display:block;visibility:hidden;width:var(--hudW);height:var(--panelH,180px);max-height:none;overflow:auto}
body.landscape.below #panel.show{visibility:visible}
/* Touch landscape battle: no HUD or footer; the scene sits at the top and the panel has its own band below it,
   as wide as the gap between the D-pad and the A/B buttons, with a readable font. It scrolls inside if it must. */
body.landscape.touch.inbattle #hud,body.landscape.touch.inbattle #foot{display:none}
body.landscape.touch.below #panel{width:min(500px,calc(100vw - 316px));margin:0 auto;font-size:12.5px;line-height:1.3;padding:.35em .7em;border-top:3px solid var(--line)}
/* Two-column choice grids (the battle menu): the note sits beside its label, so every row stays short */
body.landscape #panel.choosing #popts.cols2 .opt .note{display:inline;padding-left:.6em}
#panel.choosing #pmore{display:none}
#panel:not(.show) #pmore{visibility:hidden!important}
body.portrait #stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;width:100%}
body.portrait #panel{display:block;visibility:hidden;width:100%;flex:1 1 auto;min-height:150px;overflow:auto;font-size:14px;padding:8px 12px;border-top:3px solid var(--line)}
body.portrait #panel.show{visibility:visible}
#pwho{font-weight:700;color:var(--box-accent)}
#ptext{white-space:pre-wrap;min-height:1.4em}
#pmore{text-align:right;animation:blink 1s steps(2) infinite;height:1em;line-height:1em}
@keyframes blink{50%{opacity:0}}
#popts{display:grid;gap:2px 10px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;color:inherit;font-size:inherit;
  padding:2px 4px;cursor:pointer;line-height:1.25}
.opt .car{display:inline-block;width:1em;visibility:hidden}
.opt.cur{border-color:var(--line);background:var(--box-cur)}
.opt.cur .car{visibility:visible}
.opt.dis{opacity:.45;cursor:default}
.opt .note{display:block;font-size:.78em;color:var(--box-muted);padding-left:1.25em}
body.portrait #popts .opt{min-height:36px}

/* On-screen pad */
#pad{display:none}
body.portrait #pad, body.touch #pad{display:grid}
/* Portrait: the controls sit at the bottom of the screen and stay above any open modal */
body.portrait #pad{flex:none;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:440px;padding:8px 10px 4px;gap:4px;position:relative;z-index:60}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);justify-self:start}
.dpad button,.ab button,.sys button{touch-action:none;border:none;color:#e9edf5;cursor:pointer}
.dpad button{background:#3a4a6b;font-size:20px;border-radius:6px}
.dpad button.on,.ab button.on,.sys button.on{filter:brightness(1.5)}
.du{grid-column:2;grid-row:1}.dl{grid-column:1;grid-row:2}.dr{grid-column:3;grid-row:2}.dd{grid-column:2;grid-row:3}
.dc{grid-column:2;grid-row:2;background:#2b2f3a;border-radius:4px}
.ab{display:flex;gap:8px;justify-self:end;align-items:center}
.ab button{width:54px;height:54px;border-radius:50%;font-size:20px;font-weight:700}
.ab .ba{background:#b8432f;margin-top:-26px}.ab .bb{background:#8a4b2f;margin-top:26px}
.sys{display:flex;flex-direction:column;gap:10px;align-items:center}
.sys button{background:#4a5163;border-radius:12px;font-size:10px;padding:8px 6px;letter-spacing:.5px}
body.landscape.touch #pad{position:fixed;inset:0;pointer-events:none;display:block;z-index:60}
body.landscape.touch .dpad{position:fixed;left:14px;bottom:20px;pointer-events:auto}
body.landscape.touch .ab{position:fixed;right:18px;bottom:30px;pointer-events:auto}
body.landscape.touch .sys{position:fixed;right:18px;top:14px;flex-direction:row;pointer-events:auto}
#foot{font-size:11px;color:var(--foot);padding:6px 10px;text-align:center;max-width:100vw}
body.portrait #foot{flex:none;padding:2px 10px calc(4px + env(safe-area-inset-bottom))}
body.portrait #foot .keys,body.touch #foot .keys{display:none}

/* Modal pages */
#modal{position:fixed;inset:0;background:rgba(8,10,16,.8);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:8px}
/* Modals fit in the area above the on-screen controls (portrait) or between them (touch landscape); they scroll inside */
body.portrait #modal{bottom:var(--padZone,0px);padding:6px}
body.landscape.touch #modal{padding:8px 150px 8px 168px}
#modal.show{display:flex}
.mbox{background:var(--paper);color:var(--paper-ink);width:min(760px,100%);max-height:100%;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;border:3px solid var(--line);box-shadow:0 0 0 3px var(--paper)}
/* The toast lane: below the modal box, in the modal's own area (above the pad on a phone), never over the box or the HUD */
.mtoast{display:none;flex:none;margin-top:9px;max-width:min(760px,100%);background:var(--toast);color:var(--toast-ink);border:2px solid var(--gold);
  padding:3px 8px;font-size:12px;line-height:1.3;text-align:center;pointer-events:none;overflow-wrap:anywhere}
.mtoast.show{display:block}
.mhead{font-weight:700;padding:10px 14px 0;font-size:17px;letter-spacing:1px}
.mhead:empty{display:none}
/* UI.fitModal picks one of two layouts (maintenance slice 1), so an answer option is never clipped:
   .mkeep: the options keep their whole height (they never scroll) and the body scrolls in the rest, which is at least 30%
           of the modal area or the whole body;
   .mscroll: when the options and that much body don't both fit (long options on a landscape phone), the whole box scrolls
           as one page: body first, then every option in full, none clipped by a pane of its own. */
.mbody{overflow:auto;flex:1 1 auto;min-height:0;padding:6px 14px;font-size:15px;line-height:1.45;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.mbody p{margin:.5em 0}
.mbody h3{font-size:14px;margin:1em 0 .3em;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.mopts{padding:6px 10px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;flex:0 1 auto;min-height:0}
.mbox.mkeep .mopts{flex:none}
.mbox.mscroll{overflow-y:auto;overscroll-behavior:contain}
.mbox.mscroll .mbody,.mbox.mscroll .mopts{flex:none;min-height:0}  /* full height, so they never scroll vertically; wide tables still scroll sideways */
/* "More below" cues (maintenance slice 1 review, S2; UI.syncMore). In .mscroll a strip pinned to the box's bottom edge says
   the options are below (in the flow after them, so at the page's end it sits under the last option, never over it; the
   box's scroll padding keeps a highlighted option above it). In .mkeep a strip at the bottom of the body says its text goes
   on (no flow height of its own). The words are CSS content, so page text is unchanged. Page tokens: every palette. */
.mmore{display:none;position:sticky;bottom:0;z-index:2;flex:none;height:26px;line-height:22px;font-size:13px;font-weight:700;letter-spacing:.5px;
  text-align:center;background:var(--paper);color:var(--paper-ink);border-top:2px solid var(--paper-ink);box-shadow:0 -10px 10px -4px var(--paper);
  visibility:hidden;cursor:pointer;-webkit-user-select:none;user-select:none;white-space:nowrap;overflow:hidden}
.mmore.on{visibility:visible}
.mmore-o::after{content:"\25BC  options below  \25BC"}
.mmore-o.txt::after,.mmore-t::after{content:"\25BC  more below"}
.mbox.mscroll{scroll-padding-bottom:30px}
.mbox.mscroll .mmore-o{display:block}
.mbox.mkeep .mmore-t{display:block;margin-top:-26px}
.mopts .opt{flex:none;font-size:15px;min-height:40px;padding:6px 8px;color:var(--paper-ink)}
.mopts .opt.cur{background:var(--cur);border-color:var(--paper-ink)}
.mopts .opt .note{color:var(--muted)}
.mopts .opt.sel{font-weight:700}
.chk{display:inline-block;width:1.4em}
.mbody .small,.small{font-size:12px;color:var(--muted)}
.fm{padding:6px 0;border-bottom:1px solid rgba(127,127,127,.3);font-size:14px}
.fm.lock{color:var(--muted)}
table.sc{border-collapse:collapse;width:100%;font-size:13px;margin:.4em 0}
table.sc th,table.sc td{border-bottom:1px solid rgba(127,127,127,.35);padding:3px 4px;text-align:left}
table.sc th{font-size:12px;color:var(--muted)}
/* Scorecard / summary: numbers and targets never split; only the metric name wraps */
table.sc.score td+td,table.sc.score th+th{white-space:nowrap;text-align:right}
.dir{color:var(--warn);font-weight:700}
.card{border:2px solid var(--paper-ink);padding:6px 8px;margin:6px 0;font-size:14px}
.tag{font-size:11px;border:1px solid var(--muted);padding:0 4px;color:var(--muted)}
textarea{width:100%;font-family:var(--mono);font-size:12px;background:var(--box);color:var(--box-ink);border:2px solid var(--line);-webkit-user-select:text;user-select:text}
.err{color:var(--warn)}
.title{text-align:center;padding:10px 0}
.logo{font-size:44px;font-weight:800;letter-spacing:8px;color:var(--accent)}
.big{font-size:17px;font-weight:700}
@media (max-width:420px){ table.sc{font-size:11.5px} table.sc th,table.sc td{padding:3px 2px} table.sc.score td+td,table.sc.score th+th{padding-left:7px} .mbody{font-size:14px;padding:6px 10px} }

/* Investigation drills, inbox room and text stream (Mail Room) */
pre.art{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-family:var(--mono);font-size:12px;line-height:1.35;
  background:rgba(127,127,127,.12);border-left:3px solid var(--accent);padding:6px 8px;margin:.4em 0;-webkit-user-select:text;user-select:text}
pre.art.wall{border-left-color:var(--muted);color:var(--muted);max-height:220px;overflow:auto}
pre.art.ai{border-left-color:var(--gold)}
.find{margin:.4em 0}
.mbody details summary{cursor:pointer;color:var(--accent)}
.mail{border:2px solid var(--paper-ink);padding:6px 8px;margin:.4em 0;font-size:14px}
.mail .mh{font-size:12px;color:var(--muted);word-break:break-word}
.mail .cue{display:block;margin-top:4px;font-size:12px;border-left:3px solid var(--gold);padding-left:6px}
.sms{max-width:85%;border-radius:10px;padding:6px 10px;margin:6px 0;background:rgba(127,127,127,.18);font-size:14px}
.sms .from{display:block;font-size:11px;color:var(--muted)}

/* Settings: palette preview, reduced flashing, large text */
.setprev{margin:.3em 0}
#setprev{display:block;width:min(480px,100%);aspect-ratio:5/1;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--paper-ink)}
body.calm #pmore{animation:none}
body.calm #toast{transition:none}
body.bigtext .mbody{font-size:18px}
body.bigtext .mopts .opt{font-size:18px}
body.bigtext .mbody .small,body.bigtext .small{font-size:15px}
body.bigtext .mmore{height:30px;line-height:26px;font-size:16px}
body.bigtext .mbox.mkeep .mmore-t{margin-top:-30px}
body.bigtext .mbox.mscroll{scroll-padding-bottom:34px}
body.bigtext .mtoast{font-size:15px}
body.bigtext #toast{font-size:calc(var(--fs) * .95)}
body.bigtext #panel{font-size:calc(var(--fs) * 1.2)}
body.portrait.bigtext #panel{font-size:17px}

</style>
</head>

<div id="app">
  <div id="hud"><div class="st"></div><div class="obj"></div></div>
  <div id="stage">
    <div id="screen">
      <canvas id="cv" width="320" height="180" aria-label="Game screen"></canvas>
      <div id="bcard" class="bpanel"></div>
      <div id="btool" class="bpanel"></div>
      <div id="toast"></div>
    </div>
    <div id="panel" aria-live="polite"><div id="pwho"></div><div id="ptext"></div><div id="popts"></div><div id="pmore">&#9660;</div></div>
  </div>
  <div id="pad" aria-label="Controls">
    <div class="dpad">
      <button class="du" data-btn="up" aria-label="Up">&#9650;</button>
      <button class="dl" data-btn="left" aria-label="Left">&#9664;</button>
      <span class="dc"></span>
      <button class="dr" data-btn="right" aria-label="Right">&#9654;</button>
      <button class="dd" data-btn="down" aria-label="Down">&#9660;</button>
    </div>
    <div class="sys"><button data-btn="select">SELECT</button><button data-btn="start">START</button></div>

  </div>

</div>

/* ---------- RNG (mulberry32, seedable for tests) ---------- */
function makeRng(seed) {

/* Answer order: a deterministic shuffle for lists that have a right answer, so position never gives it

   keep their places. Seeded from the save's seed and the labels, so a list keeps its order on reload,
   and it never touches the game's own random stream. Callers still get the index into their own array.
   The highlight starts on display position 0 (the first enabled item), never on the caller's item 0, so it
   lands on a random answer; pass {cursor: i} (a caller index) to start somewhere on purpose.
   Pure navigation/confirmation menus stay in order; when one marks a preferred item with meta.good (a hint
   for the test bot), it says so with {nav: '<id>'}, an id on the reviewed allowlist in tests/highlight.js, so the
   tests can tell it from a graded list. */
function shuffleOrder(items, o) {

  for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }

}

  const id = key + '|' + palKey + '|' + (opts.variant || '') + '|' + (typeof Settings !== 'undefined' && Settings.v ? Settings.v.palette : '');
  if (SPR_CACHE[id]) return SPR_CACHE[id];

  if (!grid) throw new Error('no sprite ' + key);

  for (let y = 12; y < 16; y++) { if (g[y][0] === '0') g[y][0] = y % 2 ? '4' : '0'; if (g[y][15] === '0') g[y][15] = y % 2 ? '4' : '0'; }

}

/* ---------- Screen & scaling ---------- */
const Screen = {
  canvas: null, ctx: null, k: 1, s: 1, tallOK: false, tall: false,
  init() {
    this.canvas = document.getElementById('cv');
    this.ctx = this.canvas.getContext('2d');

    this.fit();
  },
  fit() {
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;
    const touch = document.body.classList.contains('touch');
    const portrait = H > W * 1.05 || W < 560;
    document.body.classList.toggle('portrait', portrait);
    document.body.classList.toggle('landscape', !portrait);
    // Room for the map: below the HUD band; in portrait also above the dialogue panel and the controls at the bottom.
    const hh = id => { const e = document.getElementById(id); return e ? e.getBoundingClientRect().height : 0; };
    let availW, availH;
    // Touch landscape in a battle: the HUD and footer are hidden (CSS), and the choice panel gets its own band below the
    // scene, between the on-screen controls, so it never covers the sprites or the cards.
    const landBattle = !portrait && touch && document.body.classList.contains('inbattle');
    if (portrait) { availW = W; availH = Math.max(90, H - hh('hud') - 150 - hh('pad') - hh('foot')); }
    else if (landBattle) { availW = W - 300; availH = H - 6; }
    else { availW = W - (touch ? 300 : 24); availH = H - 34 - hh('hud'); }
    // largest whole number of device pixels per logical pixel that fits
    const scaleFor = h => {
      let k = Math.floor(Math.min(availW * dpr / VW, h * dpr / VH0));
      if (k < 1) k = 1;
      // keep the CSS scale a whole number where the screen is big enough (desktop: 2x, 3x, 4x...)
      if (dpr <= 1.01 || k / dpr >= 2) { const cssK = Math.max(1, Math.floor(k / dpr)); k = Math.round(cssK * dpr); }
      return k;
    };
    let k = scaleFor(availH);
    // Desktop / keyboard landscape: if the map keeps its scale with a dialogue band below it, put the dialogue there.
    const PANEL_H = 170, LAND_PANEL_H = 150;
    let below = !portrait && !touch && scaleFor(availH - PANEL_H) === k;
    if (landBattle) { k = scaleFor(availH - LAND_PANEL_H); below = true; }
    document.body.classList.toggle('below', below);
    // The band below the map takes the room that is really left (the footer stays on screen), so nothing in it is cut off.
    if (below) document.documentElement.style.setProperty('--panelH', Math.floor(Math.max(120, Math.min(320, (landBattle ? H - 4 : H - hh('hud') - hh('foot') - 10) - VH0 * k / dpr))) + 'px');

    document.documentElement.style.setProperty('--fs', Math.max(10, Math.round(4.6 * this.s)) + 'px');
    document.documentElement.style.setProperty('--hudW', (VW * this.s) + 'px');
    const pad = document.getElementById('pad');
    document.documentElement.style.setProperty('--padZone', portrait && pad ? Math.max(0, Math.ceil(H - pad.getBoundingClientRect().top)) + 'px' : '0px');

  }

/* ---------- Input ---------- */

const Sound = {
  ctx: null, master: null, noiseBuf: null, unlocked: false, trace: [], last: {},
  // Audio starts only from a user gesture (browser autoplay policy). Never throws when Web Audio is missing.
  unlock() {
    if (this.unlocked) { try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} return; }
    this.unlocked = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.setVolume();
      if (this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  setVolume() { try { if (this.master) this.master.gain.value = Math.pow(Settings.v.volume / 100, 2) * 0.6; } catch (e) {} },
  // A preview (changing the sound set or the volume in Settings) ignores "alerts only" so the player hears what they
  // picked; mute and volume 0 still silence it.
  allowed(ev, preview) {
    const v = Settings.v;
    if (v.mute || v.volume <= 0) return 'muted';
    if (!preview && v.alertsOnly && ALERT_EVENTS.indexOf(ev) < 0) return 'filtered';
    return 'ok';
  },
  preview(ev) { return this.play(ev, null, true); },
  play(ev, setId, preview) {
    let out = this.allowed(ev, preview);
    const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    if (out === 'ok' && ev === 'move' && now - (this.last.move || 0) < 35) out = 'rate';
    if (out === 'ok') { this.last[ev] = now; out = !this.unlocked ? 'locked' : !this.ctx ? 'noaudio' : 'played'; }
    this.trace.push({ev: ev, set: setId || Settings.v.sound, out: out, preview: !!preview});
    if (this.trace.length > 300) this.trace.splice(0, 100);
    if (out !== 'played') return false;
    try { this.synth(SOUND_SETS[setId || Settings.v.sound] || SOUND_SETS.soft, ev); return true; }
    catch (e) { return false; }
  },
  synth(set, ev) {
    const c = this.ctx, t0 = c.currentTime + 0.01;
    for (const raw of set.ev[ev] || []) {
      const p = Object.assign({w: set.w, v: set.v, lp: set.lp, det: set.det, at: 0}, raw);
      const t = t0 + p.at, end = t + p.d;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(p.v, t + Math.min(0.006, p.d / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      let out = g;
      if (p.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = p.lp; g.connect(f); out = f; }
      out.connect(this.master);
      const voices = [];
      if (p.w === 'noise') {
        if (!this.noiseBuf) { const len = Math.floor(c.sampleRate * 0.25); this.noiseBuf = c.createBuffer(1, len, c.sampleRate); const d = this.noiseBuf.getChannelData(0); let s = 7; for (let i = 0; i < len; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; } }
        const src = c.createBufferSource(); src.buffer = this.noiseBuf; voices.push(src);
      } else {
        for (const cents of p.det ? [-p.det, p.det] : [0]) {
          const o = c.createOscillator(); o.type = p.w; o.frequency.setValueAtTime(p.f, t);
          if (p.f2) o.frequency.exponentialRampToValueAtTime(p.f2, end);
          if (cents) o.detune.value = cents;
          voices.push(o);
        }
      }
      const last = voices[voices.length - 1], filt = out === g ? null : out;
      last.onended = () => { try { for (const v of voices) v.disconnect(); g.disconnect(); if (filt) filt.disconnect(); } catch (e) {} };
      for (const v of voices) { v.connect(g); v.start(t); v.stop(end + 0.02); }
    }
  }
};

/* ---------- Settings store ----------
   v2: sound starts muted (volume kept at 60) for new players and, once, for anyone whose stored settings are v1; a
   one-time toast says so (soundTip). Reduced flashing follows the system's prefers-reduced-motion until the player
   changes it here (reduceFlashUser); after that their choice wins. */
const SETTINGS_VERSION = 2;
const Settings = {
  v: null, stored: false, storageOk: true, _col: {}, hooks: [],
  defaults() {
    let calm = false;
    try { calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    return {v: SETTINGS_VERSION, palette: 'classic', sound: 'soft', volume: 60, mute: true, alertsOnly: false, reduceFlash: calm, reduceFlashUser: false, textSize: 'normal', soundTip: false};
  },
  load() {
    const d = this.defaults();
    let raw = null;
    try { raw = localStorage.getItem(SETTINGS_KEY); this.storageOk = true; } catch (e) { this.storageOk = false; }
    let o = {};
    if (raw) { try { o = JSON.parse(raw); this.stored = true; } catch (e) { o = null; } }
    if (!o || typeof o !== 'object' || Array.isArray(o)) o = {};
    if (this.stored && !(o.v >= 2)) { o.mute = true; o.reduceFlashUser = 'reduceFlash' in o; o.v = SETTINGS_VERSION; }  // v1 -> v2, once
    if (!o.reduceFlashUser) delete o.reduceFlash;  // not chosen here: follow the system setting
    this.v = this.clean(Object.assign(d, o));
    this.apply();
    return this.v;
  },
  clean(v) {
    if (!PALETTES.some(p => p.id === v.palette)) v.palette = 'classic';
    if (!SOUND_SETS[v.sound]) v.sound = 'soft';
    const vol = +v.volume;
    v.volume = isNaN(vol) || v.volume === null || v.volume === '' ? 60 : clamp(Math.round(vol / 10) * 10, 0, 100);
    v.mute = !!v.mute; v.alertsOnly = !!v.alertsOnly; v.reduceFlash = !!v.reduceFlash; v.reduceFlashUser = !!v.reduceFlashUser; v.soundTip = !!v.soundTip;
    v.v = SETTINGS_VERSION;
    if (v.textSize !== 'large') v.textSize = 'normal';
    return v;
  },
  save() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.v)); this.storageOk = true; this.stored = true; return true; }
    catch (e) { this.storageOk = false; return false; }
  },
  set(patch) { if ('reduceFlash' in patch) patch = Object.assign({reduceFlashUser: true}, patch); Object.assign(this.v, patch); this.clean(this.v); this.apply(); this.save(); return this.v; },
  // One-time notice on first start that sound is off (remembered in the settings key).
  soundNotice() { if (this.v.soundTip) return null; this.set({soundTip: true}); return 'Sound is off. Turn it on in Settings.'; },
  pal() { const id = this.v ? this.v.palette : 'classic'; if (!this._p || this._p.id !== id) this._p = PALETTES.find(p => p.id === id) || PALETTES[0]; return this._p; },
  calm() { return !!(this.v && this.v.reduceFlash); },
  // Every colour the canvas draws goes through here.
  col(hex) {
    const p = this.pal(); if (!p.map) return hex;
    const k = p.id + hex, r = this._col[k]; if (r !== undefined) return r;
    return (this._col[k] = /^#[0-9a-f]{6}$/i.test(hex) ? p.map(hex.toLowerCase()) : hex);
  },
  barCol(which) { const p = this.pal(); return (p.bars && p.bars[which]) || this.col(BAR_COLOURS[which]); },
  palColours(key) {
    const p = this.pal(), base = PAL[key];
    if (!base || !p.map) return base;
    if (p.ok && stateBadge(key) === 'ok') return base.map(h => p.ok(h));
    return base.map(h => this.col(h));
  },
  apply() {
    const root = document.documentElement, p = this.pal();
    for (const t of UI_TOKENS) { if (p.css) root.style.setProperty('--' + t, p.css[t]); else root.style.removeProperty('--' + t); }
    root.setAttribute('data-palette', p.id);
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = p.css ? p.css.bg : '#10141f';
    const body = document.body;
    if (body) {
      const big = body.classList.contains('bigtext');
      body.classList.toggle('calm', this.calm());
      body.classList.toggle('bigtext', this.v.textSize === 'large');
      if (big !== (this.v.textSize === 'large') && typeof Screen !== 'undefined' && Screen.canvas) Screen.fit();
    }
    Sound.setVolume();
    for (const h of this.hooks) { try { h(); } catch (e) {} }
  }
};

/* ============================================================
   UPTIME · engine/series.js
   Series-level save (localStorage key 'uptime.series'), separate from each
   edition's own save, so later editions can read what happened earlier.
   Also the core of the Quiet Thread: a hidden, series-long intruder that lives
   off the land and never raises a normal alert. It is never part of the alert
   mix: there are no wild encounters for it, only clues an analyst may notice.
   ============================================================ */
'use strict';

const SERIES_KEY = 'uptime.series';
// Quiet Thread stages: 0 unseen · 1 noticed (a clue or two) · 2 suspected (3+ clues; hunt mode opens later)
const QT_SUSPECT = 3;

const Series = {
  data: null,
  blankQT() { return {stage: 0, cluesFound: [], evicted: false}; },
  blank() { return {v: 1, quietThread: this.blankQT(), editions: {}}; },
  normQT(q) {
    const b = this.blankQT();
    if (!q || typeof q !== 'object') return b;
    b.cluesFound = Array.isArray(q.cluesFound) ? q.cluesFound.filter(x => typeof x === 'string').filter((x, i, a) => a.indexOf(x) === i) : [];
    b.stage = Math.max(+q.stage || 0, qtStageFor(b.cluesFound.length));
    b.evicted = q.evicted === true;
    return b;
  },
  load() {
    let d = null;
    try { const raw = localStorage.getItem(SERIES_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    const out = this.blank();
    if (d && typeof d === 'object') {
      out.quietThread = this.normQT(d.quietThread);
      if (d.editions && typeof d.editions === 'object') out.editions = d.editions;
    }
    this.data = out;
    return out;
  },
  save() { try { localStorage.setItem(SERIES_KEY, JSON.stringify(this.data)); return true; } catch (e) { return false; } },
  qt() { if (!this.data) this.load(); return this.data.quietThread; },
  // Merge a copy carried in an edition save (e.g. an imported save code) into the series record.
  merge(q) {
    const cur = this.qt(), inc = this.normQT(q);
    inc.cluesFound.forEach(c => { if (!cur.cluesFound.includes(c)) cur.cluesFound.push(c); });
    cur.stage = Math.max(cur.stage, inc.stage, qtStageFor(cur.cluesFound.length));
    cur.evicted = cur.evicted || inc.evicted;
    this.save();
  },
  markEdition(id, info) { if (!this.data) this.load(); this.data.editions[id] = Object.assign({}, this.data.editions[id] || {}, info); this.save(); }
};
function qtStageFor(n) { return n >= QT_SUSPECT ? 2 : n >= 1 ? 1 : 0; }

  h += '<div class="fm small">' + esc(QT_FIELD_NOTES) + '</div>';
  return h;
}

/* ============================================================
   UPTIME · editions/charter/risk.js
   Charter's primitives (game models):
   - the risk-appetite statement builder: one statement per category, each an
     appetite level with measurable tolerances; the Board approves it, and every
     later decision is measured against it (CSF 2.0 GV.RM-02, cited in CREDITS.md);
   - budget allocation: a fixed sum across the register's lines; each line's
     option shows its cost, the risk left after it (the residual) and the
     appetite and tolerance it is measured against (a line within the level
     that breaks an approved tolerance is above appetite); a line above
     appetite needs an acceptance signed by its business owner (never by the
     CISO); the Board can override an allocation (its rule is chBoardDecide),
     and what its decision leaves above appetite is minuted as the Board's
     decision and approved by the Board, each owner signing for the interim
     measures and the treatment plan;
   - risk acceptances: owner, residual, appetite, tolerances broken, who
     decided, who approved, who signed and for what, expiry, review date,
     interim measures.
   Hooks for later slices (not built here): the board-report assembly (claims
   graded against records), the contract-clause negotiation within a budget, and
   the policy exception register with expiries. Each will read the same records:
   G.ch.register (owners and review dates), G.ch.accept (acceptances with an
   expiry and a review date) and G.ch.appetite (the approved statement).
   ============================================================ */
'use strict';

const CH_LEVELS = ['Low', 'Medium', 'High'];
// Appetite level -> the highest residual within appetite (game scale).
const CH_APPETITE_MAX = {Low: 'Low', Moderate: 'Medium', High: 'High'};
const chMoney = k => k ? '$' + k + 'k' : '$0';
const chHm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

/* ---------- The appetite statement ---------- */
// The approved level for a category (the statement the Board approved; the good option of each category until then).
function chAppetite(cat) {
  const a = G && G.ch && G.ch.appetite && G.ch.appetite.levels;
  if (a && a[cat]) return a[cat];
  const c = CH_APPETITE.find(x => x.id === cat), g = c && c.opts.find(o => o.good);
  return g ? g.level : 'Moderate';
}
// The approved tolerance text for a category (the statement's; the good option's until it is approved), and its short form.
function chTol(cat) {
  const t = G && G.ch && G.ch.appetite && G.ch.appetite.tol;
  if (t && t[cat]) return t[cat];
  const c = CH_APPETITE.find(x => x.id === cat), g = c && c.opts.find(o => o.good);
  return g ? g.tol : '';
}
function chLevelWithin(cat, residual) { return CH_LEVELS.indexOf(residual) <= CH_LEVELS.indexOf(CH_APPETITE_MAX[chAppetite(cat)]); }
// Within appetite: the residual no higher than the level allows AND no approved tolerance broken. The tolerances bind
// (GV.RM-02's example: appetite turned into measurable tolerances), so an option that breaks one is above appetite
// whatever its residual. `breaks` lists the tolerances an option breaks, in the statement's words.
function chWithin(cat, residual, breaks) { return chLevelWithin(cat, residual) && !(breaks && breaks.length); }
function chOptWithin(l, o) { return chWithin(l.cat, o.res, o.breaks); }
function chBreaks(o) { return (o && o.breaks) || []; }
// Build the statement: one graded list per category, retried until the Board can approve it; first tries are recorded.
async function chAppetiteBuild(cats) {
  const out = {levels: {}, tol: {}, first: []};
  for (const c of cats) {
    const items = c.opts.map(o => ({label: o.label, meta: {good: !!o.good}}));
    let first = true;
    while (true) {
      const i = await UI.openModal('Risk appetite · ' + c.name, '<p>' + esc(c.intro) + '</p><p><b>' + esc(c.ask) + '</b></p>' + chAppetiteHtml(out, cats), items, {shuffle: true, closable: false, cls: 'drill'});
      if (items[i].meta.good) break;
      first = false;
      await say(c.opts[i].why, 'Ivor Penhallow');
    }
    const g = c.opts.find(o => o.good);
    out.levels[c.id] = g.level; out.tol[c.id] = g.tol; out.first.push(first);
  }
  return out;
}
function chAppetiteHtml(ap, cats) {
  const rows = cats.filter(c => ap && ap.levels && ap.levels[c.id]);
  if (!rows.length) return '';
  return '<h3>The statement so far</h3><table class="sc"><tr><th>Category</th><th>Appetite</th><th>Within</th></tr>' +
    rows.map(c => '<tr><td>' + esc(c.name) + '</td><td>' + esc(ap.levels[c.id]) + '</td><td>' + esc(CH_APPETITE_MAX[ap.levels[c.id]] === 'Low' ? 'Low only' : 'Low, Medium') + '</td></tr>').join('') + '</table>' +
    '<ul>' + rows.map(c => '<li>' + esc(c.name) + ': ' + esc(ap.tol[c.id]) + '</li>').join('') + '</ul>';
}

/* ---------- Budget allocation ---------- */
function chLine(id) { return CH_LINES.find(l => l.id === id); }
function chOpt(alloc, l) { return l.opts[alloc[l.id] || 0]; }
function chAllocStats(alloc) {
  let total = 0, top = 0, within = 0; const above = [];
  for (const l of CH_LINES) {
    const o = chOpt(alloc, l); total += o.cost; if (l.rank <= 5) top += o.cost;
    if (chOptWithin(l, o)) within++; else above.push(l);
  }
  return {total, top, topPct: total ? Math.round(top / total * 100) : null, within, withinPct: Math.round(within / CH_LINES.length * 100), above};
}
function chAllocTable(alloc) {
  return '<table class="sc"><tr><th>Line</th><th>Cost</th><th>Left</th><th>Appetite</th></tr>' + CH_LINES.map(l => {
    const o = chOpt(alloc, l), ok = chOptWithin(l, o);
    return '<tr><td>' + l.id + '</td><td>' + chMoney(o.cost) + '</td><td>' + o.res + '</td><td>' + (ok ? 'within' : chBreaks(o).length ? '<b>above</b> (a tolerance)' : '<b>above</b>') + '</td></tr>';
  }).join('') + '</table>';
}
function chAllocSummary(alloc) {
  const s = chAllocStats(alloc);
  return '<p>Allocated <b>' + chMoney(s.total) + '</b> of ' + chMoney(CH_BUDGET) + ' · within appetite <b>' + s.within + ' of ' + CH_LINES.length + '</b> · top five <b>' + (s.topPct === null ? '—' : s.topPct + '%') + '</b> (game)</p>' +
    (s.above.length ? '<p>Above appetite, so each needs an acceptance signed by its owner: ' + s.above.map(l => '<b>' + l.id + '</b> (' + esc(l.owner) + ')' + (chBreaks(chOpt(alloc, l)).length ? ', breaking a tolerance' : '')).join(', ') + '.</p>' : '<p>Every line within the appetite the Board approved on Monday, its tolerances kept.</p>');
}
function chOptionsHtml() {
  return '<p class="small">Every price, rating and figure on this page is game data (game).</p>' + CH_LINES.map(l => '<h3>' + l.id + ' ' + esc(l.name) + '</h3><p class="small">' + esc(l.catName) + ', appetite ' + esc(chAppetite(l.cat)) + ' · owner ' + esc(l.owner) + ' · rank ' + l.rank + '</p><p class="small">Tolerance (Monday): ' + esc(chTol(l.cat)) + '.</p><ul>' +
    l.opts.map(o => '<li>' + chMoney(o.cost) + ': ' + esc(o.what) + ' Left: ' + o.res + (chOptWithin(l, o) ? ', within appetite.' : chBreaks(o).length ? ', above appetite: it breaks the tolerance “' + esc(chBreaks(o).join('”, “')) + '”.' : ', above appetite.') + '</li>').join('') + '</ul>' + (l.note ? '<p class="small">' + esc(l.note) + '</p>' : '')).join('');
}
// The allocation editor: left/right (or A) changes a line's option; the page reopens in place. Not graded line by line:
// the scorecard measures the result. meta.bot marks the bot's next step (the recommended allocation); it is never shown.
async function chAllocate() {
  const a = G.ch.alloc || (G.ch.alloc = Object.fromEntries(CH_LINES.map(l => [l.id, 0])));
  let cur = 0;
  while (true) {
    const s = chAllocStats(a), done = CH_LINES.every(l => a[l.id] === l.rec);
    const items = CH_LINES.map(l => {
      const o = chOpt(a, l);
      return {label: l.id + ' ' + l.name + ': ' + chMoney(o.cost) + ', ' + o.res + (chOptWithin(l, o) ? '' : chBreaks(o).length ? ', breaks a tolerance' : ', above appetite'),
        note: o.what + ' Tolerance: ' + CH_TOL_SHORT[l.cat] + '.' + (chBreaks(o).length ? ' This option breaks it.' : '') + ' (A cycles)', meta: {k: l.id, lr: true, bot: a[l.id] !== l.rec}};
    });
    items.push({label: 'Each line’s options, in business terms', meta: {k: 'help'}});
    items.push({label: s.total > CH_BUDGET ? 'Over the budget by ' + chMoney(s.total - CH_BUDGET) + ': change a line' : 'Send it to Marit for the Board papers', disabled: s.total > CH_BUDGET, meta: {k: 'send', bot: done}});
    const body = '<p>' + chMoney(CH_BUDGET) + ' for next year’s programme lines (game). Each line: what it costs, the risk it leaves, and the appetite and tolerance the Board approved on Monday. Left/right (or A) changes a line’s option.</p>' + chAllocSummary(a);
    const r = await UI.openModal('Budget · next year’s lines', body, items, {closable: false, cursor: cur, inView: true, lr: true, cls: 'drill'});
    if (r && typeof r === 'object' && r.lr) { const l = CH_LINES[r.i]; if (l) { a[l.id] = (a[l.id] + r.d + l.opts.length) % l.opts.length; cur = r.i; } continue; }
    if (r >= 0 && r < CH_LINES.length) { const l = CH_LINES[r]; a[l.id] = (a[l.id] + 1) % l.opts.length; cur = r; continue; }
    const k = items[r] && items[r].meta.k;
    if (k === 'help') { await UI.openModal('The lines in business terms', chOptionsHtml(), [{label: 'Back to the allocation', meta: {back: true}}], {closable: false, cls: 'drill'}); cur = r; continue; }
    if (k === 'send') {
      const j = await UI.openModal('Send the allocation?', chAllocTable(a) + chAllocSummary(a) + '<p>Marit puts it in the Board papers beside Edda’s alternative. The Board decides on Thursday.</p>',
        [{label: 'Send it', meta: {k: 'go', bot: true}}, {label: 'Back to the lines', meta: {k: 'back'}}], {closable: false, cursor: 1});
      if (j === 0) return a;
      cur = r;
    }
  }
}

/* ---------- The Board's decision and the acceptances ---------- */
// The Board's rule (game), on every path:
// 1. R5 is never left unfunded: an allocation with R5 at $0 is corrected in the minute (R5 funded), as the chair won't
//    ask Celia to sign that (`restored`).
// 2. Persuaded (the CISO's allocation within appetite on every line, tolerances kept, and Rounds 1 and 2 answered right
//    first time), the Board approves the allocation as sent: the extension carries R6 for a year.
// 3. Otherwise, if the upgrade is not funded in full, the Board overrides: the upgrade in full, R2 and R3 deferred.
// 4. Then, while the total is over the budget, R2, R3, R4 and R1 are trimmed to $0, in that order (R1 is never trimmed
//    to Quote A: it would leave R1 at Medium, still above appetite).
// Whatever the path, the Board decides; the CISO's allocation is its advice.
function chBoardDecide(alloc, persuaded) {
  const f = Object.assign({}, alloc), up = chLine('R6').opts.length - 1;
  const total = () => CH_LINES.reduce((n, l) => n + chOpt(f, l).cost, 0);
  const restored = [], cut = [];
  if (!f.R5) { f.R5 = chLine('R5').opts.length - 1; restored.push('R5'); }
  const won = !!persuaded && chAllocStats(alloc).within === CH_LINES.length;
  let override = false;
  if (f.R6 !== up && !won) {
    override = true; f.R6 = up;
    for (const id of ['R2', 'R3']) { if (f[id]) cut.push(id); f[id] = 0; }
  }
  for (const id of ['R2', 'R3', 'R4', 'R1']) if (total() > CH_BUDGET && f[id]) { f[id] = 0; cut.push(id); }
  return {final: f, override, cut, restored, persuaded: won};
}
function chAboveAppetite(alloc) { return CH_LINES.filter(l => !chOptWithin(l, chOpt(alloc, l))); }
// An acceptance for a line the Board's decision leaves above appetite. One decider per decision: the Board decided to
// carry the risk and approved accepting the residual (its minute, with the CISO's advice and objection noted); the
// business owner signs for the interim measures and owns the treatment plan; the CISO advised and records both.
function chAcceptance(l, alloc, dec, day) {
  const o = chOpt(alloc, l), d = typeof dec === 'string' ? {decidedBy: dec} : (dec || {});
  return {line: l.id, name: l.name, owner: l.owner, residual: o.res, appetite: chAppetite(l.cat), breaks: chBreaks(o).slice(),
    decider: d.decider || 'Board', decidedBy: d.decidedBy || 'the Compact Board (minute, Day ' + day + ')', approvedBy: d.approvedBy === undefined ? 'the Compact Board' : d.approvedBy,
    signedBy: l.owner, signedFor: 'the interim measures and the treatment plan', day: day,
    expiry: CH_EXPIRY_DAY, review: CH_REVIEW_DAY, interim: l.interim || ''};
}

function interact() {
  const [dx, dy] = DIRS[G.dir];
  const tx = G.x + dx, ty = G.y + dy;
  const npc = npcHere(G.map, tx, ty);
  if (npc) { run(() => talk(npc)); return; }
  const ch = tileChar(G.map, tx, ty), f = G.f;
  const door = doorAt(G.map, tx, ty);
  if (door && door.locked) { run(async () => { await say(door.locked); }); return; }

  else if (ch === 'Y') run(chDesk);

  else if (ch === 'Ɓ') run(async () => { await say(tx < 15 ? 'The identity desk: the shared directory’s console, and Beatriz’s exports.' : tx < 21 ? 'The shared-services desk: the platform’s support notice is pinned to it.' : 'The finance desk: next year’s budget papers, in Marit’s neat piles.'); });

}
async function talk(npc) {
  const f = G.f, who = npc.name;
  switch (npc.id) {
    case 'penhallow':
      if (!f.chAppetite) { await chAppointment(); return; }
      if (f.chDay66 && !f.chBoard) { await chBoardRound(); return; }
      await say(f.chBoard ? 'The Ballast Badge says this Board can hold you to a measure. Keep giving it one.' : 'Thursday at 14:00. Bring both cases, laid out the same way.', who); return;
    case 'noorch':

      await say(f.chDrillA ? 'fin-ap goes to Marit, board-display has an owner and an expiry, and the six service accounts keep theirs, owned and dated.' : 'Exports and resets for Edda. Tomorrow you’ll want the sign-in records, I expect.', who); return;

  while (true) {

    : 'The minute records the decision. No line is left above appetite.';
  await UI.openModal('The Board’s decision', '<p>' + head + (d.restored.length ? 'It funded R5, which your allocation left at $0. ' : '') + minute + ' (game)</p>' + chAllocTable(c.final) + chAllocSummary(c.final) +
    (above.length ? '<h3>15:20: the acceptances: the Board’s decision, signed by their owners</h3>' + chAcceptHtml(c.accept.filter(x => x.day === 67)) : '') +
    '<h3>Also before the Board</h3>' + chAcceptHtml(c.accept.filter(x => x.day === 66)),
    [{label: 'Continue', meta: {good: true}}], {closable: false, cls: 'summary'});
  for (const o of [...new Set(above.map(l => l.owner))]) {
    const mine = above.filter(l => l.owner === o).map(l => l.id), one = mine.length === 1;
    if (o === 'Edda Thornquist') await say('I sign ' + (one ? 'it as its owner' : 'them as their owner') + ', and I’ll run the interim checks. The Board chose the trade-off; the minute says so.', o);
    else if (o === 'Marit Quellan') await say('I sign ' + mine.join(', ') + ' as ' + (one ? 'its' : 'their') + ' owner, and I’ll run the interim checks. The Board chose it; the minute says so.', o);
    else await say('15:20: ' + o + ' signs ' + mine.join(', ') + ' as the owner, for the interim measures and the treatment plan. (game)');
  }
  f.chBoard = true; f.chBallast = true;
  G.focusMax += 4; G.focus = G.focusMax; unlock('act', 'chboard'); touchCSF('Govern'); track();
  await say('You cleared the Compact Board’s budget round. This is the Ballast Badge (game).', who);
  await say('Its power, from the next district on: every register line arrives with its owner and its review date. And you carry a little more now: Focus +4.', who);
  await say('16:00: your desk. Close the week.');
}

/* ---- engine/drill.js ---- */
/* ============================================================
   UPTIME · engine/drill.js
   Investigation drill: a new encounter type. One artefact, one question and a
   small query budget (usually 2). The player picks queries as (evidence source,
   question) pairs. Focused questions return a short, exact snippet for 1 Focus;
   broad ones return a wall of rows for 3 Focus; trap questions spend the budget
   and mislead. Then a verdict, the reasoning behind it, and alternative
   explanations the player ruled out (bonus). Credit needs evidence: with no
   decisive (key) query, a right verdict scores half and reasoning scores nothing,
   because that is a guess. An optional AI helper answers specific questions well
   and quietly truncates "everything".
   Inspired by Chris Sanders's Investigation Path posts (see CREDITS.md); every
   case is original. Drill data lives with each edition.

   Drill spec D:
   {id, title, intro(html), artefact(html), question, budget,
    sources: [{id, name, qs: [{q, kind: 'focus'|'broad'|'trap', key, res: [lines], wall: [row templates]}]}],
    ai: {everything: {text, wrong, reveal}, specific: {q, text}},
    verdicts: [{label, good, why, needs?, needsWhy?}], reasons: [{label, good, why}],
   A right verdict may name the source its claim rests on (needs: source id, or a list of ids when the
   claim rests on several). It then counts as supported only if a key query on each of those sources
   was run: a close that cites a log the player never read is a guess, however many other key queries
   they ran.
    alts: [{label, good, why}], altPick, path(html), response: [lines], techs: [ids], acts: [keys]}
   ============================================================ */
'use strict';

const DRILL_COST = {focus: 1, broad: 3, trap: 1};

function drillPre(lines, cls) {
  return '<pre class="art' + (cls ? ' ' + cls : '') + '">' + lines.map(esc).join('\n') + '</pre>';
}
// A wall of rows for a broad query: noisy template rows, with the one row that matters buried deep.
function drillWall(q) {
  const rows = [], tpl = q.wall || ['…'];
  const n = q.rows || 1240;
  for (let i = 0; i < 18; i++) {
    let r = tpl[i % tpl.length];
    const mm = String((7 + i * 3) % 60).padStart(2, '0'), ss = String((13 + i * 17) % 60).padStart(2, '0');
    r = r.replace(/\{t\}/g, mm + ':' + ss).replace(/\{n\}/g, String(100 + (i * 37) % 900)).replace(/\{i\}/g, String(i + 1));
    rows.push(r);
  }
  if (q.buried) rows.splice(15, 0, q.buried);
  rows.push('… ' + (n - rows.length).toLocaleString('en-US') + ' more rows');
  return '<p class="small">' + n.toLocaleString('en-US') + ' rows returned. You skim the first screen.</p>' + drillPre(rows, 'wall');
}
function drillFindings(st) {
  if (!st.findings.length) return '<p class="small">No queries yet.</p>';
  return st.findings.map(f => '<div class="find"><b>' + esc(f.head) + '</b>' + f.html + '</div>').join('');
}
function drillKeysLeft(D, st) {
  let n = 0;
  D.sources.forEach(s => s.qs.forEach(q => { if (q.key && !st.used.includes(q)) n++; }));
  return n;
}

async function doDrill(D) {
  const st = {budget: D.budget || 2, used: [], findings: [], broad: 0, trap: 0, keys: 0, keySrc: [], aiMode: null};
  UI.showPanel(false);
  touchCSF('Detect');
  const rules = '<p class="small">Query budget <b>' + st.budget + '</b>. A query is one evidence source plus one question. Focused questions return a short exact answer (1 Focus). Broad questions return a wall of rows (3 Focus). Then give a verdict and your reasoning, and name alternative explanations you ruled out. (Scoring is a game model.)</p>';
  await UI.openModal('Investigation drill · ' + D.title,
    D.intro + '<h3>Artefact</h3>' + D.artefact + '<p><b>Question:</b> ' + esc(D.question) + '</p>' + rules,
    [{label: 'Start investigating', meta: {good: true}}], {closable: false, cls: 'drill'});

  // ---- Queries ----
  while (true) {
    const keysLeft = drillKeysLeft(D, st);
    const items = D.sources.map(s => {
      const open = s.qs.filter(q => !st.used.includes(q));
      return {label: 'Query: ' + s.name, note: open.length + ' question' + (open.length === 1 ? '' : 's'),
        disabled: st.budget <= 0 || !open.length || G.focus < 1,
        meta: {src: s.id, good: st.budget > 0 && s.qs.some(q => q.key && !st.used.includes(q))}};
    });
    if (D.ai) items.push({label: 'Ask Tally (AI assistant)', note: 'no budget · 1 Focus', disabled: G.focus < 1, meta: {ai: true}});
    items.push({label: st.budget > 0 ? 'I have enough: decide' : 'Budget spent: decide', meta: {decide: true, good: st.budget <= 0 || keysLeft === 0}});
    const body = '<p>Budget left: <b>' + st.budget + '</b> · Focus <b>' + G.focus + '/' + G.focusMax + '</b></p>' +
      '<details><summary>Artefact</summary>' + D.artefact + '</details><p><b>Question:</b> ' + esc(D.question) + '</p><h3>Findings</h3>' + drillFindings(st);
    const i = await UI.openModal('Drill · ' + D.title, body, items, {shuffle: true, closable: false, cls: 'drill'});
    const m = items[i].meta;
    if (m.decide) break;
    if (m.ai) { await drillAI(D, st); continue; }
    const src = D.sources.find(s => s.id === m.src);
    const qs = src.qs.filter(q => !st.used.includes(q));
    const qi = qs.map(q => ({label: q.q, note: q.kind === 'broad' ? 'broad · 3 Focus' : '1 Focus', disabled: G.focus < DRILL_COST[q.kind], meta: {good: !!q.key}}));
    qi.push({label: 'Back', meta: {back: true}});
    const k = await UI.openModal('Query: ' + src.name, '<p>Which question do you put to the <b>' + esc(src.name) + '</b>?</p>', qi, {shuffle: true, closable: false, cls: 'drill'});
    if (qi[k].meta.back) continue;
    const q = qs[k];
    st.used.push(q); st.budget--;
    G.focus = Math.max(0, G.focus - DRILL_COST[q.kind]);
    let html;
    if (q.kind === 'broad') { st.broad++; html = drillWall(q); }
    else { if (q.kind === 'trap') st.trap++; if (q.key) { st.keys++; st.keySrc.push(src.id); } html = drillPre(q.res); }
    if (q.note) html += '<p class="small">' + esc(q.note) + '</p>';
    st.findings.push({head: src.name + ': ' + q.q, html: html});
    await UI.openModal('Result', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});
  }

  // ---- Verdict, reasoning, alternatives ----
  const ctx = '<h3>Findings</h3>' + drillFindings(st);
  const v = await UI.openModal('Verdict', '<p><b>' + esc(D.question) + '</b></p>' + ctx,
    D.verdicts.map(x => ({label: x.label, meta: {good: !!x.good}})), {shuffle: true, closable: false, cls: 'drill'});
  const r = await UI.openModal('Reasoning', '<p>Which reasoning supports your verdict best? Reason only from what your queries showed: reasoning about evidence you never looked at earns no credit.</p>' + ctx,
    D.reasons.map(x => ({label: x.label, meta: {good: !!x.good}})), {shuffle: true, closable: false, cls: 'drill'});
  const pickN = D.altPick || 2;
  const altItems = D.alts.map(x => ({label: x.label, meta: {good: !!x.good}})).concat([{label: 'Done: these are my ' + pickN, done: true, meta: {done: true}}]);
  const alts = await UI.openModal('Alternative explanations',
    '<p>Bonus: pick the <b>' + pickN + '</b> alternative explanations a careful analyst should name and rule out before closing this.</p>',
    altItems, {shuffle: true, multi: pickN, closable: false, cls: 'drill'});

  // ---- Score (game) and debrief ----
  const verdictOk = !!D.verdicts[v].good, reasonOk = !!D.reasons[r].good;
  const altOk = alts.filter(a => D.alts[a] && D.alts[a].good).length;
  const keyTotal = D.sources.reduce((n, s) => n + s.qs.filter(q => q.key).length, 0);
  const keyScore = Math.round(20 * Math.min(st.keys, Math.min(keyTotal, D.budget || 2)) / Math.min(keyTotal, D.budget || 2));
  const goodV = D.verdicts.find(x => x.good) || {};
  // needs: one source id, or a list of them (every one must have had a key query, e.g. two decisive sources).
  const needList = goodV.needs ? [].concat(goodV.needs) : [];
  const needsMissed = !!(needList.length && st.keys > 0 && needList.some(n => !st.keySrc.includes(n)));
  const supported = st.keys > 0 && !needsMissed;
  let score = (verdictOk ? (supported ? 40 : 20) : 0) + (reasonOk && supported ? 20 : 0) + keyScore + altOk * 10 - st.broad * 5 - st.trap * 5;
  score = clamp(score, 0, 100);
  const aiWrong = st.aiMode === 'everything' && D.ai && D.ai.everything.wrong;
  sfx(verdictOk ? (supported ? 'correct' : 'select') : 'wrong');  // the debrief says it in words too (right but unsupported: neutral)
  let h = '<p class="big">Score ' + score + ' / 100 <span class="small">(game)</span></p>';
  h += '<p><b>Verdict:</b> ' + esc(D.verdicts[v].label) + ' — ' + (verdictOk ? 'correct. ' : 'not supported. ') + esc(D.verdicts[v].why || '') + '</p>';
  if (!verdictOk) h += '<p><b>Better verdict:</b> ' + esc(D.verdicts.find(x => x.good).label) + '</p>';
  h += '<p><b>Reasoning:</b> ' + (reasonOk ? (supported ? 'sound. ' : 'sound in principle, but it rests on evidence you never queried (no credit). ') : 'weak. ') + esc(D.reasons[r].why || '') + '</p>';
  if (verdictOk && !supported) h += '<p><b>Unsupported:</b> ' + (needsMissed ? esc(goodV.needsWhy || 'the right answer, but it rests on evidence you never queried.') + ' In a real case that is a guess, and a guess can’t be defended in a report.' : 'the right answer, but none of your queries reached the decisive evidence. In a real case that is a guess, and a guess can’t be defended in a report.') + '</p>';
  h += '<p><b>Alternatives:</b> ' + altOk + ' of ' + pickN + ' worth ruling out.</p><ul>' +
    D.alts.filter(x => x.good).map(x => '<li>' + esc(x.label) + ': ' + esc(x.why) + '</li>').join('') + '</ul>';
  h += '<p><b>Queries:</b> ' + st.keys + ' focused on the decisive evidence' + (st.broad ? ', ' + st.broad + ' broad (a wall of rows costs time and Focus)' : '') + (st.trap ? ', ' + st.trap + ' that could only mislead' : '') + '.</p>';
  h += '<h3>The focused path</h3>' + D.path;
  if (st.aiMode) h += '<h3>About Tally</h3><p>' + esc(st.aiMode === 'everything' ? D.ai.everything.reveal : (st.keys ? 'You asked a specific question and checked it against the evidence. That is how an assistant helps.' : 'You asked a specific question, which is how an assistant helps. Tally was right this time, but you never confirmed its answer in the evidence yourself.')) + '</p>';
  h += '<h3>Response</h3><ul>' + D.response.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (D.techs.length) h += '<p class="small">ATT&amp;CK: ' + D.techs.map(t => esc(t + ' ' + TECH[t].name)).join(' · ') + '</p>';
  D.techs.forEach(t => unlock('tech', t));
  (D.acts || []).forEach(a => unlock('act', a));
  unlock('act', 'drill');
  await UI.openModal('Debrief · ' + D.title, h, [{label: 'Continue', meta: {good: true}}], {closable: false, cls: 'drill'});
  await gainXP(Math.round(score / 4));
  return {score: score, supported: supported, verdictOk: verdictOk, reasonOk: reasonOk, alts: altOk, keys: st.keys, broad: st.broad, trap: st.trap, ai: st.aiMode, aiWrong: aiWrong};
}

async function drillAI(D, st) {
  const items = [
    {label: 'Give Tally everything (paste all the logs) and ask for a verdict', meta: {mode: 'everything'}},
    {label: 'Ask Tally: “' + D.ai.specific.q + '”', meta: {mode: 'specific'}},
    {label: 'Back', meta: {back: true}}];
  const i = await UI.openModal('Tally · AI assistant', '<p>Tally runs on your console. It answers in seconds. It can be wrong.</p>', items, {closable: false, cls: 'drill'});
  const m = items[i].meta;
  if (m.back) return;
  G.focus = Math.max(0, G.focus - 1);
  if (!st.aiMode || m.mode === 'everything') st.aiMode = m.mode;
  const a = m.mode === 'everything' ? D.ai.everything.text : D.ai.specific.text;
  const html = drillPre(['Tally: ' + a], 'ai');
  st.findings.push({head: 'Tally (AI): ' + (m.mode === 'everything' ? 'everything' : D.ai.specific.q), html: html});
  await UI.openModal('Tally says', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});
}

/* ---- engine/game.js ---- */
/* ============================================================
   UPTIME · engine/game.js
   Shared game core: overworld, rendering, HUD, script runner, investigations
   (battles), alerts, scorecard, Field Manual, menus, save/load, title, main loop,
   debug hooks for tests. Each edition supplies its data and story (EDITION,
   newState, objective, interact, triggers, editionTile, summary, introScript...).
   ============================================================ */
'use strict';

let G = null;          // saved game state
let B = null;          // current battle (not saved)
let busy = 0;          // running scripts
let moving = null;     // current step animation
let fade = 0;          // map transition fade (0..1)
let started = false;   // past the title screen
let lastT = 0, encCooldown = 0, shake = 0, titleOpen = false;

const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};

/* ---------- Helpers ---------- */
// A named speaker standing on this map turns to face the player while speaking (talks and walk-triggered scenes alike).
const say = (t, who) => { faceSpeaker(who); return UI.say(t, who); };
const choose = (p, items, o) => UI.choose(p, items, o);
function toast(msg, ms) { UI.toast(msg, ms); }  // engine.js: on the map in #toast, in the modal's toast lane while a modal is open
function unlock(kind, key) { if (!G.fm[kind + ':' + key]) { G.fm[kind + ':' + key] = true; return true; } return false; }
function touchCSF(fn) { if (!G.csf[fn]) { G.csf[fn] = true; toast('CSF ' + fn + ' unlocked in the Field Manual'); } }
function groupFixed(g) { return !!G.f[GROUPS[g].fix]; }
function tool() { return G.party[G.active]; }
function toolName(t) { return TOOLS[t.id].name + (t.tuned ? ' · Tuned' : ''); }
// A tool that evolved from another still counts as having it (EVOLVED_FROM, edition data), so earlier checks keep working.
function hasTool(id) { return G.party.some(t => t.id === id || EVOLVED_FROM[t.id] === id); }
function addTool(id, lvl) { if (!hasTool(id)) G.party.push({id: id, lvl: lvl || 3, xp: 0, tuned: false}); }
function npcHere(map, x, y) { return NPCS.find(n => n.map === map && n.x === x && n.y === y && (!n.cond || n.cond(G))); }
function mapRows(m) { return MAPS[m].rows; }

/* ---------- Metrics ---------- */
function metricVals() {
  const m = G.m;
  return {
    closed: m.closed,
    acc: m.judged ? Math.round(m.correctShown / m.judged * 100) : null,
    tta: m.ttaN ? +(m.ttaSum / m.ttaN).toFixed(1) : null,
    esc: m.esc ? Math.round(m.escOk / m.esc * 100) : null,
    evid: m.judged ? Math.round((m.evOk || 0) / m.judged * 100) : null,
    uptime: +G.uptime.toFixed(2),
    mfa: Math.round(G.mfaSet.length / ACCOUNTS_TOTAL * 100),
    patch: Math.round(Object.keys(GROUPS).filter(groupFixed).length / 4 * 100),
    ...(typeof editionMetricVals === 'function' ? editionMetricVals() : {})
  };
}
const METRICS = [
  {k: 'closed', label: 'Alerts closed (read with accuracy)', unit: '', higher: true},
  {k: 'acc', label: 'Verdict accuracy', unit: '%', higher: true},
  {k: 'evid', label: 'Verdicts with evidence ≥ 40', unit: '%', higher: true},
  {k: 'tta', label: 'Time to acknowledge (game seconds)', unit: ' s', higher: false},
  {k: 'esc', label: 'Escalation precision (real, with evidence ÷ all)', unit: '%', higher: true},
  {k: 'uptime', label: 'District uptime', unit: '%', higher: true},
  {k: 'mfa', label: 'MFA coverage', unit: '%', higher: true},
  {k: 'patch', label: 'Hardening (baseline fixes)', unit: '%', higher: true}
];
// An edition with its own scorecard (EDITION.ownMetrics) replaces the analyst metrics above with EDITION_METRICS.
if (typeof EDITION !== 'undefined' && EDITION.ownMetrics) METRICS.length = 0;
if (typeof EDITION_METRICS !== 'undefined') METRICS.push(...EDITION_METRICS);
function track() {
  const v = metricVals();
  for (const d of METRICS) {
    if (d.when && !d.when()) continue;
    const x = v[d.k]; if (x === null || x === undefined) continue;
    const t = G.track[d.k] || (G.track[d.k] = {best: x, worst: x});
    if (d.higher) { t.best = Math.max(t.best, x); t.worst = Math.min(t.worst, x); }
    else { t.best = Math.min(t.best, x); t.worst = Math.max(t.worst, x); }
  }
}
function bumpUptime(d) { G.uptime = clamp(+(G.uptime + d).toFixed(3), 99.0, 100); track(); }

/* ---------- Tiles ---------- */
function tileChar(map, x, y) { const r = mapRows(map); if (y < 0 || y >= r.length || x < 0 || x >= r[0].length) return null; return r[y][x]; }
function tileDef(map, x, y) {
  const ch = tileChar(map, x, y); if (ch === null) return null;
  let d = Object.assign({ch: ch}, TILES[ch]);
  if (d.group) { const lit = groupFixed(d.group); d.spr = lit ? 'L' : 'B'; d.pal = lit ? 'L' : 'B'; }
  if (d.spr === 'exit') { const r = mapRows(map); d.spr = x === 0 ? 'exitL' : x === r[0].length - 1 ? 'exitR' : y === 0 ? 'exitU' : 'exit'; } // the arrow points out through its wall
  return editionTile(d, ch, x, y);
}
function doorAt(map, x, y) { const d = MAPS[map].doors; return d && d[x + ',' + y]; }
function blocked(map, x, y) {
  const d = tileDef(map, x, y); if (!d) return true;
  if (d.solid) return true;
  const door = doorAt(map, x, y); if (door && door.locked) return true;
  if (npcHere(map, x, y)) return true;
  return false;
}

/* ---------- Rendering ---------- */
function camera() {
  const r = mapRows(G.map), mw = r[0].length * TS, mh = r.length * TS;

  if (moving) { const t = moving.t; px = (moving.fx + (moving.tx - moving.fx) * t) * TS; py = (moving.fy + (moving.ty - moving.fy) * t) * TS; }
  let cx = mw <= VW ? -(VW - mw) / 2 : clamp(px + 8 - VW / 2, 0, mw - VW);
  let cy = mh <= VH ? -(VH - mh) / 2 : clamp(py + 8 - VH / 2, 0, mh - VH);
  return {cx: Math.round(cx), cy: Math.round(cy), px: px, py: py};
}
let npcFace = {};  // NPC id -> facing: NPCs in the current conversation or scene face the player until it ends (run(), busy -> 0)
let drawnEnts = [];  // what the last world frame drew (characters: sprite key, facing, screen position); read by tests
let drawnWanted = false;  // drawnEnts is only built once a test asks for it (__UPTIME.drawn), so normal play allocates nothing for it
// Turn the NPC named `who` (if they stand on this map and are present) to face the player, by the dominant axis.
function faceSpeaker(who) {
  if (!who || !G || !started) return;
  for (const n of NPCS) {
    if (n.name !== who || n.map !== G.map || (n.cond && !n.cond(G))) continue;
    const dx = G.x - n.x, dy = G.y - n.y;
    if (dx || dy) npcFace[n.id] = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
}
const OPP_DIR = {up: 'down', down: 'up', left: 'right', right: 'left'};
function drawWorld(ctx) {
  ctx.fillStyle = Settings.col('#10141f'); ctx.fillRect(0, 0, VW, VH);
  const r = mapRows(G.map), cam = camera();
  const x0 = Math.max(0, Math.floor(cam.cx / TS)), y0 = Math.max(0, Math.floor(cam.cy / TS));
  const x1 = Math.min(r[0].length - 1, Math.floor((cam.cx + VW) / TS)), y1 = Math.min(r.length - 1, Math.floor((cam.cy + VH) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = tileDef(G.map, x, y);
    const sx = x * TS - cam.cx, sy = y * TS - cam.cy;
    if (d.under) { const u = TILES[d.under]; ctx.drawImage(sprite(u.spr, u.pal), sx, sy); }
    ctx.drawImage(sprite(d.spr, d.pal), sx, sy);
    const badge = stateBadge(d.pal); if (badge) drawBadge(ctx, badge, sx, sy);  // fixed / isolated: a shape, not only a colour
  }
  // entities sorted by y
  // NPCs keep their configured facing, except those speaking to the player, who turn to face them (npcFace).
  const ents = NPCS.filter(n => n.map === G.map && (!n.cond || n.cond(G))).map(n => ({id: n.id, x: n.x * TS, y: n.y * TS, spr: n.spr || 'player', pal: n.pal, dir: npcFace[n.id] || n.dir}));
  // Walk cycle: a stepping frame for the middle half of each tile-to-tile move, standing otherwise; the stepping frame
  // alternates feet on successive steps (1 on even G.steps, 2 on odd), so the walk reads left, right, left...
  const walkFrame = moving && moving.t > 0.25 && moving.t < 0.75 ? 1 + (G.steps & 1) : 0;
  ents.push({id: 'me', x: cam.px, y: cam.py, spr: 'player', pal: 'player', dir: G.dir, me: true, step: walkFrame});
  ents.sort((a, b) => a.y - b.y);
  if (drawnWanted) drawnEnts.length = 0;
  for (const e of ents) {
    const key = facingKey(e.spr, e.dir, e.step), sx = Math.round(e.x - cam.cx), sy = Math.round(e.y - cam.cy - (e.step ? 1 : 0));
    ctx.drawImage(sprite(key, e.pal), sx, sy);
    if (drawnWanted) drawnEnts.push({id: e.id, key: key, pal: e.pal, dir: e.dir, x: sx, y: sy});
  }
  drawMarker(ctx, cam);
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = Settings.col('#10141f'); ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
}
function ellipse(ctx, cx, cy, rx, ry, c1, c2) {

}
// Battle scene layout in logical pixels (the alert card and tool card are HTML, placed by style.css; tests read this).
const BATTLE_LAYOUT = {enemy: {x: 236, y: 42, w: 32, h: 32}, enemyPad: {cx: 252, cy: 76, rx: 40, ry: 7},
  tool: {x: 52, y: 112, w: 32, h: 32}, toolPad: {cx: 68, cy: 146, rx: 44, ry: 7}};
let platformCache = null;
function drawBattle(ctx) {
  const L = BATTLE_LAYOUT;
  if (!platformCache || platformCache.pal !== Settings.v.palette) {
    const c = document.createElement('canvas'); c.width = VW; c.height = VH0;
    const x = c.getContext('2d'), k = Settings.col.bind(Settings);
    x.fillStyle = k('#dbeaf7'); x.fillRect(0, 0, VW, 96);
    x.fillStyle = k('#c9e3a8'); x.fillRect(0, 96, VW, VH0 - 96);

    ellipse(x, L.toolPad.cx, L.toolPad.cy, L.toolPad.rx, L.toolPad.ry, k('#5aa64b'), k('#a6d96a'));

  const t = tool();
  if (t) ctx.drawImage(sprite(TOOLS[t.id].spr, TOOLS[t.id].spr, {variant: t.tuned ? 'tuned' : ''}), L.tool.x, L.tool.y, L.tool.w, L.tool.h);

/* ---------- HUD ---------- */
// The HUD is its own band above the map (never over it); the objective wraps instead of being cut off.
let hudStr = '';
function hudUpdate() {
  const el = document.getElementById('hud');

  el.classList.remove('off');
  const v = metricVals();
  const st = typeof hudStatus === 'function' ? hudStatus(v) : 'Day ' + G.day + ' · ' + G.rank + ' · Focus ' + G.focus + '/' + G.focusMax + ' · Queue ' + G.queue + ' · Up ' + v.uptime.toFixed(2) + '%';
  const ob = objective().text;

/* ---------- Objective marker ---------- */
// A small bouncing marker on the door that leads toward the current objective (or on the objective's own door).
function markerDoor() {
  if (!G || !started) return null;
  const o = objective(); if (!o || !o.map || o.done) return null;
  if (o.map === G.map) { const d = doorAt(G.map, o.x, o.y); return d && d.to && !d.locked ? {x: o.x, y: o.y} : null; }
  const prev = new Map([[G.map, null]]), q = [G.map];
  while (q.length) {
    const m = q.shift();
    if (m === o.map) { let k = m, hop = null; while (prev.get(k)) { hop = prev.get(k); k = hop[0]; } const [x, y] = hop[1].split(',').map(Number); return {x: x, y: y}; }
    const ds = MAPS[m].doors || {};
    for (const xy in ds) { const d = ds[xy]; if (d.to && !d.locked && !prev.has(d.to)) { prev.set(d.to, [m, xy]); q.push(d.to); } }
  }

}
const MARKER_ROWS = ['1111111', '1444441', '0144410', '0014100', '0001000'];
function drawMarker(ctx, cam) {
  const d = markerDoor(); if (!d) return;
  const bob = Settings.calm() ? 0 : Math.round(Math.sin(performance.now() / 220) * 1.5);
  const cx = d.x * TS - cam.cx + 8, cy = d.y * TS - cam.cy + 3 + bob;
  // a gold down-pointing chevron with a dark outline, inside the door tile
  const edge = Settings.col('#1b2233'), gold = Settings.col('#ffd96a');
  for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 7; xx++) { const c = MARKER_ROWS[yy][xx]; if (c === '0') continue; ctx.fillStyle = c === '1' ? edge : gold; ctx.fillRect(cx - 3 + xx, cy + yy, 1, 1); }
}

/* ---------- Script runner ---------- */
async function run(fn) {
  busy++;
  try { await fn(); }
  catch (e) { console.error(e); }
  finally {
    busy--;
    if (!busy) { npcFace = {}; UI.hidePanel(); hudUpdate(); autosave(); }
  }
}
function autosave() { if (G && started && !B) storeSet(encodeSave(G)); }

/* ---------- Movement ---------- */
function tryMove(dir) {
  G.dir = dir;
  const [dx, dy] = DIRS[dir];
  const tx = G.x + dx, ty = G.y + dy;
  const door = doorAt(G.map, tx, ty);
  if (door && door.locked) { run(async () => { await say(door.locked); }); return; }
  if (blocked(G.map, tx, ty)) return;
  moving = {fx: G.x, fy: G.y, tx: tx, ty: ty, t: 0};
}
function stepDone() {
  G.x = moving.tx; G.y = moving.ty; moving = null;
  G.steps++;
  if (G.f.logs) G.m.events += 37 + Math.floor(rnd() * 20);
  if (G.steps % 12 === 0 && G.f.starter) G.queue = Math.min(9, G.queue + 1);
  if (G.auto && G.steps % 15 === 0 && G.queue > 0 && hasTool('ledger')) {
    if (rnd() < G.fpWeight / (G.fpWeight + 50) * 0.8) {
      G.queue--; G.m.autoClosed++;
      toast('Ledger auto-closed a known false positive');
      if (rnd() < 0.02) {
        // A real alert was auto-closed. A weekly sample review catches about half of those (game).
        if (G.autoReview && rnd() < 0.5) { G.queue = Math.min(9, G.queue + 1); toast('Weekly sample: a person caught a real alert Ledger had auto-closed. It is back in the queue.'); }
        else G.m.missed++;
      }
    }
  }
  if (encCooldown > 0) encCooldown--;
  const door = doorAt(G.map, G.x, G.y);
  if (door && door.to) { run(() => warp(door.to, door.x, door.y, door.dir)); return; }
  if (triggers()) return;
  const d = tileDef(G.map, G.x, G.y);
  if (d.grass && G.party.length && encCooldown <= 0 && rnd() < 0.12) {
    encCooldown = 4;
    run(async () => { await randomAlert('grass'); });
  }
}
async function warp(map, x, y, dir) {
  const still = UI.turbo || Settings.calm();  // reduced flashing: no fade to dark between rooms
  if (!still) for (let i = 1; i <= 6; i++) { fade = i / 6; await sleep(25); }
  G.map = map; G.x = x; G.y = y; G.dir = dir || G.dir;
  if (!still) for (let i = 5; i >= 0; i--) { fade = i / 6; await sleep(25); }
  fade = 0;
}
/* ---------- Shifts, days, briefing ---------- */
async function endShift(reason) {

    '<p>Alerts closed today: <b>' + G.m.today + '</b>. Queue left overnight: <b>' + G.queue + '</b>.</p>' +
    (G.f.overnight ? '<p>An unfinished alert waited overnight; its dwell grew.</p>' : '');
  await UI.openModal('End of shift', body, [{label: 'Go home', meta: {good: true}}], {closable: false});
  if (G.f.overnight) { bumpUptime(-0.01); G.rep -= 1; G.f.overnight = false; }

}
async function briefing() {
  const L = typeof briefList === 'function' ? briefList() : BRIEFS;
  const a = L[(G.day * 2) % L.length], b = L[(G.day * 2 + 1) % L.length];

/* ---------- Alerts ---------- */
// Threat for an alert. Only malicious alerts use the entry-route weights (MAL_WEIGHTS, game) and the
// briefing / Key Badge halving; false-positive and benign alerts pick a rule evenly (edition hooks still apply).
function alertThreatWeights(kind) {
  return MAL_WEIGHTS.map(x => {
    let w = kind === 'mal' ? x.w : 10;
    if (kind === 'mal' && G.brief[x.t] && G.brief[x.t] >= G.day) w *= 0.5;
    if (kind === 'mal' && G.badge && x.t === 'sprayer') w *= 0.5;
    if (typeof alertWeight === 'function') w = alertWeight(x.t, w);
    return {t: x.t, w: w};
  });
}
function genAlert(forceKind) {
  const kind = forceKind || weighted([{k: 'fp', w: G.fpWeight}, {k: 'benign', w: 30}, {k: 'mal', w: 20}]).k;
  const wts = alertThreatWeights(kind);
  const t = weighted(wts).t;
  const th = THREATS[t], tpl = ALERTS[t], v = tpl[kind];
  const chain = ALERT_CHAINS[t];
  const spec = {
    kind: kind, threat: t, tech: th.tech, tags: th.tags, story: false, group: 'a',
    title: tpl.rule, host: (typeof alertHost === 'function' && alertHost()) || pick(HOSTS) + ' · Front Desk',
    enemy: kind === 'mal' ? {spr: th.spr, pal: th.pal} : kind === 'fp' ? {spr: 'noise', pal: 'noise'} : {spr: 'player', pal: 'staffer'},
    clues: v.clues, truth: v.truth, resp: tpl.mal.resp,
    rate: kind === 'mal' ? 12 + Math.floor(rnd() * 5) : 8,
    chain: [{at: 40, text: chain[0]}, {at: 75, text: chain[1]}]
  };
  if (typeof alertDecorate === 'function') alertDecorate(spec);
  return spec;
}
async function randomAlert(src) {
  if (typeof editionQueue === 'function') return editionQueue(src);  // an edition without wild alerts says what happens instead
  if (!G.party.length) { await say('No tool on your console yet. Talk to Rae.'); return; }
  if (G.focus <= 0) { await say('You’re out of Focus. End your shift at your desk.'); return; }
  const spec = genAlert();
  await doBattle(spec);
}
async function openQueue() {
  if (typeof editionQueue === 'function') return editionQueue('queue');
  if (!G.party.length) { await say('No tool on your console yet. Talk to Rae.'); return; }
  if (G.queue <= 0) { await say('Alert queue: empty. New alerts arrive as the district works.'); return; }
  if (G.focus <= 0) { await say('You’re out of Focus. End your shift at your desk.'); return; }
  G.queue--;
  await doBattle(genAlert());
}

/* ---------- Battle ---------- */
function eff(spec) {
  const C = CLASSES[TOOLS[tool().id].cls];
  const tac = TECH[spec.tech].tactic, tags = spec.tags || [];
  if ((C.weakTags || []).some(t => tags.includes(t))) return 0.5;
  let strong = tac.some(t => C.strong.includes(t));
  if (C.needsLogs && !G.f.logs) strong = false;
  if ((C.strongTags || []).some(t => tags.includes(t))) strong = true;
  return strong ? 2 : 1;
}
function power() { const t = tool(); return (1 + 0.08 * (t.lvl - 3)) * (t.tuned ? 1.25 : 1); }
function effLabel(m) { return m >= 2 ? 'strong ×2' : m <= 0.5 ? 'weak ×0.5' : ''; }
