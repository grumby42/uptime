/* ---- engine/drill.js ---- */
/* ============================================================
   UPTIME · engine/drill.js
   Investigation drill: a new encounter type. One artefact, one question and a
   small query budget (usually 2). The player picks queries as (evidence source,
   question) pairs. Focused questions return a short, exact snippet for 1 Focus;
   broad ones return a wall of rows for 3 Focus; trap questions spend the budget
   and mislead. Then a verdict, the reasoning behind it, and alternative
   explanations the player ruled out (bonus). Credit needs evidence: with no
   decisive (key) query, a right verdict scores half and reasoning scores nothing,
   because that is a guess. An optional AI helper answers specific questions well
   and quietly truncates "everything".
   Inspired by Chris Sanders's Investigation Path posts (see CREDITS.md); every
   case is original. Drill data lives with each edition.

   Drill spec D:
   {id, title, intro(html), artefact(html), question, budget,
    sources: [{id, name, qs: [{q, kind: 'focus'|'broad'|'trap', key, res: [lines], wall: [row templates]}]}],
    ai: {everything: {text, wrong, reveal}, specific: {q, text}},
    verdicts: [{label, good, why, needs?, needsWhy?}], reasons: [{label, good, why}],
   A right verdict may name the source its claim rests on (needs: source id, or a list of ids when the
   claim rests on several). It then counts as supported only if a key query on each of those sources
   was run: a close that cites a log the player never read is a guess, however many other key queries
   they ran.
    alts: [{label, good, why}], altPick, path(html), response: [lines], techs: [ids], acts: [keys]}
   ============================================================ */
'use strict';

const DRILL_COST = {focus: 1, broad: 3, trap: 1};

function drillPre(lines, cls) {
  return '<pre class="art' + (cls ? ' ' + cls : '') + '">' + lines.map(esc).join('\n') + '</pre>';
}
// A wall of rows for a broad query: noisy template rows, with the one row that matters buried deep.
function drillWall(q) {
  const rows = [], tpl = q.wall || ['…'];
  const n = q.rows || 1240;
  for (let i = 0; i < 18; i++) {
    let r = tpl[i % tpl.length];
    const mm = String((7 + i * 3) % 60).padStart(2, '0'), ss = String((13 + i * 17) % 60).padStart(2, '0');
    r = r.replace(/\{t\}/g, mm + ':' + ss).replace(/\{n\}/g, String(100 + (i * 37) % 900)).replace(/\{i\}/g, String(i + 1));
    rows.push(r);
  }
  if (q.buried) rows.splice(15, 0, q.buried);
  rows.push('… ' + (n - rows.length).toLocaleString('en-US') + ' more rows');
  return '<p class="small">' + n.toLocaleString('en-US') + ' rows returned. You skim the first screen.</p>' + drillPre(rows, 'wall');
}
function drillFindings(st) {
  if (!st.findings.length) return '<p class="small">No queries yet.</p>';
  return st.findings.map(f => '<div class="find"><b>' + esc(f.head) + '</b>' + f.html + '</div>').join('');
}
function drillKeysLeft(D, st) {
  let n = 0;
  D.sources.forEach(s => s.qs.forEach(q => { if (q.key && !st.used.includes(q)) n++; }));
  return n;
}

async function doDrill(D) {
  const st = {budget: D.budget || 2, used: [], findings: [], broad: 0, trap: 0, keys: 0, keySrc: [], aiMode: null};
  UI.showPanel(false);
  touchCSF('Detect');
  const rules = '<p class="small">Query budget <b>' + st.budget + '</b>. A query is one evidence source plus one question. Focused questions return a short exact answer (1 Focus). Broad questions return a wall of rows (3 Focus). Then give a verdict and your reasoning, and name alternative explanations you ruled out. (Scoring is a game model.)</p>';
  await UI.openModal('Investigation drill · ' + D.title,
    D.intro + '<h3>Artefact</h3>' + D.artefact + '<p><b>Question:</b> ' + esc(D.question) + '</p>' + rules,
    [{label: 'Start investigating', meta: {good: true}}], {closable: false, cls: 'drill'});

  // ---- Queries ----
  while (true) {
    const keysLeft = drillKeysLeft(D, st);
    const items = D.sources.map(s => {
      const open = s.qs.filter(q => !st.used.includes(q));
      return {label: 'Query: ' + s.name, note: open.length + ' question' + (open.length === 1 ? '' : 's'),
        disabled: st.budget <= 0 || !open.length || G.focus < 1,
        meta: {src: s.id, good: st.budget > 0 && s.qs.some(q => q.key && !st.used.includes(q))}};
    });
    if (D.ai) items.push({label: 'Ask Tally (AI assistant)', note: 'no budget · 1 Focus', disabled: G.focus < 1, meta: {ai: true}});
    items.push({label: st.budget > 0 ? 'I have enough: decide' : 'Budget spent: decide', meta: {decide: true, good: st.budget <= 0 || keysLeft === 0}});
    const body = '<p>Budget left: <b>' + st.budget + '</b> · Focus <b>' + G.focus + '/' + G.focusMax + '</b></p>' +
      '<details><summary>Artefact</summary>' + D.artefact + '</details><p><b>Question:</b> ' + esc(D.question) + '</p><h3>Findings</h3>' + drillFindings(st);
    const i = await UI.openModal('Drill · ' + D.title, body, items, {shuffle: true, closable: false, cls: 'drill'});
    const m = items[i].meta;
    if (m.decide) break;
    if (m.ai) { await drillAI(D, st); continue; }
    const src = D.sources.find(s => s.id === m.src);
    const qs = src.qs.filter(q => !st.used.includes(q));
    const qi = qs.map(q => ({label: q.q, note: q.kind === 'broad' ? 'broad · 3 Focus' : '1 Focus', disabled: G.focus < DRILL_COST[q.kind], meta: {good: !!q.key}}));
    qi.push({label: 'Back', meta: {back: true}});
    const k = await UI.openModal('Query: ' + src.name, '<p>Which question do you put to the <b>' + esc(src.name) + '</b>?</p>', qi, {shuffle: true, closable: false, cls: 'drill'});
    if (qi[k].meta.back) continue;
    const q = qs[k];
    st.used.push(q); st.budget--;
    G.focus = Math.max(0, G.focus - DRILL_COST[q.kind]);
    let html;
    if (q.kind === 'broad') { st.broad++; html = drillWall(q); }
    else { if (q.kind === 'trap') st.trap++; if (q.key) { st.keys++; st.keySrc.push(src.id); } html = drillPre(q.res); }
    if (q.note) html += '<p class="small">' + esc(q.note) + '</p>';
    st.findings.push({head: src.name + ': ' + q.q, html: html});
    await UI.openModal('Result', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});
  }

  // ---- Verdict, reasoning, alternatives ----
  const ctx = '<h3>Findings</h3>' + drillFindings(st);
  const v = await UI.openModal('Verdict', '<p><b>' + esc(D.question) + '</b></p>' + ctx,
    D.verdicts.map(x => ({label: x.label, meta: {good: !!x.good}})), {shuffle: true, closable: false, cls: 'drill'});
  const r = await UI.openModal('Reasoning', '<p>Which reasoning supports your verdict best? Reason only from what your queries showed: reasoning about evidence you never looked at earns no credit.</p>' + ctx,
    D.reasons.map(x => ({label: x.label, meta: {good: !!x.good}})), {shuffle: true, closable: false, cls: 'drill'});
  const pickN = D.altPick || 2;
  const altItems = D.alts.map(x => ({label: x.label, meta: {good: !!x.good}})).concat([{label: 'Done: these are my ' + pickN, done: true, meta: {done: true}}]);
  const alts = await UI.openModal('Alternative explanations',
    '<p>Bonus: pick the <b>' + pickN + '</b> alternative explanations a careful analyst should name and rule out before closing this.</p>',
    altItems, {shuffle: true, multi: pickN, closable: false, cls: 'drill'});

  // ---- Score (game) and debrief ----
  const verdictOk = !!D.verdicts[v].good, reasonOk = !!D.reasons[r].good;
  const altOk = alts.filter(a => D.alts[a] && D.alts[a].good).length;
  const keyTotal = D.sources.reduce((n, s) => n + s.qs.filter(q => q.key).length, 0);
  const keyScore = Math.round(20 * Math.min(st.keys, Math.min(keyTotal, D.budget || 2)) / Math.min(keyTotal, D.budget || 2));
  const goodV = D.verdicts.find(x => x.good) || {};
  // needs: one source id, or a list of them (every one must have had a key query, e.g. two decisive sources).
  const needList = goodV.needs ? [].concat(goodV.needs) : [];
  const needsMissed = !!(needList.length && st.keys > 0 && needList.some(n => !st.keySrc.includes(n)));
  const supported = st.keys > 0 && !needsMissed;
  let score = (verdictOk ? (supported ? 40 : 20) : 0) + (reasonOk && supported ? 20 : 0) + keyScore + altOk * 10 - st.broad * 5 - st.trap * 5;
  score = clamp(score, 0, 100);
  const aiWrong = st.aiMode === 'everything' && D.ai && D.ai.everything.wrong;
  sfx(verdictOk ? (supported ? 'correct' : 'select') : 'wrong');  // the debrief says it in words too (right but unsupported: neutral)
  let h = '<p class="big">Score ' + score + ' / 100 <span class="small">(game)</span></p>';
  h += '<p><b>Verdict:</b> ' + esc(D.verdicts[v].label) + ' — ' + (verdictOk ? 'correct. ' : 'not supported. ') + esc(D.verdicts[v].why || '') + '</p>';
  if (!verdictOk) h += '<p><b>Better verdict:</b> ' + esc(D.verdicts.find(x => x.good).label) + '</p>';
  h += '<p><b>Reasoning:</b> ' + (reasonOk ? (supported ? 'sound. ' : 'sound in principle, but it rests on evidence you never queried (no credit). ') : 'weak. ') + esc(D.reasons[r].why || '') + '</p>';
  if (verdictOk && !supported) h += '<p><b>Unsupported:</b> ' + (needsMissed ? esc(goodV.needsWhy || 'the right answer, but it rests on evidence you never queried.') + ' In a real case that is a guess, and a guess can’t be defended in a report.' : 'the right answer, but none of your queries reached the decisive evidence. In a real case that is a guess, and a guess can’t be defended in a report.') + '</p>';
  h += '<p><b>Alternatives:</b> ' + altOk + ' of ' + pickN + ' worth ruling out.</p><ul>' +
    D.alts.filter(x => x.good).map(x => '<li>' + esc(x.label) + ': ' + esc(x.why) + '</li>').join('') + '</ul>';
  h += '<p><b>Queries:</b> ' + st.keys + ' focused on the decisive evidence' + (st.broad ? ', ' + st.broad + ' broad (a wall of rows costs time and Focus)' : '') + (st.trap ? ', ' + st.trap + ' that could only mislead' : '') + '.</p>';
  h += '<h3>The focused path</h3>' + D.path;
  if (st.aiMode) h += '<h3>About Tally</h3><p>' + esc(st.aiMode === 'everything' ? D.ai.everything.reveal : (st.keys ? 'You asked a specific question and checked it against the evidence. That is how an assistant helps.' : 'You asked a specific question, which is how an assistant helps. Tally was right this time, but you never confirmed its answer in the evidence yourself.')) + '</p>';
  h += '<h3>Response</h3><ul>' + D.response.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (D.techs.length) h += '<p class="small">ATT&amp;CK: ' + D.techs.map(t => esc(t + ' ' + TECH[t].name)).join(' · ') + '</p>';
  D.techs.forEach(t => unlock('tech', t));
  (D.acts || []).forEach(a => unlock('act', a));
  unlock('act', 'drill');
  await UI.openModal('Debrief · ' + D.title, h, [{label: 'Continue', meta: {good: true}}], {closable: false, cls: 'drill'});
  await gainXP(Math.round(score / 4));
  return {score: score, supported: supported, verdictOk: verdictOk, reasonOk: reasonOk, alts: altOk, keys: st.keys, broad: st.broad, trap: st.trap, ai: st.aiMode, aiWrong: aiWrong};
}

async function drillAI(D, st) {
  const items = [
    {label: 'Give Tally everything (paste all the logs) and ask for a verdict', meta: {mode: 'everything'}},
    {label: 'Ask Tally: “' + D.ai.specific.q + '”', meta: {mode: 'specific'}},
    {label: 'Back', meta: {back: true}}];
  const i = await UI.openModal('Tally · AI assistant', '<p>Tally runs on your console. It answers in seconds. It can be wrong.</p>', items, {closable: false, cls: 'drill'});
  const m = items[i].meta;
  if (m.back) return;
  G.focus = Math.max(0, G.focus - 1);
  if (!st.aiMode || m.mode === 'everything') st.aiMode = m.mode;
  const a = m.mode === 'everything' ? D.ai.everything.text : D.ai.specific.text;
  const html = drillPre(['Tally: ' + a], 'ai');
  st.findings.push({head: 'Tally (AI): ' + (m.mode === 'everything' ? 'everything' : D.ai.specific.q), html: html});
  await UI.openModal('Tally says', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});
}

/* ---- engine/game.js ---- */
/* ============================================================
   UPTIME · engine/game.js
   Shared game core: overworld, rendering, HUD, script runner, investigations
   (battles), alerts, scorecard, Field Manual, menus, save/load, title, main loop,
   debug hooks for tests. Each edition supplies its data and story (EDITION,
   newState, objective, interact, triggers, editionTile, summary, introScript...).
   ============================================================ */
'use strict';

let G = null;          // saved game state
let B = null;          // current battle (not saved)
let busy = 0;          // running scripts
let moving = null;     // current step animation
let fade = 0;          // map transition fade (0..1)
let started = false;   // past the title screen
let lastT = 0, encCooldown = 0, shake = 0, titleOpen = false;

const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};

/* ---------- Helpers ---------- */
// A named speaker standing on this map turns to face the player while speaking (talks and walk-triggered scenes alike).
const say = (t, who) => { faceSpeaker(who); return UI.say(t, who); };
const choose = (p, items, o) => UI.choose(p, items, o);
function toast(msg, ms) { UI.toast(msg, ms); }  // engine.js: on the map in #toast, in the modal's toast lane while a modal is open
function unlock(kind, key) { if (!G.fm[kind + ':' + key]) { G.fm[kind + ':' + key] = true; return true; } return false; }
function touchCSF(fn) { if (!G.csf[fn]) { G.csf[fn] = true; toast('CSF ' + fn + ' unlocked in the Field Manual'); } }
function groupFixed(g) { return !!G.f[GROUPS[g].fix]; }
function tool() { return G.party[G.active]; }
function toolName(t) { return TOOLS[t.id].name + (t.tuned ? ' · Tuned' : ''); }
// A tool that evolved from another still counts as having it (EVOLVED_FROM, edition data), so earlier checks keep working.
function hasTool(id) { return G.party.some(t => t.id === id || EVOLVED_FROM[t.id] === id); }
function addTool(id, lvl) { if (!hasTool(id)) G.party.push({id: id, lvl: lvl || 3, xp: 0, tuned: false}); }
function npcHere(map, x, y) { return NPCS.find(n => n.map === map && n.x === x && n.y === y && (!n.cond || n.cond(G))); }
function mapRows(m) { return MAPS[m].rows; }

/* ---------- Metrics ---------- */
function metricVals() {
  const m = G.m;
  return {
    closed: m.closed,
    acc: m.judged ? Math.round(m.correctShown / m.judged * 100) : null,
    tta: m.ttaN ? +(m.ttaSum / m.ttaN).toFixed(1) : null,
    esc: m.esc ? Math.round(m.escOk / m.esc * 100) : null,
    evid: m.judged ? Math.round((m.evOk || 0) / m.judged * 100) : null,
    uptime: +G.uptime.toFixed(2),
    mfa: Math.round(G.mfaSet.length / ACCOUNTS_TOTAL * 100),
    patch: Math.round(Object.keys(GROUPS).filter(groupFixed).length / 4 * 100),
    ...(typeof editionMetricVals === 'function' ? editionMetricVals() : {})
  };
}
const METRICS = [
  {k: 'closed', label: 'Alerts closed (read with accuracy)', unit: '', higher: true},
  {k: 'acc', label: 'Verdict accuracy', unit: '%', higher: true},
  {k: 'evid', label: 'Verdicts with evidence ≥ 40', unit: '%', higher: true},
  {k: 'tta', label: 'Time to acknowledge (game seconds)', unit: ' s', higher: false},
  {k: 'esc', label: 'Escalation precision (real, with evidence ÷ all)', unit: '%', higher: true},
  {k: 'uptime', label: 'District uptime', unit: '%', higher: true},
  {k: 'mfa', label: 'MFA coverage', unit: '%', higher: true},
  {k: 'patch', label: 'Hardening (baseline fixes)', unit: '%', higher: true}
];
// An edition with its own scorecard (EDITION.ownMetrics) replaces the analyst metrics above with EDITION_METRICS.
if (typeof EDITION !== 'undefined' && EDITION.ownMetrics) METRICS.length = 0;
if (typeof EDITION_METRICS !== 'undefined') METRICS.push(...EDITION_METRICS);
function track() {
  const v = metricVals();
  for (const d of METRICS) {
    if (d.when && !d.when()) continue;
    const x = v[d.k]; if (x === null || x === undefined) continue;
    const t = G.track[d.k] || (G.track[d.k] = {best: x, worst: x});
    if (d.higher) { t.best = Math.max(t.best, x); t.worst = Math.min(t.worst, x); }
    else { t.best = Math.min(t.best, x); t.worst = Math.max(t.worst, x); }
  }
}
function bumpUptime(d) { G.uptime = clamp(+(G.uptime + d).toFixed(3), 99.0, 100); track(); }

/* ---------- Tiles ---------- */
function tileChar(map, x, y) { const r = mapRows(map); if (y < 0 || y >= r.length || x < 0 || x >= r[0].length) return null; return r[y][x]; }
function tileDef(map, x, y) {
  const ch = tileChar(map, x, y); if (ch === null) return null;
  let d = Object.assign({ch: ch}, TILES[ch]);
  if (d.group) { const lit = groupFixed(d.group); d.spr = lit ? 'L' : 'B'; d.pal = lit ? 'L' : 'B'; }
  if (d.spr === 'exit') { const r = mapRows(map); d.spr = x === 0 ? 'exitL' : x === r[0].length - 1 ? 'exitR' : y === 0 ? 'exitU' : 'exit'; } // the arrow points out through its wall
  return editionTile(d, ch, x, y);
}
function doorAt(map, x, y) { const d = MAPS[map].doors; return d && d[x + ',' + y]; }
function blocked(map, x, y) {
  const d = tileDef(map, x, y); if (!d) return true;
  if (d.solid) return true;
  const door = doorAt(map, x, y); if (door && door.locked) return true;
  if (npcHere(map, x, y)) return true;
  return false;
}

/* ---------- Rendering ---------- */
function camera() {
  const r = mapRows(G.map), mw = r[0].length * TS, mh = r.length * TS;
  let px = G.x * TS, py = G.y * TS;
  if (moving) { const t = moving.t; px = (moving.fx + (moving.tx - moving.fx) * t) * TS; py = (moving.fy + (moving.ty - moving.fy) * t) * TS; }
  let cx = mw <= VW ? -(VW - mw) / 2 : clamp(px + 8 - VW / 2, 0, mw - VW);
  let cy = mh <= VH ? -(VH - mh) / 2 : clamp(py + 8 - VH / 2, 0, mh - VH);
  return {cx: Math.round(cx), cy: Math.round(cy), px: px, py: py};
}
let npcFace = {};  // NPC id -> facing: NPCs in the current conversation or scene face the player until it ends (run(), busy -> 0)
let drawnEnts = [];  // what the last world frame drew (characters: sprite key, facing, screen position); read by tests
let drawnWanted = false;  // drawnEnts is only built once a test asks for it (__UPTIME.drawn), so normal play allocates nothing for it
// Turn the NPC named `who` (if they stand on this map and are present) to face the player, by the dominant axis.
function faceSpeaker(who) {
  if (!who || !G || !started) return;
  for (const n of NPCS) {
    if (n.name !== who || n.map !== G.map || (n.cond && !n.cond(G))) continue;
    const dx = G.x - n.x, dy = G.y - n.y;
    if (dx || dy) npcFace[n.id] = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
}
const OPP_DIR = {up: 'down', down: 'up', left: 'right', right: 'left'};
function drawWorld(ctx) {
  ctx.fillStyle = Settings.col('#10141f'); ctx.fillRect(0, 0, VW, VH);
  const r = mapRows(G.map), cam = camera();
  const x0 = Math.max(0, Math.floor(cam.cx / TS)), y0 = Math.max(0, Math.floor(cam.cy / TS));
  const x1 = Math.min(r[0].length - 1, Math.floor((cam.cx + VW) / TS)), y1 = Math.min(r.length - 1, Math.floor((cam.cy + VH) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = tileDef(G.map, x, y);
    const sx = x * TS - cam.cx, sy = y * TS - cam.cy;
    if (d.under) { const u = TILES[d.under]; ctx.drawImage(sprite(u.spr, u.pal), sx, sy); }
    ctx.drawImage(sprite(d.spr, d.pal), sx, sy);
    const badge = stateBadge(d.pal); if (badge) drawBadge(ctx, badge, sx, sy);  // fixed / isolated: a shape, not only a colour
  }
  // entities sorted by y
  // NPCs keep their configured facing, except those speaking to the player, who turn to face them (npcFace).
  const ents = NPCS.filter(n => n.map === G.map && (!n.cond || n.cond(G))).map(n => ({id: n.id, x: n.x * TS, y: n.y * TS, spr: n.spr || 'player', pal: n.pal, dir: npcFace[n.id] || n.dir}));
  // Walk cycle: a stepping frame for the middle half of each tile-to-tile move, standing otherwise; the stepping frame
  // alternates feet on successive steps (1 on even G.steps, 2 on odd), so the walk reads left, right, left...
  const walkFrame = moving && moving.t > 0.25 && moving.t < 0.75 ? 1 + (G.steps & 1) : 0;
  ents.push({id: 'me', x: cam.px, y: cam.py, spr: 'player', pal: 'player', dir: G.dir, me: true, step: walkFrame});
  ents.sort((a, b) => a.y - b.y);
  if (drawnWanted) drawnEnts.length = 0;
  for (const e of ents) {
    const key = facingKey(e.spr, e.dir, e.step), sx = Math.round(e.x - cam.cx), sy = Math.round(e.y - cam.cy - (e.step ? 1 : 0));
    ctx.drawImage(sprite(key, e.pal), sx, sy);
    if (drawnWanted) drawnEnts.push({id: e.id, key: key, pal: e.pal, dir: e.dir, x: sx, y: sy});
  }
  drawMarker(ctx, cam);

}
function ellipse(ctx, cx, cy, rx, ry, c1, c2) {
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) {
    const d = (x / rx) ** 2 + (y / ry) ** 2;
    if (d <= 1) { ctx.fillStyle = d > 0.7 ? c1 : c2; ctx.fillRect(cx + x, cy + y, 1, 1); }
  }
}
// Battle scene layout in logical pixels (the alert card and tool card are HTML, placed by style.css; tests read this).
const BATTLE_LAYOUT = {enemy: {x: 236, y: 42, w: 32, h: 32}, enemyPad: {cx: 252, cy: 76, rx: 40, ry: 7},
  tool: {x: 52, y: 112, w: 32, h: 32}, toolPad: {cx: 68, cy: 146, rx: 44, ry: 7}};
let platformCache = null;
function drawBattle(ctx) {
  const L = BATTLE_LAYOUT;
  if (!platformCache || platformCache.pal !== Settings.v.palette) {
    const c = document.createElement('canvas'); c.width = VW; c.height = VH0;
    const x = c.getContext('2d'), k = Settings.col.bind(Settings);
    x.fillStyle = k('#dbeaf7'); x.fillRect(0, 0, VW, 96);
    x.fillStyle = k('#c9e3a8'); x.fillRect(0, 96, VW, VH0 - 96);
    ellipse(x, L.enemyPad.cx, L.enemyPad.cy, L.enemyPad.rx, L.enemyPad.ry, k('#5aa64b'), k('#a6d96a'));
    ellipse(x, L.toolPad.cx, L.toolPad.cy, L.toolPad.rx, L.toolPad.ry, k('#5aa64b'), k('#a6d96a'));
    c.pal = Settings.v.palette; platformCache = c;
  }
  ctx.drawImage(platformCache, 0, 0);
  if (!B) return;
  const sh = shake > 0 && !Settings.calm() ? Math.round((Math.random() - 0.5) * 4) : 0;
  let es = B.spec.enemy;
  if (!B.spec.story && !B.revealed) es = {spr: 'beacon', pal: 'beacon'};
  const bob = Settings.calm() ? 0 : Math.round(Math.sin(performance.now() / 300) * 1);
  ctx.drawImage(sprite(es.spr, es.pal), L.enemy.x + sh, L.enemy.y + bob, L.enemy.w, L.enemy.h);
  const t = tool();
  if (t) ctx.drawImage(sprite(TOOLS[t.id].spr, TOOLS[t.id].spr, {variant: t.tuned ? 'tuned' : ''}), L.tool.x, L.tool.y, L.tool.w, L.tool.h);
}

/* ---------- HUD ---------- */
// The HUD is its own band above the map (never over it); the objective wraps instead of being cut off.
let hudStr = '';
function hudUpdate() {
  const el = document.getElementById('hud');
  if (!G || !started || B) { el.classList.add('off'); return; }
  el.classList.remove('off');
  const v = metricVals();
  const st = typeof hudStatus === 'function' ? hudStatus(v) : 'Day ' + G.day + ' · ' + G.rank + ' · Focus ' + G.focus + '/' + G.focusMax + ' · Queue ' + G.queue + ' · Up ' + v.uptime.toFixed(2) + '%';
  const ob = objective().text;
  if (st + '|' + ob !== hudStr) {
    const lines = hudLines();
    hudStr = st + '|' + ob;
    el.firstChild.textContent = st; el.lastChild.textContent = '▸ ' + ob;
    if (hudLines() !== lines) Screen.fit(); // the band grew or shrank: refit the map below it
  }
}
function hudLines() { const el = document.getElementById('hud'); return el ? Math.round(el.getBoundingClientRect().height) : 0; }

/* ---------- Objective marker ---------- */
// A small bouncing marker on the door that leads toward the current objective (or on the objective's own door).
function markerDoor() {
  if (!G || !started) return null;
  const o = objective(); if (!o || !o.map || o.done) return null;
  if (o.map === G.map) { const d = doorAt(G.map, o.x, o.y); return d && d.to && !d.locked ? {x: o.x, y: o.y} : null; }
  const prev = new Map([[G.map, null]]), q = [G.map];
  while (q.length) {
    const m = q.shift();
    if (m === o.map) { let k = m, hop = null; while (prev.get(k)) { hop = prev.get(k); k = hop[0]; } const [x, y] = hop[1].split(',').map(Number); return {x: x, y: y}; }
    const ds = MAPS[m].doors || {};
    for (const xy in ds) { const d = ds[xy]; if (d.to && !d.locked && !prev.has(d.to)) { prev.set(d.to, [m, xy]); q.push(d.to); } }
  }
  return null;
}
const MARKER_ROWS = ['1111111', '1444441', '0144410', '0014100', '0001000'];
function drawMarker(ctx, cam) {
  const d = markerDoor(); if (!d) return;
  const bob = Settings.calm() ? 0 : Math.round(Math.sin(performance.now() / 220) * 1.5);
  const cx = d.x * TS - cam.cx + 8, cy = d.y * TS - cam.cy + 3 + bob;
  // a gold down-pointing chevron with a dark outline, inside the door tile
  const edge = Settings.col('#1b2233'), gold = Settings.col('#ffd96a');
  for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 7; xx++) { const c = MARKER_ROWS[yy][xx]; if (c === '0') continue; ctx.fillStyle = c === '1' ? edge : gold; ctx.fillRect(cx - 3 + xx, cy + yy, 1, 1); }
}

/* ---------- Script runner ---------- */
async function run(fn) {
  busy++;
  try { await fn(); }
  catch (e) { console.error(e); }
  finally {
    busy--;
    if (!busy) { npcFace = {}; UI.hidePanel(); hudUpdate(); autosave(); }
  }
}
function autosave() { if (G && started && !B) storeSet(encodeSave(G)); }

/* ---------- Movement ---------- */
function tryMove(dir) {
  G.dir = dir;
  const [dx, dy] = DIRS[dir];
  const tx = G.x + dx, ty = G.y + dy;
  const door = doorAt(G.map, tx, ty);
  if (door && door.locked) { run(async () => { await say(door.locked); }); return; }
  if (blocked(G.map, tx, ty)) return;
  moving = {fx: G.x, fy: G.y, tx: tx, ty: ty, t: 0};
}
function stepDone() {
  G.x = moving.tx; G.y = moving.ty; moving = null;
  G.steps++;
  if (G.f.logs) G.m.events += 37 + Math.floor(rnd() * 20);
  if (G.steps % 12 === 0 && G.f.starter) G.queue = Math.min(9, G.queue + 1);
  if (G.auto && G.steps % 15 === 0 && G.queue > 0 && hasTool('ledger')) {
    if (rnd() < G.fpWeight / (G.fpWeight + 50) * 0.8) {
      G.queue--; G.m.autoClosed++;
      toast('Ledger auto-closed a known false positive');
      if (rnd() < 0.02) {
        // A real alert was auto-closed. A weekly sample review catches about half of those (game).
        if (G.autoReview && rnd() < 0.5) { G.queue = Math.min(9, G.queue + 1); toast('Weekly sample: a person caught a real alert Ledger had auto-closed. It is back in the queue.'); }
        else G.m.missed++;
      }
    }
  }
  if (encCooldown > 0) encCooldown--;
  const door = doorAt(G.map, G.x, G.y);
  if (door && door.to) { run(() => warp(door.to, door.x, door.y, door.dir)); return; }
  if (triggers()) return;
  const d = tileDef(G.map, G.x, G.y);
  if (d.grass && G.party.length && encCooldown <= 0 && rnd() < 0.12) {

    run(async () => { await randomAlert('grass'); });
  }
}
async function warp(map, x, y, dir) {
  const still = UI.turbo || Settings.calm();  // reduced flashing: no fade to dark between rooms
  if (!still) for (let i = 1; i <= 6; i++) { fade = i / 6; await sleep(25); }
  G.map = map; G.x = x; G.y = y; G.dir = dir || G.dir;
  if (!still) for (let i = 5; i >= 0; i--) { fade = i / 6; await sleep(25); }
  fade = 0;
}

/* ---------- Alerts ---------- */
// Threat for an alert. Only malicious alerts use the entry-route weights (MAL_WEIGHTS, game) and the
// briefing / Key Badge halving; false-positive and benign alerts pick a rule evenly (edition hooks still apply).
function alertThreatWeights(kind) {
  return MAL_WEIGHTS.map(x => {
    let w = kind === 'mal' ? x.w : 10;
    if (kind === 'mal' && G.brief[x.t] && G.brief[x.t] >= G.day) w *= 0.5;
    if (kind === 'mal' && G.badge && x.t === 'sprayer') w *= 0.5;
    if (typeof alertWeight === 'function') w = alertWeight(x.t, w);
    return {t: x.t, w: w};
  });
}
function genAlert(forceKind) {
  const kind = forceKind || weighted([{k: 'fp', w: G.fpWeight}, {k: 'benign', w: 30}, {k: 'mal', w: 20}]).k;
  const wts = alertThreatWeights(kind);
  const t = weighted(wts).t;
  const th = THREATS[t], tpl = ALERTS[t], v = tpl[kind];
  const chain = ALERT_CHAINS[t];
  const spec = {
    kind: kind, threat: t, tech: th.tech, tags: th.tags, story: false, group: 'a',
    title: tpl.rule, host: (typeof alertHost === 'function' && alertHost()) || pick(HOSTS) + ' · Front Desk',
    enemy: kind === 'mal' ? {spr: th.spr, pal: th.pal} : kind === 'fp' ? {spr: 'noise', pal: 'noise'} : {spr: 'player', pal: 'staffer'},
    clues: v.clues, truth: v.truth, resp: tpl.mal.resp,
    rate: kind === 'mal' ? 12 + Math.floor(rnd() * 5) : 8,
    chain: [{at: 40, text: chain[0]}, {at: 75, text: chain[1]}]
  };
  if (typeof alertDecorate === 'function') alertDecorate(spec);
  return spec;
}
async function randomAlert(src) {
  if (typeof editionQueue === 'function') return editionQueue(src);  // an edition without wild alerts says what happens instead
  if (!G.party.length) { await say('No tool on your console yet. Talk to Rae.'); return; }
  if (G.focus <= 0) { await say('You’re out of Focus. End your shift at your desk.'); return; }
  const spec = genAlert();
  await doBattle(spec);
}
async function openQueue() {
  if (typeof editionQueue === 'function') return editionQueue('queue');
  if (!G.party.length) { await say('No tool on your console yet. Talk to Rae.'); return; }
  if (G.queue <= 0) { await say('Alert queue: empty. New alerts arrive as the district works.'); return; }
  if (G.focus <= 0) { await say('You’re out of Focus. End your shift at your desk.'); return; }
  G.queue--;
  await doBattle(genAlert());
}

/* ---------- Battle ---------- */
function eff(spec) {
  const C = CLASSES[TOOLS[tool().id].cls];
  const tac = TECH[spec.tech].tactic, tags = spec.tags || [];
  if ((C.weakTags || []).some(t => tags.includes(t))) return 0.5;
  let strong = tac.some(t => C.strong.includes(t));
  if (C.needsLogs && !G.f.logs) strong = false;
  if ((C.strongTags || []).some(t => tags.includes(t))) strong = true;
  return strong ? 2 : 1;
}
function power() { const t = tool(); return (1 + 0.08 * (t.lvl - 3)) * (t.tuned ? 1.25 : 1); }
function effLabel(m) { return m >= 2 ? 'strong ×2' : m <= 0.5 ? 'weak ×0.5' : ''; }
function bhud() {
  const card = document.getElementById('bcard'), tp = document.getElementById('btool');
  document.getElementById('screen').classList.toggle('battle', !!B);
  if (document.body.classList.contains('inbattle') !== !!B) { document.body.classList.toggle('inbattle', !!B); Screen.fit(); }
  if (!B) { card.classList.remove('show'); tp.classList.remove('show'); return; }
  const s = B.spec, t = tool();
  card.innerHTML = '<div class="bt">ALERT · ' + esc(s.title) + '</div><div class="bs">' + esc(s.host) + '</div>' +
    bar('Evidence', B.ev, Settings.barCol('ev')) + bar('Dwell', B.dwell, Settings.barCol('dwell'), '', 'hatch');
  tp.innerHTML = '<div class="bt">' + esc(toolName(t).toUpperCase()) + ' · Lv ' + t.lvl + '</div><div class="bs">' + CLASSES[TOOLS[t.id].cls].label + ' · ' + TOOLS[t.id].sub + '</div>' +
    bar('Focus', G.focus / G.focusMax * 100, Settings.barCol('focus'), G.focus + '/' + G.focusMax);
  card.classList.add('show'); tp.classList.add('show');
}
function bar(label, pct, color, txt, cls) {
  return '<div class="bar"><span class="bl">' + label + '</span><span class="bo"><span class="bi' + (cls ? ' ' + cls : '') + '" style="width:' + clamp(pct, 0, 100).toFixed(0) + '%;background-color:' + color + '"></span></span>' + (txt ? '<span class="bn">' + txt + '</span>' : '<span class="bn">' + Math.round(clamp(pct, 0, 100)) + '</span>') + '</div>';
}
async function fightStory(spec, retryMsg) {
  while (true) {
    G.focus = G.focusMax;
    const r = await doBattle(Object.assign({}, spec));
    if (r === 'win') return;
    await say(retryMsg);
  }
}
async function doBattle(spec) {
  B = {spec: spec, ev: spec.ev0 || 0, dwell: spec.dwell0 || 0, clue: 0, disrupt: 0, t0: performance.now(), acked: false, revealed: false, chainI: 0};
  UI.showPanel(true);
  bhud();
  G.focus = Math.max(0, G.focus - 1);
  sfx('battle');
  let result = null;
  try {
    await say((spec.story ? 'INCIDENT! ' : 'ALERT! ') + spec.title + '. (' + spec.host + ')');
    while (result === null) {
      bhud();
      const t = tool();
      const m = eff(spec);
      const items = TOOLS[t.id].abil.map(k => {
        const a = ABIL[k];
        return {label: a.name + ' (' + a.cost + ')', note: (a.type === 'inv' ? 'investigate' : 'contain') + (effLabel(m) ? ' · ' + effLabel(m) : ''),
          disabled: a.cost > G.focus, meta: {kind: 'ability', key: k, type: a.type, cost: a.cost, eff: m, disrupt: a.disrupt || 0}};
      });
      items.push({label: 'Close alert', note: 'verdict + response', meta: {kind: 'close'}});
      items.push({label: 'Switch tool', disabled: G.party.length < 2, meta: {kind: 'switch'}});
      if (!spec.story) items.push({label: G.rank === 'Intern' ? 'Ask Rae (escalate)' : /^Tier [23]/.test(G.rank) ? 'Escalate to Rae (incident lead)' : /team lead$/.test(G.rank) ? 'Hand to the district lead' : 'Escalate to Tier 2', note: 'bring evidence', meta: {kind: 'escalate'}});
      const lastClue = B.clue > 0 ? 'Latest: ' + spec.clues[B.clue - 1] : 'What do you check first?';
      const i = await choose(lastClue, items, {cols: 2});
      const meta = items[i].meta;
      if (!B.acked && meta.kind !== 'switch') ackNow();
      if (meta.kind === 'ability') { await useAbility(meta.key, m); }
      else if (meta.kind === 'switch') {
        const opts = G.party.map((p, j) => ({label: toolName(p) + ' Lv ' + p.lvl, disabled: j === G.active, meta: {idx: j}})).concat([{label: 'Back'}]);
        const j = await choose('Switch to which tool? (Takes a moment: the attacker gets a step.)', opts, {cancel: true});
        if (j < 0 || j >= G.party.length) continue;
        G.active = j; bhud();
        await say(toolName(tool()) + ' takes over.');
      } else if (meta.kind === 'close') {
        const r = await closeFlow(); if (r === 'back') continue;
        if (r) { result = r; break; }
      } else if (meta.kind === 'escalate') {
        result = await escalate(); break;
      }
      // the clock / attacker moves
      const r2 = await attackerStep(); if (r2) { result = r2; break; }
      if (G.focus <= 0) {
        await say('Your Focus is spent. The shift ends; this alert waits in the queue overnight.');
        G.queue++; G.f.overnight = true; result = 'shift';
      }
    }
  } finally {
    B = null; bhud(); UI.showPanel(false);
  }
  track();
  if (result === 'shift') await endShift('focus');
  if (result !== 'shift' && !spec.story) await evolveCheck();
  return result;
}
function ackNow() {
  B.acked = true;
  const s = (performance.now() - B.t0) / 1000;
  G.m.ttaSum += Math.min(s, 120); G.m.ttaN++;
}
async function useAbility(k, m) {
  const a = ABIL[k], s = B.spec;
  G.focus -= a.cost;
  unlock('act', k);
  if (typeof onAbility === 'function') onAbility(k, B);
  if (!Settings.calm()) shake = 300;
  if (a.type === 'inv') {
    let gain = a.ev * m * power();
    if (a.social && (s.tags || []).includes('voice')) gain *= 1.5;
    if (a.fpBonus && s.kind !== 'mal') gain *= 1.5;
    B.ev = clamp(B.ev + gain, 0, 100);
    bhud();
    if (B.clue < s.clues.length) { const c = s.clues[B.clue++]; await say(a.name + ': ' + c); }
    else await say(a.name + ': nothing new, but it confirms the picture. Evidence ' + Math.round(B.ev) + '.');
  } else {
    B.disrupt += a.disrupt || 0;
    B.ev = clamp(B.ev + (a.ev || 0), 0, 100);
    if (s.kind === 'mal') {
      B.dwell = clamp(B.dwell - a.dw * m * power(), 0, 100); bhud();
      await say(a.name + ': applied. The suspicious activity pauses; dwell pushed back.');
    } else {
      bhud();
      await say(a.name + ': applied.' + (a.disrupt ? ' Someone’s work is interrupted while it’s in place.' : ''));
    }
  }
}
async function attackerStep() {
  const s = B.spec;
  B.dwell = clamp(B.dwell + (s.rate || 8), 0, 100); bhud();
  if (s.kind === 'mal' && s.chain && B.chainI < s.chain.length && B.dwell >= s.chain[B.chainI].at) {
    const c = s.chain[B.chainI++];
    if (B.ev >= 25 || s.story) await say('Activity: ' + c.text);
  }
  if (B.dwell >= 100) {
    if (s.kind === 'mal') {
      await say('Dwell is full: the alert escalates without you and the attacker advances. Rae’s team takes over.');
      G.health[s.group] = Math.max(0, G.health[s.group] - 15); bumpUptime(-0.03); G.rep -= 3;
      return s.story ? 'lose' : 'escalated';
    }
    await say('Timed out. Tier 2 picked it up and closed it.');
    G.rep -= 2;
    return 'timeout';
  }
  return null;
}
async function closeFlow() {
  const s = B.spec;
  const v = await choose('Verdict?', [
    {label: 'False positive', note: 'the rule is wrong', meta: {verdict: 'fp'}},
    {label: 'Benign', note: 'real, but expected', meta: {verdict: 'benign'}},
    {label: 'Malicious', note: 'an attack', meta: {verdict: 'mal'}},
    {label: 'Back', meta: {back: true}}], {cancel: true, cursor: 3}); // fixed scale; the highlight starts on Back, never on a verdict
  if (v < 0 || v === 3) return 'back';
  const verdict = ['fp', 'benign', 'mal'][v];
  let resp;
  if (verdict === 'fp') resp = [{label: 'Close and file a tuning request for the noisy rule', good: true, tune: true}, {label: 'Close as false positive', good: true}];
  else if (verdict === 'benign') resp = [{label: 'Close and note why it’s expected', good: true}, {label: 'Close', good: true}];
  else resp = s.resp;
  const ri = await choose('Response?', resp.map(r => ({label: r.label, meta: {good: !!r.good}})).concat([{label: 'Back', meta: {back: true}}]), {shuffle: true, cancel: true});
  if (ri < 0 || ri === resp.length) return 'back';
  const r = resp[ri];
  const correct = verdict === s.kind;
  if (s.story) {
    if (!correct) { sfx('wrong'); await say('Rae: Not that verdict. Look at the evidence again.'); return null; }
    if (!r.good) { sfx('wrong'); await say('Rae: Right verdict, wrong response.' + (r.why ? ' ' + r.why : ' Think about what actually stops this attacker.')); if (r.disrupt) { bumpUptime(-0.01 * r.disrupt); } return null; }
  }
  // scoring
  G.m.closed++; G.m.today++; G.m.judged++;
  if (B.ev >= 40) G.m.evOk = (G.m.evOk || 0) + 1;
  B.revealed = correct || s.kind !== 'mal';
  const fresh = unlock('tech', s.tech);
  touchCSF('Detect');
  let xp = 10 + Math.floor(B.ev / 10);
  let msg = '';
  if (correct) {
    G.m.correctShown++;
    msg = 'Correct. ' + s.truth;
    if (s.kind === 'mal') {
      xp += 10; touchCSF('Respond');
      if (!r.good) { xp = Math.floor(xp / 2); msg += r.why ? ' Right call, weak response: ' + r.why : ' Right call, heavy-handed response.'; }
      if (r.disrupt) { G.rep -= 2 * r.disrupt; bumpUptime(-0.01 * r.disrupt); }
    }
    if (verdict === 'fp' && r.tune) { G.fpWeight = Math.max(25, G.fpWeight - 4); msg += ' Tuning request accepted: fewer false positives from now on.'; }
  } else if (s.kind === 'mal') {
    // a missed attack: nobody knows yet
    G.m.correctShown++; G.m.missed++;
    msg = 'Closed.'; xp = 4;
  } else {
    msg = 'Rae reviewed it: ' + s.truth;
    xp = 3; if (verdict === 'mal') G.rep -= 2;
  }
  if (s.kind !== 'mal' && B.disrupt > 0) {
    G.rep -= 3 * B.disrupt; bumpUptime(-0.01 * B.disrupt); G.m.overreact++;
    msg += ' But you disrupted people’s work for an alert that wasn’t an attack: reputation and uptime drop.';
  }
  if (s.kind === 'fp') { G.focus = Math.max(0, G.focus - 2); msg += ' (False positives drain Focus: −2.)'; }
  // A missed attack sounds like any close (nobody knows yet); a reviewed wrong verdict sounds wrong.
  sfx(correct && (s.kind !== 'mal' || r.good) ? 'correct' : correct || s.kind === 'mal' ? 'select' : 'wrong');
  await say(msg);
  if (correct && s.kind === 'mal' && r.good && !s.story) await scopeQuestion();
  if (typeof onAlertClosed === 'function') await onAlertClosed(s, verdict, correct, r);
  await say('ATT&CK: the rule maps to ' + s.tech + ' ' + TECH[s.tech].name + ' (' + TECH[s.tech].tactic.join(', ') + ').' + (fresh ? ' Added to the Field Manual.' : ''));
  await gainXP(xp + (s.story ? 20 : 0));
  return s.story ? 'win' : 'closed';
}
// Contain -> scope -> recover: one question after a correct malicious close. Every answer is a fair next step.

    {label: 'Access it added', note: 'accounts, MFA devices, sessions', meta: {good: true}, reply: 'Good: new accounts, rogue MFA devices and live sessions are how attackers walk back in.'},
    {label: 'What it left behind', note: 'persistence on the host', meta: {good: true}, reply: 'Good: scheduled tasks, new services and startup entries can outlive the fix.'}];

// Escalation is judged on evidence: a real attack sent up with Evidence under 40 is not a good escalation.
async function escalate() {
  const s = B.spec, intern = G.rank === 'Intern', to = intern || /^Tier [23]/.test(G.rank) ? 'Rae' : /team lead$/.test(G.rank) ? 'The district lead' : 'Tier 2';
  G.m.esc++; G.m.closed++; G.m.today++; G.m.judged++; B.revealed = true;
  if (B.ev >= 40) G.m.evOk = (G.m.evOk || 0) + 1;

  if (s.kind === 'mal') {
    G.m.correctShown++; touchCSF('Respond');
    if (B.ev < 40) {
      sfx('wrong');
      await say(to + ' confirms it’s real: ' + s.truth + ' But you sent it up with almost no evidence (' + Math.round(B.ev) + '). Next time, gather some first: say what you saw and why it matters.');
      await gainXP(8); return 'closed';

async function gainXP(n) {
  const t = tool(); if (!t) return;
  t.xp += n;
  let ups = 0;
  while (t.xp >= 20 * t.lvl) { t.xp -= 20 * t.lvl; t.lvl++; ups++; }
  if (ups) await say(toolName(t) + ' reached Lv ' + t.lvl + '! (+' + n + ' XP)');
}

}
function fmUnlocked(e) { return e.key.startsWith('csf:') ? !!G.csf[e.key.slice(4)] : !!G.fm[e.key]; }
function fmPct() { const e = fmEntries(); return Math.round(e.filter(fmUnlocked).length / e.length * 100); }
function fmHtml() {
  const e = fmEntries(); let cat = '', h = '<p>' + fmPct() + '% complete. ' + (EDITION.fmIntro || 'Descriptions are our own words; IDs are from MITRE ATT&amp;CK.') + '</p>';
  for (const x of e) {
    if (x.cat !== cat) { cat = x.cat; h += '<h3>' + esc(cat) + '</h3>'; }
    h += fmUnlocked(x) ? '<div class="fm"><b>' + esc(x.name) + '</b><br>' + esc(x.desc) + '</div>' : '<div class="fm lock">??? (not met yet)</div>';
  }
  h += qtFmHtml();
  h += '<h3>Game rules (invented)</h3>' + GAME_NOTES.map(n => '<div class="fm">' + esc(n) + '</div>').join('');
  return h;
}
function toolsHtml() {
  return G.party.map((t, i) => {

    return '<div class="fm"><b>' + esc(toolName(t)) + '</b> · ' + CLASSES[T.cls].label + ' · ' + T.sub + ' · Lv ' + t.lvl + ' (' + t.xp + '/' + (20 * t.lvl) + ' XP)' + (i === G.active ? ' · <i>active</i>' : '') +
      '<br>' + esc(T.blurb) + '<br><small>Strong vs: ' + (CLASSES[T.cls].strongLabel || CLASSES[T.cls].strong.join(', ')) + (T.cls === 'logging' ? ' (with logging on)' : '') + '</small><br><small>' + T.abil.map(k => ABIL[k].name + ' (' + ABIL[k].cost + ')').join(' · ') + '</small></div>';
  }).join('') + '<p>Tuning Guide: ' + (G.items.guide ? '1 (use on a Lv 5+ tool)' : 'none') + '</p>';
}

  return '<p><b>UPTIME</b>, ' + esc(EDITION.creditsName) + '. Original game: story, characters, tools, art and rules are original.</p>' +
    '<p>Build <b>' + BUILD_ID + '</b> · built ' + BUILD_TS + '</p>' +

async function startMenu() {
  while (true) {
    const items = [
      {label: 'Scorecard', meta: {k: 'score'}}, {label: 'Field Manual (' + fmPct() + '%)', meta: {k: 'fm'}},
      {label: 'Tools', meta: {k: 'tools'}}, {label: 'Save', meta: {k: 'save'}},
      {label: 'Export save code', meta: {k: 'export'}}, {label: 'Import save code', meta: {k: 'import'}}];
    if (EDITION.noTools) items.splice(items.findIndex(x => x.meta.k === 'tools'), 1);  // an edition without a tool console
    if (G.f.autoUnlocked) items.push({label: 'Automation: ' + (G.auto ? (G.autoReview ? 'ON, sampled weekly' : 'ON, no review') : 'off'), meta: {k: 'auto'}});
    items.push({label: 'Settings', note: 'colours, sound, flashing, text size', meta: {k: 'settings'}}, {label: 'Credits', meta: {k: 'credits'}}, {label: 'Close', meta: {k: 'close'}});
    const body = '<p><b>' + esc(objective().text) + '</b></p><p class="small">Day ' + G.day + ' · ' + G.rank + ' · Focus ' + G.focus + '/' + G.focusMax + ' · played ' + fmtTime(G.playMs) + '</p>' +
      '<p class="small">Controls: arrows / D-pad move · Z = A (talk, confirm) · X = B (back) · Enter = Start (this menu) · Shift = Select (alert queue)</p><p class="small">Build ' + BUILD_ID + ' · ' + BUILD_TS + '</p>';
    const i = await UI.openModal('Menu', body, items);
    if (i < 0) return;
    const k = items[i].meta.k;
    if (k === 'close') return;
    if (k === 'score') await UI.openModal('Scorecard', scorecardHtml(), [{label: 'Back'}]);
    if (k === 'fm') await UI.openModal('Field Manual', fmHtml(), [{label: 'Back'}]);
    if (k === 'tools') await toolsMenu();
    if (k === 'save') { const ok = storeSet(encodeSave(G)); await UI.openModal('Save', ok ? '<p>Saved in this browser.</p>' : '<p>This browser blocked storage. Use Export save code instead.</p>', [{label: 'OK'}]); }
    if (k === 'export') await exportSave();
    if (k === 'import') { if (await importFlow()) return; }
    // Cycles off -> on with a weekly sample review -> on with no review -> off.
    if (k === 'auto') { if (!G.auto) { G.auto = true; G.autoReview = true; } else if (G.autoReview) G.autoReview = false; else G.auto = false; }
    if (k === 'credits') await UI.openModal('Credits', creditsHtml(), [{label: 'Back'}]);
    if (k === 'settings') await settingsMenu();
  }
}
async function toolsMenu() {
  const items = G.party.map((t, i) => ({label: 'Make ' + toolName(t) + ' active', disabled: i === G.active, meta: {i: i}}));
  const canTune = G.items.guide ? G.party.filter(t => t.lvl >= 5 && !t.tuned) : [];
  canTune.forEach(t => items.push({label: 'Tune ' + TOOLS[t.id].name + ' (uses Tuning Guide)', meta: {tune: t.id}}));
  items.push({label: 'Back', meta: {}});
  const i = await UI.openModal('Tools', toolsHtml(), items);
  if (i < 0) return;
  const m = items[i].meta;
  if (m.i !== undefined) G.active = m.i;
  if (m.tune) { const t = G.party.find(p => p.id === m.tune); t.tuned = true; G.items.guide = 0; await UI.openModal('Tuned', '<p>' + esc(TOOLS[t.id].name) + ' was Tuned. Power ×1.25.</p>', [{label: 'OK'}]); }
}
async function exportSave() {
  const code = encodeSave(G);
  await UI.openModal('Export save code', '<p>Copy this code somewhere safe. Import it on any device.</p><textarea id="codebox" readonly rows="6">' + esc(code) + '</textarea>', [{label: 'Done'}]);
}
function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }

/* ---------- Title ---------- */
async function titleScreen() {
  titleOpen = true;
  // Optional edition hook (Crossroads' New Game+; Town Hall defines none): {items, pick(k) -> true if it handled k}.
  const extra = typeof editionTitle === 'function' ? editionTitle() : null;
  const has = !!storeGet();
  const items = [];
  if (has) items.push({label: 'Continue', meta: {k: 'cont'}});
  if (extra) items.push(...extra.items);
  items.push({label: 'New game', meta: {k: 'new'}}, {label: 'Import save code', meta: {k: 'import'}}, {label: 'Settings', meta: {k: 'settings'}}, {label: 'Credits', meta: {k: 'credits'}});
  const body = '<div class="title"><div class="logo">UPTIME</div><div>' + esc(EDITION.title) + '</div></div>' +
    '<p>' + esc(EDITION.blurb) + '</p>' +
    '<p class="small">Move: arrows / D-pad · A: Z · B: X · Start: Enter · Select: Shift (alert queue)</p>' +
    '<p class="small">Build ' + BUILD_ID + ' · ' + BUILD_TS + '</p>';
  const i = await UI.openModal('', body, items, {closable: false, cls: 'titlebox'});
  const k = items[i].meta.k;
  titleOpen = false;
  if (extra && await extra.pick(k)) return;
  if (k === 'cont') {
    try { G = sameEdition(decodeSave(storeGet())); fixupState(); qtAdopt(); started = true; hudUpdate(); }
    catch (e) { await UI.openModal('Continue', '<p>That save could not be read: ' + esc(e.message) + '</p>', [{label: 'OK'}]); return titleScreen(); }
    return;
  }
  if (k === 'credits') { await UI.openModal('Credits', creditsHtml(), [{label: 'Back'}]); return titleScreen(); }
  if (k === 'settings') { await settingsMenu(); return titleScreen(); }
  if (k === 'import') { const ok = await importFlow(); if (!ok) return titleScreen(); return; }
  newGame();
}
// A save from another edition is refused (Town Hall saves carry no edition field; later editions set G.edition).
function sameEdition(g) {
  const want = EDITION.id === 'town-hall' ? undefined : EDITION.id;
  if (g && g.edition !== want) throw new Error('That save is from another Uptime edition. Open that edition to load it.');
  return g;
}
function fixupState() {
  const base = newState(G.seed || 1);
  for (const k in base) if (G[k] === undefined) G[k] = base[k];
  for (const k in base.m) if (G.m[k] === undefined) G.m[k] = base.m[k];
  for (const k in base.targets) if (G.targets[k] === undefined) G.targets[k] = base.targets[k];
  if (G.targets.esc === 1) G.targets.esc = base.targets.esc; // older saves: the escalation target was a count
  if (!G.qt) G.qt = Series.blankQT();
  if (typeof editionFixup === 'function') editionFixup();   // optional edition hook (Crossroads' save migration; Town Hall defines none)
  fixPosition();
}
// Older saves can stand on a tile that a later build turned into a wall (map edits, e.g. the hub at 1,10): move the
// player to the nearest walkable floor tile (not a door, nobody standing on it), searching outward ring by ring.
function fixPosition() {
  if (!G || !MAPS[G.map]) return false;
  const d0 = tileDef(G.map, G.x, G.y);
  if (d0 && !d0.solid && !npcHere(G.map, G.x, G.y)) return false;
  const rows = mapRows(G.map), H = rows.length, W = rows[0].length;
  for (let r = 1; r < Math.max(W, H); r++) {
    const ring = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (Math.max(Math.abs(dx), Math.abs(dy)) === r) ring.push([G.x + dx, G.y + dy, Math.abs(dx) + Math.abs(dy)]);
    ring.sort((a, b) => a[2] - b[2]);
    for (const [x, y] of ring) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const d = tileDef(G.map, x, y);
      if (d && !d.solid && !doorAt(G.map, x, y) && !npcHere(G.map, x, y)) { G.x = x; G.y = y; return true; }
    }
  }
  return false;
}
let seedOverride = null;
function newGame() {
  const seed = seedOverride !== null ? seedOverride : (Date.now() >>> 0);
  rng = makeRng(seed);
  G = newState(seed); started = true;
  qtMirror();
  track(); hudUpdate();
  run(introScript);
}
async function importFlow() {
  const i = await UI.openModal('Import save code', '<p>Paste a save code, then choose Load.</p><textarea id="codebox" rows="6" placeholder="UPT1.…"></textarea>', [{label: 'Load'}, {label: 'Cancel'}]);
  // the textarea is removed when the modal closes, so read it on click (see modal hook below)
  if (i !== 0) return false;
  try {
    G = sameEdition(decodeSave(lastImportText)); fixupState(); qtAdopt(); started = true; storeSet(encodeSave(G)); hudUpdate();
    await UI.openModal('Import', '<p>Save loaded. Day ' + G.day + ', ' + esc(G.rank) + '.</p>', [{label: 'OK'}]);
    return true;
  } catch (e) {
    await UI.openModal('Import', '<p>' + esc(e.message) + '</p>', [{label: 'OK'}]);
    return false;
  }
}
let lastImportText = '';
document.addEventListener('input', e => { if (e.target && e.target.id === 'codebox') lastImportText = e.target.value; }, true);

/* ---------- Main loop ---------- */
function frame(t) {
  const dt = Math.min(50, t - (lastT || t)); lastT = t;
  UI.tick(dt);
  const tallOK = !!(G && started && !B && !titleOpen);
  if (tallOK !== Screen.tallOK) { Screen.tallOK = tallOK; Screen.fit(); }
  UI.toastTick(dt);
  if (shake > 0) shake -= dt;
  watchSounds();
  if (G && started) {
    if (!titleOpen) G.playMs += dt;
    if (moving) {
      moving.t += dt / (UI.turbo ? 45 : 140);
      if (moving.t >= 1) {
        const mv = moving; stepDone();
        if (!busy && !UI.mode && !UI.modal && !moving) {
          const held = ['up', 'down', 'left', 'right'].find(d => Input.held[d]);
          const tap = Input.taps.find(b => DIRS[b]);
          Input.taps = Input.taps.filter(b => !DIRS[b]);
          const nd = tap || held;
          if (nd) tryMove(nd);
        }
      }
    } else if (!busy && !UI.mode && !UI.modal) {
      const tap = Input.taps.find(b => DIRS[b]);
      Input.taps = Input.taps.filter(b => !DIRS[b]);
      const held = ['up', 'down', 'left', 'right'].find(d => Input.held[d]);
      const nd = tap || held;
      if (nd) tryMove(nd);
    } else { Input.taps = Input.taps.filter(b => !DIRS[b]); }
    if (B) drawBattle(Screen.ctx); else drawWorld(Screen.ctx);
    hudUpdate();
  } else {
    drawTitleBg(Screen.ctx, t);
  }
  requestAnimationFrame(frame);
}
function drawTitleBg(ctx, t) {
  const off = Settings.calm() ? 0 : Math.floor(t / 60) % 16;  // reduced flashing: the title field stands still
  for (let y = 0; y < 12; y++) for (let x = 0; x < 21; x++) {
    const k = (x + y) % 7 === 0 ? 'L' : (x * 3 + y) % 5 === 0 ? 'K' : 'G';
    ctx.drawImage(sprite(S[k] ? k : 'G', k), x * 16 - off, y * 16);
  }
}

// Sounds for things any edition's code can cause: a new alert in the queue, a badge earned. Loading a save resets
// the watch silently.
const soundWatch = {g: null, q: 0, b: 0};
function badgeCount() { return G ? (G.badge ? 1 : 0) + (EDITION.badgeFlags || []).filter(k => G.f[k]).length : 0; }
function watchSounds() {
  if (!G || !started) { soundWatch.g = null; return; }
  const q = G.queue, b = badgeCount();
  if (soundWatch.g !== G) { soundWatch.g = G; soundWatch.q = q; soundWatch.b = b; return; }
  if (b > soundWatch.b) sfx('badge');
  if (q > soundWatch.q) sfx('alert');  // both can land in one frame; with alerts only, the alert must still sound
  soundWatch.q = q; soundWatch.b = b;
}

/* ---------- Button dispatch ---------- */
function onButton(b) {
  if (UI.modal || UI.mode) { UI.handle(b); Input.taps = []; return; }
  if (!G || !started || busy || moving) return;
  if (b === 'a') {
    // Talking to someone: they turn to face you for the conversation, then go back to their own facing (see run()).
    const [dx, dy] = DIRS[G.dir], npc = npcHere(G.map, G.x + dx, G.y + dy);
    interact();
    if (npc && busy) npcFace[npc.id] = OPP_DIR[G.dir];
  }
  else if (b === 'start') run(startMenu);
  else if (b === 'select') run(openQueue);
}

/* ---------- Debug / test hooks (no effect on play) ---------- */
window.__UPTIME = {
  peek() {
    let ui = null;
    if (UI.modal) ui = {type: 'modal', options: UI.modal.items.map(o => ({label: o.label, meta: o.meta || null, disabled: !!o.disabled, done: !!o.done})), cursor: UI.modal.cursor, multi: UI.modal.multi, sel: [...UI.modal.sel]};
    else if (UI.mode === 'say') ui = {type: 'say', typing: UI.typing, text: UI.full};
    else if (UI.mode === 'choice') ui = {type: 'choice', options: UI.choice.items.map(o => ({label: o.label, meta: o.meta || null, disabled: !!o.disabled})), cursor: UI.choice.cursor, cols: UI.choice.cols, text: UI.text.textContent};
    if (!G) return {started: false, ui: ui};
    const solid = mapRows(G.map).map((r, y) => r.split('').map((c, x) => blocked(G.map, x, y) ? 1 : 0));
    return {
      started: started, map: G.map, x: G.x, y: G.y, dir: G.dir, moving: !!moving, busy: busy, day: G.day, focus: G.focus,
      f: G.f, rank: G.rank, ui: ui, objective: objective(), marker: markerDoor(), solid: solid, doors: MAPS[G.map].doors,
      battle: B ? {kind: B.spec.kind, ev: B.ev, dwell: B.dwell, story: !!B.spec.story, tech: B.spec.tech} : null,
      party: G.party, metrics: metricVals(), m: G.m, fm: fmPct(), queue: G.queue, mfa: G.mfaSet.length, summary: !!G.f.summaryShown,
      qt: Series.qt(),
      extra: typeof peekExtra === 'function' ? peekExtra() : null
    };
  },
  turbo(on) { UI.turbo = !!on; },
  seed(n) { seedOverride = n >>> 0; },
  state() { return G; },
  drawn() { drawnWanted = true; return drawnEnts.slice(); },  // the first call turns recording on; read again after a frame
  series() { return Series.load(); },
  settings() { return Object.assign({}, Settings.v); }
};

/* ---------- Boot ---------- */
function boot() {
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('touch', !!touch);
  Settings.load();
  // Audio may only start from a user gesture (autoplay policy): the first key, tap or click unlocks it.
  for (const ev of ['keydown', 'pointerdown', 'touchend', 'mousedown']) window.addEventListener(ev, () => Sound.unlock(), {capture: true, passive: true});
  Settings.hooks.push(() => { platformCache = null; if (B) bhud(); });
  Series.load();
  Screen.init(); UI.init(); Input.init();
  Input.handler = onButton;
  document.querySelectorAll('.buildid').forEach(e => e.textContent = BUILD_ID + ' · ' + BUILD_TS);
  requestAnimationFrame(frame);
  titleScreen();
  const note = Settings.soundNotice(); if (note) toast(note, 6000);  // once: sound starts off
}
window.addEventListener('DOMContentLoaded', boot);

</script>
