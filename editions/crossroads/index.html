<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:;">
<title>Uptime</title>
<style>
/* UPTIME · style.css — phone-first layout; menus readable in light and dark.
   Colour tokens: Classic uses these defaults; the other palettes (engine/settings.js) set them on <html>.
   paper = modal pages, box = dialogue panel and battle cards, hud = the status band. */
:root{
  --bg:#10141f; --ink:#e9edf5; --paper:#f4f2ec; --paper-ink:#1b2233; --muted:#4a5163;
  --cur:#e6f5c8; --accent:#2f6e3e; --warn:#b8432f; --gold:#ffd96a;
  --hud-bg:#161b29; --hud-ink:#ffffff; --box:#ffffff; --box-ink:#1b2233; --box-muted:#4a5163; --box-cur:#e6f5c8; --box-accent:#2f6e3e;
  --line:#1b2233; --foot:#8b93a7; --toast:#1b2233; --toast-ink:#ffffff;
  --fs:14px; --s:1;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1f2533; --paper-ink:#e9edf5; --muted:#aab3c5; --cur:#2c4a35; --accent:#a6d96a; --warn:#ff8a70; }
}
:root[data-theme="dark"]{ --paper:#1f2533; --paper-ink:#e9edf5; --muted:#aab3c5; --cur:#2c4a35; --accent:#a6d96a; --warn:#ff8a70; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;max-width:100vw}
body{font-family:var(--mono);-webkit-text-size-adjust:100%;touch-action:manipulation;min-height:100vh;min-height:100dvh;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#app{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;width:100%}
body.portrait #app{height:100vh;height:100dvh;min-height:0}
#stage{position:relative;max-width:100vw}
#screen{position:relative;overflow:hidden;background:#000;margin:0 auto}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD: its own band above the map (never over it); both lines wrap, nothing is cut off */
#hud{flex:none;width:var(--hudW,100%);max-width:100vw;padding:3px 8px 4px;font-size:13px;line-height:1.3;color:var(--hud-ink);background:var(--hud-bg);
  pointer-events:none;white-space:normal;overflow-wrap:anywhere;min-height:calc(2 * 1.3em + 7px)}
body.portrait #hud{width:100%;font-size:11.5px;min-height:calc(3 * 1.3em + 7px)}
#hud.off{visibility:hidden}
#hud .obj{color:var(--gold)}
#toast{position:absolute;z-index:55;left:50%;top:24%;transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);border:2px solid var(--gold);
  padding:3px 8px;font-size:calc(var(--fs) * .8);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#screen.battle #toast{top:50%}

/* Battle panels (real text over the canvas) */
.bpanel{position:absolute;display:none;background:var(--box);color:var(--box-ink);border:2px solid var(--line);padding:3px 6px;font-size:var(--fs);line-height:1.25}
.bpanel.show{display:block}
/* positions match BATTLE_LAYOUT in game.js: alert card top-left, opponent top-right; tool bottom-left, tool card bottom-right */
#bcard{left:2.5%;top:3%;width:52%}
#btool{right:2.5%;bottom:4%;width:52%}
.bt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bcard .bt{white-space:normal}
.bs{font-size:.8em;color:var(--box-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:4px;font-size:.8em;margin-top:2px}
.bl{width:5.6em;flex:none}
.bo{flex:1;height:.8em;border:2px solid var(--line);display:block;position:relative}
.bi{display:block;height:100%}
.bi.hatch{background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--box) 3px 5px)}  /* Dwell: hatched, never the same fill as Evidence */
.bn{width:3.6em;flex:none;text-align:right}

/* Dialogue / choice panel */
#panel{background:var(--box);color:var(--box-ink);font-size:var(--fs);line-height:1.4;display:none}
#panel.show{display:block}
body.landscape #panel{position:absolute;left:0;right:0;bottom:0;max-height:58%;overflow:auto;border-top:3px solid var(--line);padding:.5em .9em;z-index:5}
/* Desktop with room to spare: the dialogue sits below the map instead of over it (the battle scene stays whole) */
body.landscape.below #panel{position:static;display:block;visibility:hidden;width:var(--hudW);height:var(--panelH,180px);max-height:none;overflow:auto}
body.landscape.below #panel.show{visibility:visible}
/* Touch landscape battle: no HUD or footer; the scene sits at the top and the panel has its own band below it,
   as wide as the gap between the D-pad and the A/B buttons, with a readable font. It scrolls inside if it must. */
body.landscape.touch.inbattle #hud,body.landscape.touch.inbattle #foot{display:none}
body.landscape.touch.below #panel{width:min(500px,calc(100vw - 316px));margin:0 auto;font-size:12.5px;line-height:1.3;padding:.35em .7em;border-top:3px solid var(--line)}
/* Two-column choice grids (the battle menu): the note sits beside its label, so every row stays short */
body.landscape #panel.choosing #popts.cols2 .opt .note{display:inline;padding-left:.6em}
#panel.choosing #pmore{display:none}
#panel:not(.show) #pmore{visibility:hidden!important}
body.portrait #stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;width:100%}
body.portrait #panel{display:block;visibility:hidden;width:100%;flex:1 1 auto;min-height:150px;overflow:auto;font-size:14px;padding:8px 12px;border-top:3px solid var(--line)}
body.portrait #panel.show{visibility:visible}
#pwho{font-weight:700;color:var(--box-accent)}
#ptext{white-space:pre-wrap;min-height:1.4em}
#pmore{text-align:right;animation:blink 1s steps(2) infinite;height:1em;line-height:1em}
@keyframes blink{50%{opacity:0}}
#popts{display:grid;gap:2px 10px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;color:inherit;font-size:inherit;
  padding:2px 4px;cursor:pointer;line-height:1.25}
.opt .car{display:inline-block;width:1em;visibility:hidden}
.opt.cur{border-color:var(--line);background:var(--box-cur)}
.opt.cur .car{visibility:visible}
.opt.dis{opacity:.45;cursor:default}
.opt .note{display:block;font-size:.78em;color:var(--box-muted);padding-left:1.25em}
body.portrait #popts .opt{min-height:36px}

/* On-screen pad */
#pad{display:none}
body.portrait #pad, body.touch #pad{display:grid}
/* Portrait: the controls sit at the bottom of the screen and stay above any open modal */
body.portrait #pad{flex:none;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:440px;padding:8px 10px 4px;gap:4px;position:relative;z-index:60}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);justify-self:start}
.dpad button,.ab button,.sys button{touch-action:none;border:none;color:#e9edf5;cursor:pointer}
.dpad button{background:#3a4a6b;font-size:20px;border-radius:6px}
.dpad button.on,.ab button.on,.sys button.on{filter:brightness(1.5)}
.du{grid-column:2;grid-row:1}.dl{grid-column:1;grid-row:2}.dr{grid-column:3;grid-row:2}.dd{grid-column:2;grid-row:3}
.dc{grid-column:2;grid-row:2;background:#2b2f3a;border-radius:4px}
.ab{display:flex;gap:8px;justify-self:end;align-items:center}
.ab button{width:54px;height:54px;border-radius:50%;font-size:20px;font-weight:700}
.ab .ba{background:#b8432f;margin-top:-26px}.ab .bb{background:#8a4b2f;margin-top:26px}
.sys{display:flex;flex-direction:column;gap:10px;align-items:center}
.sys button{background:#4a5163;border-radius:12px;font-size:10px;padding:8px 6px;letter-spacing:.5px}
body.landscape.touch #pad{position:fixed;inset:0;pointer-events:none;display:block;z-index:60}
body.landscape.touch .dpad{position:fixed;left:14px;bottom:20px;pointer-events:auto}
body.landscape.touch .ab{position:fixed;right:18px;bottom:30px;pointer-events:auto}
body.landscape.touch .sys{position:fixed;right:18px;top:14px;flex-direction:row;pointer-events:auto}
#foot{font-size:11px;color:var(--foot);padding:6px 10px;text-align:center;max-width:100vw}
body.portrait #foot{flex:none;padding:2px 10px calc(4px + env(safe-area-inset-bottom))}
body.portrait #foot .keys,body.touch #foot .keys{display:none}

/* Modal pages */
#modal{position:fixed;inset:0;background:rgba(8,10,16,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:8px}
/* Modals fit in the area above the on-screen controls (portrait) or between them (touch landscape); they scroll inside */
body.portrait #modal{bottom:var(--padZone,0px);padding:6px}
body.landscape.touch #modal{padding:8px 150px 8px 168px}
#modal.show{display:flex}
.mbox{background:var(--paper);color:var(--paper-ink);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;border:3px solid var(--line);box-shadow:0 0 0 3px var(--paper)}
.mhead{font-weight:700;padding:10px 14px 0;font-size:17px;letter-spacing:1px}
.mhead:empty{display:none}
/* Body and options share the shrinking in proportion (as before a2d0962); UI.fitModal gives the options a floor of
   their own height up to 40% of the modal area, so a lone Back button is never squeezed and a long body keeps its share. */
.mbody{overflow:auto;flex:1 1 auto;min-height:0;padding:6px 14px;font-size:15px;line-height:1.45;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.mbody p{margin:.5em 0}
.mbody h3{font-size:14px;margin:1em 0 .3em;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.mopts{padding:6px 10px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;flex:0 1 auto;min-height:0}
.mopts .opt{flex:none;font-size:15px;min-height:40px;padding:6px 8px;color:var(--paper-ink)}
.mopts .opt.cur{background:var(--cur);border-color:var(--paper-ink)}
.mopts .opt .note{color:var(--muted)}
.mopts .opt.sel{font-weight:700}
.chk{display:inline-block;width:1.4em}
.mbody .small,.small{font-size:12px;color:var(--muted)}
.fm{padding:6px 0;border-bottom:1px solid rgba(127,127,127,.3);font-size:14px}
.fm.lock{color:var(--muted)}
table.sc{border-collapse:collapse;width:100%;font-size:13px;margin:.4em 0}
table.sc th,table.sc td{border-bottom:1px solid rgba(127,127,127,.35);padding:3px 4px;text-align:left}
table.sc th{font-size:12px;color:var(--muted)}
/* Scorecard / summary: numbers and targets never split; only the metric name wraps */
table.sc.score td+td,table.sc.score th+th{white-space:nowrap;text-align:right}
.dir{color:var(--warn);font-weight:700}
.card{border:2px solid var(--paper-ink);padding:6px 8px;margin:6px 0;font-size:14px}
.tag{font-size:11px;border:1px solid var(--muted);padding:0 4px;color:var(--muted)}
textarea{width:100%;font-family:var(--mono);font-size:12px;background:var(--box);color:var(--box-ink);border:2px solid var(--line);-webkit-user-select:text;user-select:text}
.err{color:var(--warn)}
.title{text-align:center;padding:10px 0}
.logo{font-size:44px;font-weight:800;letter-spacing:8px;color:var(--accent)}
.big{font-size:17px;font-weight:700}
@media (max-width:420px){ table.sc{font-size:11.5px} table.sc th,table.sc td{padding:3px 2px} table.sc.score td+td,table.sc.score th+th{padding-left:7px} .mbody{font-size:14px;padding:6px 10px} }

/* Investigation drills, inbox room and text stream (Mail Room) */
pre.art{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-family:var(--mono);font-size:12px;line-height:1.35;
  background:rgba(127,127,127,.12);border-left:3px solid var(--accent);padding:6px 8px;margin:.4em 0;-webkit-user-select:text;user-select:text}
pre.art.wall{border-left-color:var(--muted);color:var(--muted);max-height:220px;overflow:auto}
pre.art.ai{border-left-color:var(--gold)}
.find{margin:.4em 0}
.mbody details summary{cursor:pointer;color:var(--accent)}
.mail{border:2px solid var(--paper-ink);padding:6px 8px;margin:.4em 0;font-size:14px}
.mail .mh{font-size:12px;color:var(--muted);word-break:break-word}
.mail .cue{display:block;margin-top:4px;font-size:12px;border-left:3px solid var(--gold);padding-left:6px}
.sms{max-width:85%;border-radius:10px;padding:6px 10px;margin:6px 0;background:rgba(127,127,127,.18);font-size:14px}
.sms .from{display:block;font-size:11px;color:var(--muted)}

/* Settings: palette preview, reduced flashing, large text */
.setprev{margin:.3em 0}
#setprev{display:block;width:min(480px,100%);aspect-ratio:5/1;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--paper-ink)}
body.calm #pmore{animation:none}
body.calm #toast{transition:none}
body.bigtext .mbody{font-size:18px}
body.bigtext .mopts .opt{font-size:18px}
body.bigtext .mbody .small,body.bigtext .small{font-size:15px}
body.bigtext #panel{font-size:calc(var(--fs) * 1.2)}
body.portrait.bigtext #panel{font-size:17px}

</style>

/* ---------- RNG (mulberry32, seedable for tests) ---------- */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = makeRng((Date.now() ^ 0x5eed) >>> 0);
function rnd() { return rng(); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function weighted(list) { // [{w,...}]
  const tot = list.reduce((s, x) => s + x.w, 0);
  let r = rnd() * tot;
  for (const x of list) { if ((r -= x.w) < 0) return x; }
  return list[list.length - 1];
}

   keep their places. Seeded from the save's seed and the labels, so a list keeps its order on reload,
   and it never touches the game's own random stream. Callers still get the index into their own array.
   The highlight starts on display position 0 (the first enabled item), never on the caller's item 0, so it
   lands on a random answer; pass {cursor: i} (a caller index) to start somewhere on purpose.
   Pure navigation/confirmation menus stay in order; when one marks a preferred item with meta.good (a hint
   for the test bot), it says so with {nav: '<id>'}, an id on the reviewed allowlist in tests/highlight.js, so the

    let availW, availH;

    const landBattle = !portrait && touch && document.body.classList.contains('inbattle');
    if (portrait) { availW = W; availH = Math.max(90, H - hh('hud') - 150 - hh('pad') - hh('foot')); }

const BADGE_CACHE = {};
function badgeImage(kind) {
  const fill = BADGE_GLYPHS[kind]; if (!fill) return null;

}

const Sound = {
  ctx: null, master: null, noiseBuf: null, unlocked: false, trace: [], last: {},
  // Audio starts only from a user gesture (browser autoplay policy). Never throws when Web Audio is missing.
  unlock() {
    if (this.unlocked) { try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} return; }
    this.unlocked = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.setVolume();
      if (this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  setVolume() { try { if (this.master) this.master.gain.value = Math.pow(Settings.v.volume / 100, 2) * 0.6; } catch (e) {} },
  // A preview (changing the sound set or the volume in Settings) ignores "alerts only" so the player hears what they
  // picked; mute and volume 0 still silence it.
  allowed(ev, preview) {
    const v = Settings.v;
    if (v.mute || v.volume <= 0) return 'muted';
    if (!preview && v.alertsOnly && ALERT_EVENTS.indexOf(ev) < 0) return 'filtered';
    return 'ok';
  },
  preview(ev) { return this.play(ev, null, true); },
  play(ev, setId, preview) {
    let out = this.allowed(ev, preview);
    const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    if (out === 'ok' && ev === 'move' && now - (this.last.move || 0) < 35) out = 'rate';
    if (out === 'ok') { this.last[ev] = now; out = !this.unlocked ? 'locked' : !this.ctx ? 'noaudio' : 'played'; }
    this.trace.push({ev: ev, set: setId || Settings.v.sound, out: out, preview: !!preview});
    if (this.trace.length > 300) this.trace.splice(0, 100);
    if (out !== 'played') return false;
    try { this.synth(SOUND_SETS[setId || Settings.v.sound] || SOUND_SETS.soft, ev); return true; }
    catch (e) { return false; }
  },
  synth(set, ev) {
    const c = this.ctx, t0 = c.currentTime + 0.01;
    for (const raw of set.ev[ev] || []) {
      const p = Object.assign({w: set.w, v: set.v, lp: set.lp, det: set.det, at: 0}, raw);
      const t = t0 + p.at, end = t + p.d;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(p.v, t + Math.min(0.006, p.d / 3));

        const src = c.createBufferSource(); src.buffer = this.noiseBuf; voices.push(src);
      } else {
        for (const cents of p.det ? [-p.det, p.det] : [0]) {
          const o = c.createOscillator(); o.type = p.w; o.frequency.setValueAtTime(p.f, t);
          if (p.f2) o.frequency.exponentialRampToValueAtTime(p.f2, end);

      for (const v of voices) { v.connect(g); v.start(t); v.stop(end + 0.02); }
    }
  }
};
function sfx(ev) { try { Sound.play(ev); } catch (e) {} }

/* ---------- Settings store ----------
   v2: sound starts muted (volume kept at 60) for new players and, once, for anyone whose stored settings are v1; a
   one-time toast says so (soundTip). Reduced flashing follows the system's prefers-reduced-motion until the player
   changes it here (reduceFlashUser); after that their choice wins. */
const SETTINGS_VERSION = 2;
const Settings = {
  v: null, stored: false, storageOk: true, _col: {}, hooks: [],
  defaults() {
    let calm = false;
    try { calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    return {v: SETTINGS_VERSION, palette: 'classic', sound: 'soft', volume: 60, mute: true, alertsOnly: false, reduceFlash: calm, reduceFlashUser: false, textSize: 'normal', soundTip: false};
  },
  load() {
    const d = this.defaults();
    let raw = null;
    try { raw = localStorage.getItem(SETTINGS_KEY); this.storageOk = true; } catch (e) { this.storageOk = false; }
    let o = {};
    if (raw) { try { o = JSON.parse(raw); this.stored = true; } catch (e) { o = null; } }
    if (!o || typeof o !== 'object' || Array.isArray(o)) o = {};
    if (this.stored && !(o.v >= 2)) { o.mute = true; o.reduceFlashUser = 'reduceFlash' in o; o.v = SETTINGS_VERSION; }  // v1 -> v2, once
    if (!o.reduceFlashUser) delete o.reduceFlash;  // not chosen here: follow the system setting
    this.v = this.clean(Object.assign(d, o));
    this.apply();
    return this.v;
  },
  clean(v) {
    if (!PALETTES.some(p => p.id === v.palette)) v.palette = 'classic';
    if (!SOUND_SETS[v.sound]) v.sound = 'soft';
    const vol = +v.volume;
    v.volume = isNaN(vol) || v.volume === null || v.volume === '' ? 60 : clamp(Math.round(vol / 10) * 10, 0, 100);
    v.mute = !!v.mute; v.alertsOnly = !!v.alertsOnly; v.reduceFlash = !!v.reduceFlash; v.reduceFlashUser = !!v.reduceFlashUser; v.soundTip = !!v.soundTip;
    v.v = SETTINGS_VERSION;
    if (v.textSize !== 'large') v.textSize = 'normal';
    return v;
  },
  save() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.v)); this.storageOk = true; this.stored = true; return true; }
    catch (e) { this.storageOk = false; return false; }
  },
  set(patch) { if ('reduceFlash' in patch) patch = Object.assign({reduceFlashUser: true}, patch); Object.assign(this.v, patch); this.clean(this.v); this.apply(); this.save(); return this.v; },
  // One-time notice on first start that sound is off (remembered in the settings key).
  soundNotice() { if (this.v.soundTip) return null; this.set({soundTip: true}); return 'Sound is off. Turn it on in Settings.'; },
  pal() { const id = this.v ? this.v.palette : 'classic'; if (!this._p || this._p.id !== id) this._p = PALETTES.find(p => p.id === id) || PALETTES[0]; return this._p; },
  calm() { return !!(this.v && this.v.reduceFlash); },
  // Every colour the canvas draws goes through here.
  col(hex) {
    const p = this.pal(); if (!p.map) return hex;
    const k = p.id + hex, r = this._col[k]; if (r !== undefined) return r;
    return (this._col[k] = /^#[0-9a-f]{6}$/i.test(hex) ? p.map(hex.toLowerCase()) : hex);
  },
  barCol(which) { const p = this.pal(); return (p.bars && p.bars[which]) || this.col(BAR_COLOURS[which]); },
  palColours(key) {
    const p = this.pal(), base = PAL[key];

    return base.map(h => this.col(h));
  },
  apply() {
    const root = document.documentElement, p = this.pal();
    for (const t of UI_TOKENS) { if (p.css) root.style.setProperty('--' + t, p.css[t]); else root.style.removeProperty('--' + t); }
    root.setAttribute('data-palette', p.id);
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = p.css ? p.css.bg : '#10141f';
    const body = document.body;
    if (body) {
      const big = body.classList.contains('bigtext');
      body.classList.toggle('calm', this.calm());
      body.classList.toggle('bigtext', this.v.textSize === 'large');
      if (big !== (this.v.textSize === 'large') && typeof Screen !== 'undefined' && Screen.canvas) Screen.fit();
    }
    Sound.setVolume();
    for (const h of this.hooks) { try { h(); } catch (e) {} }
  }
};

function cyc(list, cur, d) { const i = list.indexOf(cur); return list[(i + d + list.length) % list.length]; }

  return [

    {label: 'Sound set: ' + s.name, note: s.note, meta: {k: 'sound', lr: true}},
    {label: 'Volume: ' + v.volume, note: '0 to 100 in steps of ' + VOLUME_STEP + ' (left/right)', meta: {k: 'volume', lr: true}},
    {label: 'Sound: ' + (v.mute ? 'muted' : 'on'), meta: {k: 'mute', lr: true}},
    {label: 'Which sounds: ' + (v.alertsOnly ? 'alerts only' : 'all'), note: v.alertsOnly ? 'only new alerts and incidents make a sound' : 'menus, verdicts, badges, alerts', meta: {k: 'alertsOnly', lr: true}},
    {label: 'Test sound', note: 'plays select, correct and an alert with these settings', meta: {k: 'test'}},

/* ============================================================
   UPTIME · engine/series.js
   Series-level save (localStorage key 'uptime.series'), separate from each
   edition's own save, so later editions can read what happened earlier.
   Also the core of the Quiet Thread: a hidden, series-long intruder that lives
   off the land and never raises a normal alert. It is never part of the alert
   mix: there are no wild encounters for it, only clues an analyst may notice.
   ============================================================ */
'use strict';

const SERIES_KEY = 'uptime.series';
// Quiet Thread stages: 0 unseen · 1 noticed (a clue or two) · 2 suspected (3+ clues; hunt mode opens later)
const QT_SUSPECT = 3;

const Series = {
  data: null,
  blankQT() { return {stage: 0, cluesFound: [], evicted: false}; },
  blank() { return {v: 1, quietThread: this.blankQT(), editions: {}}; },
  normQT(q) {
    const b = this.blankQT();
    if (!q || typeof q !== 'object') return b;
    b.cluesFound = Array.isArray(q.cluesFound) ? q.cluesFound.filter(x => typeof x === 'string').filter((x, i, a) => a.indexOf(x) === i) : [];
    b.stage = Math.max(+q.stage || 0, qtStageFor(b.cluesFound.length));
    b.evicted = q.evicted === true;
    return b;
  },
  load() {
    let d = null;
    try { const raw = localStorage.getItem(SERIES_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    const out = this.blank();
    if (d && typeof d === 'object') {
      out.quietThread = this.normQT(d.quietThread);
      if (d.editions && typeof d.editions === 'object') out.editions = d.editions;
    }
    this.data = out;
    return out;
  },
  save() { try { localStorage.setItem(SERIES_KEY, JSON.stringify(this.data)); return true; } catch (e) { return false; } },
  qt() { if (!this.data) this.load(); return this.data.quietThread; },
  // Merge a copy carried in an edition save (e.g. an imported save code) into the series record.
  merge(q) {
    const cur = this.qt(), inc = this.normQT(q);
    inc.cluesFound.forEach(c => { if (!cur.cluesFound.includes(c)) cur.cluesFound.push(c); });
    cur.stage = Math.max(cur.stage, inc.stage, qtStageFor(cur.cluesFound.length));
    cur.evicted = cur.evicted || inc.evicted;
    this.save();
  },
  markEdition(id, info) { if (!this.data) this.load(); this.data.editions[id] = Object.assign({}, this.data.editions[id] || {}, info); this.save(); }
};
function qtStageFor(n) { return n >= QT_SUSPECT ? 2 : n >= 1 ? 1 : 0; }

// Keep a copy inside the edition save so export codes carry it to another device.
function qtMirror() { if (G) G.qt = JSON.parse(JSON.stringify(Series.qt())); }
// After Continue/Import: fold the save's copy into the series record, then mirror back.
function qtAdopt() { if (G && G.qt) Series.merge(G.qt); qtMirror(); }
// Record a clue (QT_CLUES is edition data). Returns true when it is new.
function qtNote(id) {
  const c = QT_CLUES[id]; if (!c) return false;
  const q = Series.qt();
  if (q.cluesFound.includes(id)) return false;
  q.cluesFound.push(id);
  q.stage = Math.max(q.stage, qtStageFor(q.cluesFound.length));
  Series.save(); qtMirror();
  toast('Field Manual: something unexplained, noted');
  return true;
}
function qtFmHtml() {
  const found = Series.qt().cluesFound.filter(id => QT_CLUES[id]);
  const others = Series.qt().cluesFound.length - found.length;
  if (!found.length && !others) return '';
  let h = '<h3>Unexplained</h3><p class="small">No alert fired for any of these. They may be nothing. (' + Series.qt().cluesFound.length + ' noted)</p>';
  for (const id of found) {
    const c = QT_CLUES[id], t = QT_TECH[c.tech];
    h += '<div class="fm"><b>' + esc(c.tech + ' ' + t.name) + '</b> <span class="tag">long campaign</span><br>' + esc(t.plain) +
      ' Tactic: ' + esc(t.tactic.join(', ')) + '.<br><small>What you noticed: ' + esc(c.seen) + ' (game)</small></div>';
  }
  if (others) h += '<div class="fm small">' + others + ' more noted in another edition.</div>';
  h += '<div class="fm small">' + esc(QT_FIELD_NOTES) + '</div>';
  return h;
}

/* ============================================================
   UPTIME · editions/crossroads/rota.js
   The rota / budget primitive (IR manager; designed in slice 1, used by the
   prologue's on-call week and the Library's after-hours cover).
   A rota spec R:
     {title, intro(html), nights, hours, maxRun, maxWeek, budget, callCost, tiredCost,
      people: [{id, name, skills, note, off: [night numbers], max}], calls: {night: 'what happens'},
      waitUntil (optional: when an uncovered night's alerts are read, default '08:00'),
      first (optional: the night number of the first row, default 1), carry (optional: how many leading rows are
      last week's nights, preset and shown; they count for the in-a-row rule only, not for this week's gaps,
      overtime, weekly limits or tired nights; default 0)}
   doRota(R, preset) asks for one person per night (shuffled, with "Leave this night uncovered" pinned last; any pick is allowed, and the game
   marks which picks keep the rules), then scores the week: rota gaps (hours nobody covers),
   tired nights (a person's third night or later in a row), nights over each person's limits,
   and overtime against the budget. Every rule and number is a game model (game).
   ============================================================ */
'use strict';

// Length of the run of nights person p is on, ending at night i (0-based), in assignment a.
function rotaRunAt(a, i) { if (!a[i]) return 0; let n = 0; for (let k = i; k >= 0 && a[k] === a[i]; k--) n++; return n; }
const rotaNight = (R, i) => (R.first || 1) + i;          // the night number shown for row i
const rotaWeek = (R, a) => a.slice(R.carry || 0);         // this week's rows (carried rows excluded)
function rotaCount(a, id) { return a.filter(x => x === id).length; }
function rotaStats(R, a) {
  const tired = [], over = [], per = {};
  let gaps = 0, overtime = 0;
  for (let i = R.carry || 0; i < R.nights; i++) {
    const id = a[i], night = rotaNight(R, i);
    if (!id) { gaps += R.hours; continue; }
    per[id] = (per[id] || 0) + 1;
    const run = rotaRunAt(a, i);
    if (run >= 3) tired.push(night);
    if (run > R.maxRun || per[id] > maxFor(R, id)) over.push(night);
    if (R.calls[night]) overtime += run >= 3 ? R.tiredCost : R.callCost;
  }
  return {gaps, tired, over, per, overtime, variance: Math.round((overtime - R.budget) / R.budget * 100), maxRun: Math.max(0, ...a.map((_, i) => i < (R.carry || 0) ? 0 : rotaRunAt(a, i)))};
}
function maxFor(R, id) { const p = R.people.find(x => x.id === id); return p && p.max !== undefined ? p.max : R.maxWeek; }
function rotaName(R, id) { const p = R.people.find(x => x.id === id); return p ? p.name : 'nobody'; }
// Would putting person p on night i keep the rules (available, rest, weekly limit)?
function rotaFits(R, a, i, p) {
  if ((p.off || []).includes(rotaNight(R, i))) return false;
  const b = a.slice(); b[i] = p.id;
  return rotaRunAt(b, i) <= R.maxRun && (i + 1 >= R.nights || !b[i + 1] || rotaRunAt(b, i + 1) <= R.maxRun) && rotaCount(rotaWeek(R, b), p.id) <= maxFor(R, p.id);
}
function rotaTable(R, a) {
  let h = '<table class="sc rota"><tr><th>Night</th><th>On call</th><th>In a row</th><th>Call</th></tr>';
  for (let i = 0; i < R.nights; i++) {
    const run = rotaRunAt(a, i), night = rotaNight(R, i), last = i < (R.carry || 0);
    h += '<tr' + (last ? ' class="small"' : '') + '><td>' + night + (last ? ' (last week)' : '') + '</td><td>' + esc(a[i] ? rotaName(R, a[i]).split(' ')[0] : (a[i] === null ? 'uncovered' : '…')) + '</td><td>' + (a[i] ? run + (run >= 3 && !last ? ' tired' : '') : '—') + '</td><td>' + (R.calls[night] ? 'yes' : '') + '</td></tr>';
  }

}
async function doRota(R, preset) {

  for (let i = R.carry || 0; i < R.nights; i++) {
    if (a[i]) continue;
    const items = R.people.map(p => {
      const n = rotaCount(rotaWeek(R, a), p.id), off = (p.off || []).includes(rotaNight(R, i));
      return {label: p.name, note: off ? 'not available this night' + (p.note ? ' · ' + p.note : '') : n + ' of ' + maxFor(R, p.id) + ' nights so far' + (a[i - 1] === p.id ? ' · on call the night before' : '') + (p.note ? ' · ' + p.note : ''),
        disabled: off, meta: {good: rotaFits(R, a, i, p), id: p.id}};
    });
    items.push({label: 'Leave this night uncovered', note: 'alerts wait for ' + (R.waitUntil || '08:00'), pin: true, meta: {good: false, id: null}});
    const body = R.intro + rotaTable(R, a) + '<p class="small">Rules (game): one lead a night, ' + R.hours + ' hours on call; nobody more than ' + R.maxRun + ' nights in a row or ' + R.maxWeek + ' in the week.</p>';
    const k = await UI.openModal(R.title + ' · night ' + rotaNight(R, i), body, items, {shuffle: true, closable: false, cls: 'drill'});

// The forecast of a rota's week: what each call costs and where fatigue shows (game).
function rotaForecast(R, a) {
  const L = [];

    const run = rotaRunAt(a, i), who = a[i] ? rotaName(R, a[i]).split(' ')[0] : null, night = rotaNight(R, i);
    if (!who) { L.push('Night ' + night + ': nobody on call. Anything that fires waits ' + R.hours + ' hours for the morning.'); continue; }
    if (run >= 3) L.push('Night ' + night + ': ' + who + ', night ' + run + ' in a row: a slower, thinner first look, with fewer facts in it' + (R.calls[night] ? ', a ' + R.tiredCost + '-hour call-out, and a call to you: Focus −10 the next morning' : '') + '.');

  }
  return L;
}
// A rota someone else builds (the acting team lead's, on the DFIR track): each night, the first person in the
// given order who keeps the rules (game).
function rotaAuto(R, preset, order) {
  const a = new Array(R.nights).fill(undefined);
  (preset || []).forEach((id, i) => { if (id) a[i] = id; else if (i < (R.carry || 0)) a[i] = null; });
  for (let i = R.carry || 0; i < R.nights; i++) {
    if (a[i]) continue;
    const p = (order || R.people.map(x => x.id)).map(id => R.people.find(x => x.id === id)).find(x => x && rotaFits(R, a, i, x));
    a[i] = p ? p.id : null;
  }
  return {assign: a.map(x => x || null), stats: rotaStats(R, a.map(x => x || null))};
}

/* ============================================================
   UPTIME · editions/crossroads/report.js
   The report-writing primitive (principal DFIR consultant; designed in
   slice 1). A report spec R:
     {title, audience, intro(html), claims: [{id, text, evidence: [lines], truth: 'confirmed'|'likely'|'unknown', why}]}
   For each claim the player chooses the wording: Confirmed (the evidence shows
   it), Likely (it points to it, doesn't show it) or Unknown (it can't say).
   The scale is fixed and opens on "Read the evidence", never on an answer. The findings are written in a
   shuffled order (seeded like answer lists, so it holds on reload), so their position says nothing about their
   wording; the filed report lists them in the order the spec gives.
   Scoring (game): the right wording 20; an underclaim 8 (honest but weak);
   an overclaim 0, graded like a wrong verdict: the reviewer corrects it before
   the report goes, and it counts as a claim corrected. The filed report always
   carries the right wording.
   ============================================================ */
'use strict';

const REPORT_LEVELS = ['confirmed', 'likely', 'unknown'];
const REPORT_WORD = {confirmed: 'Confirmed', likely: 'Likely', unknown: 'Unknown'};
function reportEvidenceHtml(c) { return '<ul>' + c.evidence.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'; }
async function doReport(R) {
  const out = new Array(R.claims.length);
  await UI.openModal('Report · ' + R.title, R.intro + '<p class="small">For each finding choose the wording the evidence supports. Confirmed: it shows it. Likely: it points to it but doesn’t show it. Unknown: it can’t say. Overclaiming is graded like a wrong verdict. (Scoring is a game model.)</p>',
    [{label: 'Start writing', meta: {good: true}}], {closable: false, cls: 'drill'});
  const order = shuffleOrder(R.claims.map(c => ({label: c.text})), {shuffle: true});   // order[shown position] = claim index
  for (let n = 0; n < R.claims.length; n++) {
    const c = R.claims[order[n]];
    let pick = null;
    while (pick === null) {
      const items = [
        {label: 'Confirmed', note: 'the evidence shows it', meta: {good: c.truth === 'confirmed', lv: 'confirmed'}},
        {label: 'Likely', note: 'the evidence points to it, doesn’t show it', meta: {good: c.truth === 'likely', lv: 'likely'}},
        {label: 'Unknown', note: 'the evidence can’t say', meta: {good: c.truth === 'unknown', lv: 'unknown'}},
        {label: 'Read the evidence', meta: {back: true}}];
      const i = await UI.openModal('Finding ' + (n + 1) + ' of ' + R.claims.length, '<div class="card"><b>' + esc(c.text) + '</b></div><p class="small">For: ' + esc(R.audience) + '</p>', items, {cursor: 3, closable: false, cls: 'drill'});
      if (items[i].meta.back) { await UI.openModal('Evidence for finding ' + (n + 1), reportEvidenceHtml(c), [{label: 'Back to the finding', meta: {good: true}}], {closable: false, cls: 'drill'}); continue; }
      pick = items[i].meta.lv;
    }
    const d = REPORT_LEVELS.indexOf(pick) - REPORT_LEVELS.indexOf(c.truth);  // < 0: stronger than the evidence
    const res = d === 0 ? 'right' : d < 0 ? 'over' : 'under';
    out[order[n]] = {id: c.id, pick: pick, truth: c.truth, res: res};
    sfx(res === 'right' ? 'correct' : res === 'over' ? 'wrong' : 'select');
    await say(res === 'right' ? REPORT_WORD[c.truth] + '. ' + c.why : res === 'over' ? 'Lucia, reviewing: “' + REPORT_WORD[pick] + ' claims more than the evidence holds. It goes out as ' + REPORT_WORD[c.truth].toLowerCase() + '.” ' + c.why : 'Lucia, reviewing: “The evidence carries more than that: ' + REPORT_WORD[c.truth].toLowerCase() + '.” ' + c.why);

  await UI.openModal('Report filed · ' + R.title, '<p class="big">Score ' + score + ' / 100 <span class="small">(game)</span></p><p>Right wording <b>' + right + '</b> · overclaimed <b>' + over + '</b> (corrected before it went) · underclaimed <b>' + under + '</b></p><h3>As filed, for ' + esc(R.audience) + '</h3>' + filed,
    [{label: 'Continue', meta: {good: true}}], {closable: false, cls: 'drill'});
  unlock('act', 'crwording');
  return {score, right, over, under, picks: out};
}

/* ---- engine/drill.js ---- */
/* ============================================================
   UPTIME · engine/drill.js
   Investigation drill: a new encounter type. One artefact, one question and a
   small query budget (usually 2). The player picks queries as (evidence source,
   question) pairs. Focused questions return a short, exact snippet for 1 Focus;
   broad ones return a wall of rows for 3 Focus; trap questions spend the budget
   and mislead. Then a verdict, the reasoning behind it, and alternative
   explanations the player ruled out (bonus). Credit needs evidence: with no
   decisive (key) query, a right verdict scores half and reasoning scores nothing,
   because that is a guess. An optional AI helper answers specific questions well
   and quietly truncates "everything".
   Inspired by Chris Sanders's Investigation Path posts (see CREDITS.md); every
   case is original. Drill data lives with each edition.

   Drill spec D:
   {id, title, intro(html), artefact(html), question, budget,
    sources: [{id, name, qs: [{q, kind: 'focus'|'broad'|'trap', key, res: [lines], wall: [row templates]}]}],
    ai: {everything: {text, wrong, reveal}, specific: {q, text}},
    verdicts: [{label, good, why, needs?, needsWhy?}], reasons: [{label, good, why}],
   A right verdict may name the source its claim rests on (needs: source id, or a list of ids when the
   claim rests on several). It then counts as supported only if a key query on each of those sources
   was run: a close that cites a log the player never read is a guess, however many other key queries
   they ran.
    alts: [{label, good, why}], altPick, path(html), response: [lines], techs: [ids], acts: [keys]}
   ============================================================ */
'use strict';

const DRILL_COST = {focus: 1, broad: 3, trap: 1};

function drillPre(lines, cls) {
  return '<pre class="art' + (cls ? ' ' + cls : '') + '">' + lines.map(esc).join('\n') + '</pre>';
}
// A wall of rows for a broad query: noisy template rows, with the one row that matters buried deep.
function drillWall(q) {
  const rows = [], tpl = q.wall || ['…'];
  const n = q.rows || 1240;
  for (let i = 0; i < 18; i++) {
    let r = tpl[i % tpl.length];
    const mm = String((7 + i * 3) % 60).padStart(2, '0'), ss = String((13 + i * 17) % 60).padStart(2, '0');
    r = r.replace(/\{t\}/g, mm + ':' + ss).replace(/\{n\}/g, String(100 + (i * 37) % 900)).replace(/\{i\}/g, String(i + 1));
    rows.push(r);
  }
  if (q.buried) rows.splice(15, 0, q.buried);
  rows.push('… ' + (n - rows.length).toLocaleString('en-US') + ' more rows');
  return '<p class="small">' + n.toLocaleString('en-US') + ' rows returned. You skim the first screen.</p>' + drillPre(rows, 'wall');
}
function drillFindings(st) {
  if (!st.findings.length) return '<p class="small">No queries yet.</p>';
  return st.findings.map(f => '<div class="find"><b>' + esc(f.head) + '</b>' + f.html + '</div>').join('');
}
function drillKeysLeft(D, st) {
  let n = 0;
  D.sources.forEach(s => s.qs.forEach(q => { if (q.key && !st.used.includes(q)) n++; }));
  return n;
}

async function doDrill(D) {
  const st = {budget: D.budget || 2, used: [], findings: [], broad: 0, trap: 0, keys: 0, keySrc: [], aiMode: null};
  UI.showPanel(false);
  touchCSF('Detect');
  const rules = '<p class="small">Query budget <b>' + st.budget + '</b>. A query is one evidence source plus one question. Focused questions return a short exact answer (1 Focus). Broad questions return a wall of rows (3 Focus). Then give a verdict and your reasoning, and name alternative explanations you ruled out. (Scoring is a game model.)</p>';
  await UI.openModal('Investigation drill · ' + D.title,
    D.intro + '<h3>Artefact</h3>' + D.artefact + '<p><b>Question:</b> ' + esc(D.question) + '</p>' + rules,
    [{label: 'Start investigating', meta: {good: true}}], {closable: false, cls: 'drill'});

  // ---- Queries ----
  while (true) {
    const keysLeft = drillKeysLeft(D, st);
    const items = D.sources.map(s => {
      const open = s.qs.filter(q => !st.used.includes(q));
      return {label: 'Query: ' + s.name, note: open.length + ' question' + (open.length === 1 ? '' : 's'),
        disabled: st.budget <= 0 || !open.length || G.focus < 1,
        meta: {src: s.id, good: st.budget > 0 && s.qs.some(q => q.key && !st.used.includes(q))}};
    });
    if (D.ai) items.push({label: 'Ask Tally (AI assistant)', note: 'no budget · 1 Focus', disabled: G.focus < 1, meta: {ai: true}});
    items.push({label: st.budget > 0 ? 'I have enough: decide' : 'Budget spent: decide', meta: {decide: true, good: st.budget <= 0 || keysLeft === 0}});
    const body = '<p>Budget left: <b>' + st.budget + '</b> · Focus <b>' + G.focus + '/' + G.focusMax + '</b></p>' +
      '<details><summary>Artefact</summary>' + D.artefact + '</details><p><b>Question:</b> ' + esc(D.question) + '</p><h3>Findings</h3>' + drillFindings(st);
    const i = await UI.openModal('Drill · ' + D.title, body, items, {shuffle: true, closable: false, cls: 'drill'});
    const m = items[i].meta;
    if (m.decide) break;
    if (m.ai) { await drillAI(D, st); continue; }
    const src = D.sources.find(s => s.id === m.src);
    const qs = src.qs.filter(q => !st.used.includes(q));
    const qi = qs.map(q => ({label: q.q, note: q.kind === 'broad' ? 'broad · 3 Focus' : '1 Focus', disabled: G.focus < DRILL_COST[q.kind], meta: {good: !!q.key}}));
    qi.push({label: 'Back', meta: {back: true}});
    const k = await UI.openModal('Query: ' + src.name, '<p>Which question do you put to the <b>' + esc(src.name) + '</b>?</p>', qi, {shuffle: true, closable: false, cls: 'drill'});
    if (qi[k].meta.back) continue;
    const q = qs[k];
    st.used.push(q); st.budget--;
    G.focus = Math.max(0, G.focus - DRILL_COST[q.kind]);
    let html;
    if (q.kind === 'broad') { st.broad++; html = drillWall(q); }
    else { if (q.kind === 'trap') st.trap++; if (q.key) { st.keys++; st.keySrc.push(src.id); } html = drillPre(q.res); }
    if (q.note) html += '<p class="small">' + esc(q.note) + '</p>';
    st.findings.push({head: src.name + ': ' + q.q, html: html});
    await UI.openModal('Result', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});
  }

  // ---- Verdict, reasoning, alternatives ----
  const ctx = '<h3>Findings</h3>' + drillFindings(st);
  const v = await UI.openModal('Verdict', '<p><b>' + esc(D.question) + '</b></p>' + ctx,
    D.verdicts.map(x => ({label: x.label, meta: {good: !!x.good}})), {shuffle: true, closable: false, cls: 'drill'});
  const r = await UI.openModal('Reasoning', '<p>Which reasoning supports your verdict best? Reason only from what your queries showed: reasoning about evidence you never looked at earns no credit.</p>' + ctx,
    D.reasons.map(x => ({label: x.label, meta: {good: !!x.good}})), {shuffle: true, closable: false, cls: 'drill'});
  const pickN = D.altPick || 2;
  const altItems = D.alts.map(x => ({label: x.label, meta: {good: !!x.good}})).concat([{label: 'Done: these are my ' + pickN, done: true, meta: {done: true}}]);
  const alts = await UI.openModal('Alternative explanations',
    '<p>Bonus: pick the <b>' + pickN + '</b> alternative explanations a careful analyst should name and rule out before closing this.</p>',
    altItems, {shuffle: true, multi: pickN, closable: false, cls: 'drill'});

  // ---- Score (game) and debrief ----
  const verdictOk = !!D.verdicts[v].good, reasonOk = !!D.reasons[r].good;
  const altOk = alts.filter(a => D.alts[a] && D.alts[a].good).length;
  const keyTotal = D.sources.reduce((n, s) => n + s.qs.filter(q => q.key).length, 0);
  const keyScore = Math.round(20 * Math.min(st.keys, Math.min(keyTotal, D.budget || 2)) / Math.min(keyTotal, D.budget || 2));
  const goodV = D.verdicts.find(x => x.good) || {};
  // needs: one source id, or a list of them (every one must have had a key query, e.g. two decisive sources).
  const needList = goodV.needs ? [].concat(goodV.needs) : [];
  const needsMissed = !!(needList.length && st.keys > 0 && needList.some(n => !st.keySrc.includes(n)));
  const supported = st.keys > 0 && !needsMissed;
  let score = (verdictOk ? (supported ? 40 : 20) : 0) + (reasonOk && supported ? 20 : 0) + keyScore + altOk * 10 - st.broad * 5 - st.trap * 5;
  score = clamp(score, 0, 100);
  const aiWrong = st.aiMode === 'everything' && D.ai && D.ai.everything.wrong;
  sfx(verdictOk ? (supported ? 'correct' : 'select') : 'wrong');  // the debrief says it in words too (right but unsupported: neutral)
  let h = '<p class="big">Score ' + score + ' / 100 <span class="small">(game)</span></p>';
  h += '<p><b>Verdict:</b> ' + esc(D.verdicts[v].label) + ' — ' + (verdictOk ? 'correct. ' : 'not supported. ') + esc(D.verdicts[v].why || '') + '</p>';
  if (!verdictOk) h += '<p><b>Better verdict:</b> ' + esc(D.verdicts.find(x => x.good).label) + '</p>';
  h += '<p><b>Reasoning:</b> ' + (reasonOk ? (supported ? 'sound. ' : 'sound in principle, but it rests on evidence you never queried (no credit). ') : 'weak. ') + esc(D.reasons[r].why || '') + '</p>';
  if (verdictOk && !supported) h += '<p><b>Unsupported:</b> ' + (needsMissed ? esc(goodV.needsWhy || 'the right answer, but it rests on evidence you never queried.') + ' In a real case that is a guess, and a guess can’t be defended in a report.' : 'the right answer, but none of your queries reached the decisive evidence. In a real case that is a guess, and a guess can’t be defended in a report.') + '</p>';
  h += '<p><b>Alternatives:</b> ' + altOk + ' of ' + pickN + ' worth ruling out.</p><ul>' +
    D.alts.filter(x => x.good).map(x => '<li>' + esc(x.label) + ': ' + esc(x.why) + '</li>').join('') + '</ul>';
  h += '<p><b>Queries:</b> ' + st.keys + ' focused on the decisive evidence' + (st.broad ? ', ' + st.broad + ' broad (a wall of rows costs time and Focus)' : '') + (st.trap ? ', ' + st.trap + ' that could only mislead' : '') + '.</p>';
  h += '<h3>The focused path</h3>' + D.path;
  if (st.aiMode) h += '<h3>About Tally</h3><p>' + esc(st.aiMode === 'everything' ? D.ai.everything.reveal : (st.keys ? 'You asked a specific question and checked it against the evidence. That is how an assistant helps.' : 'You asked a specific question, which is how an assistant helps. Tally was right this time, but you never confirmed its answer in the evidence yourself.')) + '</p>';
  h += '<h3>Response</h3><ul>' + D.response.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (D.techs.length) h += '<p class="small">ATT&amp;CK: ' + D.techs.map(t => esc(t + ' ' + TECH[t].name)).join(' · ') + '</p>';
  D.techs.forEach(t => unlock('tech', t));
  (D.acts || []).forEach(a => unlock('act', a));
  unlock('act', 'drill');
  await UI.openModal('Debrief · ' + D.title, h, [{label: 'Continue', meta: {good: true}}], {closable: false, cls: 'drill'});
  await gainXP(Math.round(score / 4));
  return {score: score, supported: supported, verdictOk: verdictOk, reasonOk: reasonOk, alts: altOk, keys: st.keys, broad: st.broad, trap: st.trap, ai: st.aiMode, aiWrong: aiWrong};
}

async function drillAI(D, st) {
  const items = [
    {label: 'Give Tally everything (paste all the logs) and ask for a verdict', meta: {mode: 'everything'}},
    {label: 'Ask Tally: “' + D.ai.specific.q + '”', meta: {mode: 'specific'}},
    {label: 'Back', meta: {back: true}}];
  const i = await UI.openModal('Tally · AI assistant', '<p>Tally runs on your console. It answers in seconds. It can be wrong.</p>', items, {closable: false, cls: 'drill'});
  const m = items[i].meta;
  if (m.back) return;
  G.focus = Math.max(0, G.focus - 1);
  if (!st.aiMode || m.mode === 'everything') st.aiMode = m.mode;
  const a = m.mode === 'everything' ? D.ai.everything.text : D.ai.specific.text;
  const html = drillPre(['Tally: ' + a], 'ai');
  st.findings.push({head: 'Tally (AI): ' + (m.mode === 'everything' ? 'everything' : D.ai.specific.q), html: html});
  await UI.openModal('Tally says', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});
}

/* ---- engine/game.js ---- */
/* ============================================================
   UPTIME · engine/game.js
   Shared game core: overworld, rendering, HUD, script runner, investigations
   (battles), alerts, scorecard, Field Manual, menus, save/load, title, main loop,
   debug hooks for tests. Each edition supplies its data and story (EDITION,
   newState, objective, interact, triggers, editionTile, summary, introScript...).
   ============================================================ */
'use strict';

let G = null;          // saved game state
let B = null;          // current battle (not saved)
let busy = 0;          // running scripts
let moving = null;     // current step animation
let fade = 0;          // map transition fade (0..1)
let started = false;   // past the title screen
let lastT = 0, encCooldown = 0, toastT = 0, shake = 0, titleOpen = false;

const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};

/* ---------- Helpers ---------- */
// A named speaker standing on this map turns to face the player while speaking (talks and walk-triggered scenes alike).
const say = (t, who) => { faceSpeaker(who); return UI.say(t, who); };
const choose = (p, items, o) => UI.choose(p, items, o);
function toast(msg, ms) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); toastT = ms || 2600; }
function unlock(kind, key) { if (!G.fm[kind + ':' + key]) { G.fm[kind + ':' + key] = true; return true; } return false; }
function touchCSF(fn) { if (!G.csf[fn]) { G.csf[fn] = true; toast('CSF ' + fn + ' unlocked in the Field Manual'); } }
function groupFixed(g) { return !!G.f[GROUPS[g].fix]; }
function tool() { return G.party[G.active]; }
function toolName(t) { return TOOLS[t.id].name + (t.tuned ? ' · Tuned' : ''); }
// A tool that evolved from another still counts as having it (EVOLVED_FROM, edition data), so earlier checks keep working.
function hasTool(id) { return G.party.some(t => t.id === id || EVOLVED_FROM[t.id] === id); }
function addTool(id, lvl) { if (!hasTool(id)) G.party.push({id: id, lvl: lvl || 3, xp: 0, tuned: false}); }
function npcHere(map, x, y) { return NPCS.find(n => n.map === map && n.x === x && n.y === y && (!n.cond || n.cond(G))); }
function mapRows(m) { return MAPS[m].rows; }

/* ---------- Metrics ---------- */
function metricVals() {
  const m = G.m;
  return {
    closed: m.closed,
    acc: m.judged ? Math.round(m.correctShown / m.judged * 100) : null,
    tta: m.ttaN ? +(m.ttaSum / m.ttaN).toFixed(1) : null,
    esc: m.esc ? Math.round(m.escOk / m.esc * 100) : null,
    evid: m.judged ? Math.round((m.evOk || 0) / m.judged * 100) : null,
    uptime: +G.uptime.toFixed(2),
    mfa: Math.round(G.mfaSet.length / ACCOUNTS_TOTAL * 100),
    patch: Math.round(Object.keys(GROUPS).filter(groupFixed).length / 4 * 100),
    ...(typeof editionMetricVals === 'function' ? editionMetricVals() : {})
  };
}
const METRICS = [
  {k: 'closed', label: 'Alerts closed (read with accuracy)', unit: '', higher: true},
  {k: 'acc', label: 'Verdict accuracy', unit: '%', higher: true},
  {k: 'evid', label: 'Verdicts with evidence ≥ 40', unit: '%', higher: true},
  {k: 'tta', label: 'Time to acknowledge (game seconds)', unit: ' s', higher: false},
  {k: 'esc', label: 'Escalation precision (real, with evidence ÷ all)', unit: '%', higher: true},
  {k: 'uptime', label: 'District uptime', unit: '%', higher: true},
  {k: 'mfa', label: 'MFA coverage', unit: '%', higher: true},
  {k: 'patch', label: 'Hardening (baseline fixes)', unit: '%', higher: true}
];
// An edition with its own scorecard (EDITION.ownMetrics) replaces the analyst metrics above with EDITION_METRICS.
if (typeof EDITION !== 'undefined' && EDITION.ownMetrics) METRICS.length = 0;
if (typeof EDITION_METRICS !== 'undefined') METRICS.push(...EDITION_METRICS);
function track() {
  const v = metricVals();
  for (const d of METRICS) {
    if (d.when && !d.when()) continue;
    const x = v[d.k]; if (x === null || x === undefined) continue;
    const t = G.track[d.k] || (G.track[d.k] = {best: x, worst: x});
    if (d.higher) { t.best = Math.max(t.best, x); t.worst = Math.min(t.worst, x); }
    else { t.best = Math.min(t.best, x); t.worst = Math.max(t.worst, x); }
  }
}

  if (G.auto && G.steps % 15 === 0 && G.queue > 0 && hasTool('ledger')) {
    if (rnd() < G.fpWeight / (G.fpWeight + 50) * 0.8) {
      G.queue--; G.m.autoClosed++;
      toast('Ledger auto-closed a known false positive');

        // A real alert was auto-closed. A weekly sample review catches about half of those (game).
        if (G.autoReview && rnd() < 0.5) { G.queue = Math.min(9, G.queue + 1); toast('Weekly sample: a person caught a real alert Ledger had auto-closed. It is back in the queue.'); }
        else G.m.missed++;

    if (kind === 'mal' && G.brief[x.t] && G.brief[x.t] >= G.day) w *= 0.5;
    if (kind === 'mal' && G.badge && x.t === 'sprayer') w *= 0.5;

}

  const wts = alertThreatWeights(kind);
  const t = weighted(wts).t;

function fixPosition() {
  if (!G || !MAPS[G.map]) return false;
  const d0 = tileDef(G.map, G.x, G.y);
  if (d0 && !d0.solid && !npcHere(G.map, G.x, G.y)) return false;
  const rows = mapRows(G.map), H = rows.length, W = rows[0].length;
  for (let r = 1; r < Math.max(W, H); r++) {
    const ring = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (Math.max(Math.abs(dx), Math.abs(dy)) === r) ring.push([G.x + dx, G.y + dy, Math.abs(dx) + Math.abs(dy)]);
    ring.sort((a, b) => a[2] - b[2]);
    for (const [x, y] of ring) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const d = tileDef(G.map, x, y);
      if (d && !d.solid && !doorAt(G.map, x, y) && !npcHere(G.map, x, y)) { G.x = x; G.y = y; return true; }
    }
  }
  return false;
}

    return true;
  } catch (e) {
    await UI.openModal('Import', '<p>' + esc(e.message) + '</p>', [{label: 'OK'}]);
    return false;
  }
}
let lastImportText = '';
document.addEventListener('input', e => { if (e.target && e.target.id === 'codebox') lastImportText = e.target.value; }, true);

/* ---------- Main loop ---------- */
function frame(t) {
  const dt = Math.min(50, t - (lastT || t)); lastT = t;
  UI.tick(dt);
  const tallOK = !!(G && started && !B && !titleOpen);
  if (tallOK !== Screen.tallOK) { Screen.tallOK = tallOK; Screen.fit(); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) document.getElementById('toast').classList.remove('show'); }
  if (shake > 0) shake -= dt;
  watchSounds();
  if (G && started) {
    if (!titleOpen) G.playMs += dt;
    if (moving) {
      moving.t += dt / (UI.turbo ? 45 : 140);
      if (moving.t >= 1) {
        const mv = moving; stepDone();
        if (!busy && !UI.mode && !UI.modal && !moving) {
          const held = ['up', 'down', 'left', 'right'].find(d => Input.held[d]);
          const tap = Input.taps.find(b => DIRS[b]);
          Input.taps = Input.taps.filter(b => !DIRS[b]);
          const nd = tap || held;
          if (nd) tryMove(nd);
        }
      }
    } else if (!busy && !UI.mode && !UI.modal) {
      const tap = Input.taps.find(b => DIRS[b]);
      Input.taps = Input.taps.filter(b => !DIRS[b]);
      const held = ['up', 'down', 'left', 'right'].find(d => Input.held[d]);
      const nd = tap || held;
      if (nd) tryMove(nd);
    } else { Input.taps = Input.taps.filter(b => !DIRS[b]); }
    if (B) drawBattle(Screen.ctx); else drawWorld(Screen.ctx);
    hudUpdate();
  } else {
    drawTitleBg(Screen.ctx, t);
  }
  requestAnimationFrame(frame);
}
function drawTitleBg(ctx, t) {
  const off = Settings.calm() ? 0 : Math.floor(t / 60) % 16;  // reduced flashing: the title field stands still
  for (let y = 0; y < 12; y++) for (let x = 0; x < 21; x++) {
    const k = (x + y) % 7 === 0 ? 'L' : (x * 3 + y) % 5 === 0 ? 'K' : 'G';
    ctx.drawImage(sprite(S[k] ? k : 'G', k), x * 16 - off, y * 16);
  }
}

// Sounds for things any edition's code can cause: a new alert in the queue, a badge earned. Loading a save resets
// the watch silently.
const soundWatch = {g: null, q: 0, b: 0};
function badgeCount() { return G ? (G.badge ? 1 : 0) + (EDITION.badgeFlags || []).filter(k => G.f[k]).length : 0; }
function watchSounds() {
  if (!G || !started) { soundWatch.g = null; return; }
  const q = G.queue, b = badgeCount();
  if (soundWatch.g !== G) { soundWatch.g = G; soundWatch.q = q; soundWatch.b = b; return; }
  if (b > soundWatch.b) sfx('badge');
  if (q > soundWatch.q) sfx('alert');  // both can land in one frame; with alerts only, the alert must still sound
  soundWatch.q = q; soundWatch.b = b;
}

/* ---------- Button dispatch ---------- */
function onButton(b) {
  if (UI.modal || UI.mode) { UI.handle(b); Input.taps = []; return; }
  if (!G || !started || busy || moving) return;
  if (b === 'a') {
    // Talking to someone: they turn to face you for the conversation, then go back to their own facing (see run()).
    const [dx, dy] = DIRS[G.dir], npc = npcHere(G.map, G.x + dx, G.y + dy);
    interact();
    if (npc && busy) npcFace[npc.id] = OPP_DIR[G.dir];
  }
  else if (b === 'start') run(startMenu);
  else if (b === 'select') run(openQueue);
}

/* ---------- Debug / test hooks (no effect on play) ---------- */
window.__UPTIME = {
  peek() {
    let ui = null;
    if (UI.modal) ui = {type: 'modal', options: UI.modal.items.map(o => ({label: o.label, meta: o.meta || null, disabled: !!o.disabled, done: !!o.done})), cursor: UI.modal.cursor, multi: UI.modal.multi, sel: [...UI.modal.sel]};
    else if (UI.mode === 'say') ui = {type: 'say', typing: UI.typing, text: UI.full};
    else if (UI.mode === 'choice') ui = {type: 'choice', options: UI.choice.items.map(o => ({label: o.label, meta: o.meta || null, disabled: !!o.disabled})), cursor: UI.choice.cursor, cols: UI.choice.cols, text: UI.text.textContent};
    if (!G) return {started: false, ui: ui};
    const solid = mapRows(G.map).map((r, y) => r.split('').map((c, x) => blocked(G.map, x, y) ? 1 : 0));
    return {
      started: started, map: G.map, x: G.x, y: G.y, dir: G.dir, moving: !!moving, busy: busy, day: G.day, focus: G.focus,
      f: G.f, rank: G.rank, ui: ui, objective: objective(), marker: markerDoor(), solid: solid, doors: MAPS[G.map].doors,
      battle: B ? {kind: B.spec.kind, ev: B.ev, dwell: B.dwell, story: !!B.spec.story, tech: B.spec.tech} : null,
      party: G.party, metrics: metricVals(), m: G.m, fm: fmPct(), queue: G.queue, mfa: G.mfaSet.length, summary: !!G.f.summaryShown,
      qt: Series.qt(),
      extra: typeof peekExtra === 'function' ? peekExtra() : null
    };
  },
  turbo(on) { UI.turbo = !!on; },
  seed(n) { seedOverride = n >>> 0; },
  state() { return G; },
  drawn() { drawnWanted = true; return drawnEnts.slice(); },  // the first call turns recording on; read again after a frame
  series() { return Series.load(); },
  settings() { return Object.assign({}, Settings.v); }
};

/* ---------- Boot ---------- */
function boot() {
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('touch', !!touch);
  Settings.load();
  // Audio may only start from a user gesture (autoplay policy): the first key, tap or click unlocks it.
  for (const ev of ['keydown', 'pointerdown', 'touchend', 'mousedown']) window.addEventListener(ev, () => Sound.unlock(), {capture: true, passive: true});
  Settings.hooks.push(() => { platformCache = null; if (B) bhud(); });
  Series.load();
  Screen.init(); UI.init(); Input.init();
  Input.handler = onButton;
  document.querySelectorAll('.buildid').forEach(e => e.textContent = BUILD_ID + ' · ' + BUILD_TS);
  requestAnimationFrame(frame);
  titleScreen();
  const note = Settings.soundNotice(); if (note) toast(note, 6000);  // once: sound starts off
}
window.addEventListener('DOMContentLoaded', boot);

</script>
