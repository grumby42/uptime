<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Uptime</title>
<style>
/* UPTIME · style.css — phone-first layout; menus readable in light and dark */
:root{
  --bg:#10141f; --ink:#e9edf5; --paper:#f4f2ec; --paper-ink:#1b2233; --muted:#4a5163;
  --cur:#e6f5c8; --accent:#2f6e3e; --warn:#b8432f; --gold:#ffd96a;
  --fs:14px; --s:1;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1f2533; --paper-ink:#e9edf5; --muted:#aab3c5; --cur:#2c4a35; }
}
:root[data-theme="dark"]{ --paper:#1f2533; --paper-ink:#e9edf5; --muted:#aab3c5; --cur:#2c4a35; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;max-width:100vw}
body{font-family:var(--mono);-webkit-text-size-adjust:100%;touch-action:manipulation;min-height:100vh;min-height:100dvh;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#app{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;width:100%}
#stage{position:relative;max-width:100vw}
#screen{position:relative;overflow:hidden;background:#000;margin:0 auto}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD over the map */
#hud{position:absolute;left:0;right:0;top:0;padding:2px 6px;font-size:calc(var(--fs) * .8);line-height:1.3;
  background:rgba(16,20,31,.72);color:#fff;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud div{overflow:hidden;text-overflow:ellipsis}
#hud .obj{color:var(--gold)}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);background:#1b2233;color:#fff;border:2px solid var(--gold);
  padding:3px 8px;font-size:calc(var(--fs) * .8);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

/* Battle panels (real text over the canvas) */
.bpanel{position:absolute;display:none;background:#fff;color:#1b2233;border:2px solid #1b2233;padding:3px 6px;font-size:var(--fs);line-height:1.25}
.bpanel.show{display:block}
#bcard{left:2.5%;top:4%;width:47%}
#btool{left:50.5%;top:46%;width:47%}
.bt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bcard .bt{white-space:normal}
.bs{font-size:.8em;color:#4a5163;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:4px;font-size:.8em;margin-top:2px}
.bl{width:5.6em;flex:none}
.bo{flex:1;height:.8em;border:2px solid #1b2233;display:block;position:relative}
.bi{display:block;height:100%}
.bn{width:3.6em;flex:none;text-align:right}

/* Dialogue / choice panel */
#panel{background:#fff;color:#1b2233;font-size:var(--fs);line-height:1.4;display:none}
#panel.show{display:block}
body.landscape #panel{position:absolute;left:0;right:0;bottom:0;max-height:58%;overflow:auto;border-top:3px solid #1b2233;padding:.5em .9em;z-index:5}
body.portrait #panel{display:block;visibility:hidden;width:100%;min-height:150px;font-size:14px;padding:8px 12px;border-top:3px solid #1b2233}
body.portrait #panel.show{visibility:visible}
#pwho{font-weight:700;color:var(--accent)}
#ptext{white-space:pre-wrap;min-height:1.4em}
#pmore{text-align:right;animation:blink 1s steps(2) infinite;height:1em;line-height:1em}
@keyframes blink{50%{opacity:0}}
#popts{display:grid;gap:2px 10px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;color:inherit;font-size:inherit;
  padding:2px 4px;cursor:pointer;line-height:1.25}
.opt .car{display:inline-block;width:1em;visibility:hidden}
.opt.cur{border-color:#1b2233;background:#e6f5c8}
.opt.cur .car{visibility:visible}
.opt.dis{opacity:.45;cursor:default}
.opt .note{display:block;font-size:.78em;color:#4a5163;padding-left:1.25em}
body.portrait #popts .opt{min-height:36px}

/* On-screen pad */
#pad{display:none}
body.portrait #pad, body.touch #pad{display:grid}
body.portrait #pad{grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:420px;padding:10px 8px 6px;gap:4px}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);justify-self:start}
.dpad button,.ab button,.sys button{touch-action:none;border:none;color:#e9edf5;cursor:pointer}
.dpad button{background:#3a4a6b;font-size:20px;border-radius:6px}
.dpad button.on,.ab button.on,.sys button.on{filter:brightness(1.5)}
.du{grid-column:2;grid-row:1}.dl{grid-column:1;grid-row:2}.dr{grid-column:3;grid-row:2}.dd{grid-column:2;grid-row:3}
.dc{grid-column:2;grid-row:2;background:#2b2f3a;border-radius:4px}
.ab{display:flex;gap:8px;justify-self:end;align-items:center}
.ab button{width:54px;height:54px;border-radius:50%;font-size:20px;font-weight:700}
.ab .ba{background:#b8432f;margin-top:-26px}.ab .bb{background:#8a4b2f;margin-top:26px}
.sys{display:flex;flex-direction:column;gap:10px;align-items:center}
.sys button{background:#4a5163;border-radius:12px;font-size:10px;padding:8px 6px;letter-spacing:.5px}
body.landscape.touch #pad{position:fixed;inset:0;pointer-events:none;display:block}
body.landscape.touch .dpad{position:fixed;left:14px;bottom:20px;pointer-events:auto}
body.landscape.touch .ab{position:fixed;right:18px;bottom:30px;pointer-events:auto}
body.landscape.touch .sys{position:fixed;right:18px;top:14px;flex-direction:row;pointer-events:auto}
#foot{font-size:11px;color:#8b93a7;padding:6px 10px;text-align:center;max-width:100vw}
body.portrait #foot .keys{display:none}

/* Modal pages */
#modal{position:fixed;inset:0;background:rgba(8,10,16,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:8px}
#modal.show{display:flex}
.mbox{background:var(--paper);color:var(--paper-ink);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;border:3px solid #1b2233;box-shadow:0 0 0 3px var(--paper)}
.mhead{font-weight:700;padding:10px 14px 0;font-size:17px;letter-spacing:1px}
.mhead:empty{display:none}
.mbody{overflow:auto;padding:6px 14px;font-size:15px;line-height:1.45;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.mbody p{margin:.5em 0}
.mbody h3{font-size:14px;margin:1em 0 .3em;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.mopts{padding:6px 10px 10px;display:flex;flex-direction:column;gap:3px;max-height:48%;overflow:auto;flex:none}
.mopts .opt{font-size:15px;min-height:40px;padding:6px 8px;color:var(--paper-ink)}
.mopts .opt.cur{background:var(--cur);border-color:var(--paper-ink)}
.mopts .opt .note{color:var(--muted)}
.mopts .opt.sel{font-weight:700}
.chk{display:inline-block;width:1.4em}
.mbody .small,.small{font-size:12px;color:var(--muted)}
.fm{padding:6px 0;border-bottom:1px solid rgba(127,127,127,.3);font-size:14px}
.fm.lock{color:var(--muted)}
table.sc{border-collapse:collapse;width:100%;font-size:13px;margin:.4em 0}
table.sc th,table.sc td{border-bottom:1px solid rgba(127,127,127,.35);padding:3px 4px;text-align:left}
table.sc th{font-size:12px;color:var(--muted)}
.dir{color:var(--warn);font-weight:700}
.card{border:2px solid var(--paper-ink);padding:6px 8px;margin:6px 0;font-size:14px}
.tag{font-size:11px;border:1px solid var(--muted);padding:0 4px;color:var(--muted)}
textarea{width:100%;font-family:var(--mono);font-size:12px;background:#fff;color:#1b2233;border:2px solid #1b2233;-webkit-user-select:text;user-select:text}
.err{color:var(--warn)}
.title{text-align:center;padding:10px 0}
.logo{font-size:44px;font-weight:800;letter-spacing:8px;color:var(--accent)}
.big{font-size:17px;font-weight:700}
@media (max-width:420px){ table.sc{font-size:11.5px} table.sc th,table.sc td{padding:3px 2px} .mbody{font-size:14px;padding:6px 10px} }

/* Investigation drills, inbox room and text stream (Mail Room) */
pre.art{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-family:var(--mono);font-size:12px;line-height:1.35;
  background:rgba(127,127,127,.12);border-left:3px solid var(--accent);padding:6px 8px;margin:.4em 0;-webkit-user-select:text;user-select:text}
pre.art.wall{border-left-color:var(--muted);color:var(--muted);max-height:220px;overflow:auto}
pre.art.ai{border-left-color:var(--gold)}
.find{margin:.4em 0}
.mbody details summary{cursor:pointer;color:var(--accent)}
.mail{border:2px solid var(--paper-ink);padding:6px 8px;margin:.4em 0;font-size:14px}
.mail .mh{font-size:12px;color:var(--muted);word-break:break-word}
.mail .cue{display:block;margin-top:4px;font-size:12px;border-left:3px solid var(--gold);padding-left:6px}
.sms{max-width:85%;border-radius:10px;padding:6px 10px;margin:6px 0;background:rgba(127,127,127,.18);font-size:14px}
.sms .from{display:block;font-size:11px;color:var(--muted)}

</style>
</head>

/* ============================================================
   UPTIME · engine.js
   RNG, sprite cache, screen scaling, input, UI primitives
   (dialogue panel with typewriter, choice lists, modal menus), save codec.
   ============================================================ */
'use strict';

const VW = 320, VH = 180, TS = 16;

/* ---------- RNG (mulberry32, seedable for tests) ---------- */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = makeRng((Date.now() ^ 0x5eed) >>> 0);
function rnd() { return rng(); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function weighted(list) { // [{w,...}]
  const tot = list.reduce((s, x) => s + x.w, 0);
  let r = rnd() * tot;
  for (const x of list) { if ((r -= x.w) < 0) return x; }
  return list[list.length - 1];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Sprite cache: grid + palette -> offscreen canvas ---------- */
const SPR_CACHE = {};
function sprite(key, palKey, opts) {
  opts = opts || {};
  const id = key + '|' + palKey + '|' + (opts.variant || '');
  if (SPR_CACHE[id]) return SPR_CACHE[id];
  let grid = S[key];
  if (!grid) throw new Error('no sprite ' + key);
  if (opts.variant === 'back') grid = grid.map((r, y) => (y >= 3 && y <= 7) ? r.replace(/[34]/g, '2') : r);
  if (opts.variant === 'step') grid = grid.slice(0, 13).concat(['0000122112210000', '0000122011110000', '0000111000000000']);
  if (opts.variant === 'tuned') grid = tunedGrid(grid);
  const pal = PAL[palKey];
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const x = c.getContext('2d');
  grid.forEach((row, yy) => {
    for (let xx = 0; xx < 16; xx++) {
      const v = +row[xx];
      if (v) { x.fillStyle = pal[v - 1]; x.fillRect(xx, yy, 1, 1); }
    }
  });
  SPR_CACHE[id] = c;
  return c;
}
// "Tuned" form: adds an antenna and a status light along the top edge (original variation).
function tunedGrid(grid) {
  const g = grid.map(r => r.split(''));
  g[0][7] = '1'; g[0][8] = '1'; g[1][7] = '4'; g[1][8] = '4';
  for (let y = 12; y < 16; y++) { if (g[y][0] === '0') g[y][0] = y % 2 ? '4' : '0'; if (g[y][15] === '0') g[y][15] = y % 2 ? '4' : '0'; }
  return g.map(r => r.join(''));
}

/* ---------- Screen & scaling ---------- */
const Screen = {
  canvas: null, ctx: null, k: 1, s: 1,
  init() {
    this.canvas = document.getElementById('cv');
    this.ctx = this.canvas.getContext('2d');
    window.addEventListener('resize', () => this.fit());
    window.addEventListener('orientationchange', () => setTimeout(() => this.fit(), 100));
    this.fit();
  },
  fit() {
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;
    const touch = document.body.classList.contains('touch');
    const portrait = H > W * 1.05 || W < 560;
    document.body.classList.toggle('portrait', portrait);
    document.body.classList.toggle('landscape', !portrait);
    let availW, availH;
    if (portrait) { availW = W; availH = Math.max(180, H * 0.42); }
    else { availW = W - (touch ? 300 : 24); availH = H - 34; }
    // largest whole number of device pixels per logical pixel that fits
    let k = Math.floor(Math.min(availW * dpr / VW, availH * dpr / VH));
    if (k < 1) k = 1;
    // keep the CSS scale a whole number where the screen is big enough (desktop: 2x, 3x, 4x...)
    if (dpr <= 1.01 || k / dpr >= 2) { const cssK = Math.max(1, Math.floor(k / dpr)); k = Math.round(cssK * dpr); }
    this.k = k; this.s = k / dpr;
    this.canvas.width = VW * k; this.canvas.height = VH * k;
    const wrap = document.getElementById('screen');
    wrap.style.width = (VW * this.s) + 'px'; wrap.style.height = (VH * this.s) + 'px';
    document.documentElement.style.setProperty('--s', this.s);
    document.documentElement.style.setProperty('--fs', Math.max(10, Math.round(4.6 * this.s)) + 'px');
    this.ctx.setTransform(k, 0, 0, k, 0, 0);
    this.ctx.imageSmoothingEnabled = false;
  }
};

/* ---------- Input ---------- */
const BTN_KEYS = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  z:'a', Z:'a', x:'b', X:'b', Enter:'start', Shift:'select'
};
const Input = {
  held: {}, taps: [], handler: null,
  init() {
    window.addEventListener('keydown', e => {
      const b = BTN_KEYS[e.key];
      if (!b) return;
      if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
      e.preventDefault();
      if (e.repeat && !['up','down','left','right'].includes(b)) return;
      this.down(b, e.repeat);
    });
    window.addEventListener('keyup', e => { const b = BTN_KEYS[e.key]; if (b) this.up(b); });
    window.addEventListener('blur', () => { this.held = {}; });
    document.querySelectorAll('[data-btn]').forEach(el => {
      const b = el.dataset.btn;
      const on = e => { e.preventDefault(); el.classList.add('on'); this.down(b, false); };
      const off = e => { e.preventDefault(); el.classList.remove('on'); this.up(b); };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
      el.addEventListener('contextmenu', e => e.preventDefault());
    });
  },
  down(b, repeat) {
    const wasHeld = this.held[b];
    this.held[b] = true;
    if (!wasHeld || repeat) this.taps.push(b);
    if (this.handler) this.handler(b, repeat);
  },
  up(b) { this.held[b] = false; }
};

/* ---------- UI: dialogue panel, choices, modal ---------- */
const UI = {
  panel: null, text: null, who: null, opts: null, more: null,
  mode: null,            // 'say' | 'choice' | null
  typing: false, full: '', shown: 0, resolve: null,
  choice: null,          // {items, cursor, cols, resolve, cancel}
  modalEl: null, modal: null, // {items, cursor, resolve, closable}
  turbo: false, openedAt: 0,
  ghost() { return performance.now() - this.openedAt < 350; }, // ignore the click that belongs to the tap which opened this UI
  init() {
    this.panel = document.getElementById('panel');
    this.text = document.getElementById('ptext');
    this.who = document.getElementById('pwho');
    this.opts = document.getElementById('popts');
    this.more = document.getElementById('pmore');
    this.modalEl = document.getElementById('modal');
    this.panel.addEventListener('click', e => {
      if (e.target.closest('[data-i]')) return;
      if (this.mode === 'say' && !this.ghost()) this.handle('a');
    });
  },
  showPanel(on) { this.panel.classList.toggle('show', !!on); },
  say(text, who) {
    return new Promise(res => {
      this.mode = 'say'; this.resolve = res; this.openedAt = performance.now();
      this.full = text; this.shown = 0; this.typing = true;
      this.who.textContent = who || ''; this.who.style.display = who ? '' : 'none';
      this.opts.innerHTML = ''; this.more.style.visibility = 'hidden';
      this.text.textContent = '';
      this.showPanel(true);
      if (this.turbo) { this.shown = this.full.length; }
    });
  },
  tick(dt) {
    if (this.mode === 'say' && this.typing) {
      this.shown = Math.min(this.full.length, this.shown + dt * 0.09);
      this.text.textContent = this.full.slice(0, Math.floor(this.shown));
      if (this.shown >= this.full.length) { this.typing = false; this.more.style.visibility = 'visible'; }
    }
  },
  choose(prompt, items, o) {
    o = o || {};
    return new Promise(res => {
      this.mode = 'choice';
      this.choice = {items, cursor: o.cursor || 0, cols: o.cols || 1, resolve: res, cancel: !!o.cancel};
      this.openedAt = performance.now();
      while (this.choice.items[this.choice.cursor] && this.choice.items[this.choice.cursor].disabled && this.choice.cursor < items.length - 1) this.choice.cursor++;
      this.who.textContent = o.who || ''; this.who.style.display = o.who ? '' : 'none';
      this.text.textContent = prompt || '';
      this.more.style.visibility = 'hidden';
      this.showPanel(true);
      this.renderChoice();
    });
  },
  renderChoice() {
    const c = this.choice;
    this.opts.style.gridTemplateColumns = 'repeat(' + c.cols + ', minmax(0,1fr))';
    this.opts.innerHTML = c.items.map((it, i) =>
      '<button class="opt' + (i === c.cursor ? ' cur' : '') + (it.disabled ? ' dis' : '') + '" data-i="' + i + '">' +
      '<span class="car">▸</span>' + esc(it.label) + (it.note ? '<span class="note">' + esc(it.note) + '</span>' : '') + '</button>').join('');
    this.opts.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      if (this.ghost()) return;
      const i = +b.dataset.i; if (c.items[i].disabled) return;
      c.cursor = i; this.finishChoice(i);
    }));
  },
  finishChoice(i) {
    const c = this.choice;
    this.choice = null; this.mode = null;
    this.opts.innerHTML = '';
    c.resolve(i);
  },
  hidePanel() { if (!this.mode) this.showPanel(false); },
  handle(b) {
    if (this.modal) return this.modalHandle(b);
    if (this.mode === 'say') {
      if (b === 'a' || b === 'b') {
        if (this.typing) { this.shown = this.full.length; this.text.textContent = this.full; this.typing = false; this.more.style.visibility = 'visible'; }
        else { const r = this.resolve; this.mode = null; this.resolve = null; r(); }
      }
      return true;
    }
    if (this.mode === 'choice') {
      const c = this.choice, n = c.items.length;
      const move = d => { let i = c.cursor; for (let k = 0; k < n; k++) { i = (i + d + n) % n; if (!c.items[i].disabled) break; } c.cursor = i; this.renderChoice(); };
      if (b === 'up') move(-c.cols); else if (b === 'down') move(c.cols);
      else if (b === 'left') move(-1); else if (b === 'right') move(1);
      else if (b === 'a') { if (!c.items[c.cursor].disabled) this.finishChoice(c.cursor); }
      else if (b === 'b' && c.cancel) this.finishChoice(-1);
      return true;
    }
    return false;
  },
  /* Modal: full-screen readable page with a list of options. */
  openModal(title, bodyHtml, items, o) {
    o = o || {};
    return new Promise(res => {
      this.modal = {items, cursor: o.cursor || 0, resolve: res, closable: o.closable !== false, multi: o.multi || 0, sel: new Set()};
      this.openedAt = performance.now();
      this.modalEl.innerHTML =
        '<div class="mbox ' + (o.cls || '') + '"><div class="mhead">' + esc(title) + '</div>' +
        '<div class="mbody" id="mbody">' + bodyHtml + '</div>' +
        '<div class="mopts" id="mopts"></div></div>';
      this.modalEl.classList.add('show');
      this.renderModal();
      const mb = document.getElementById('mbody'); if (mb) mb.scrollTop = 0;
    });
  },
  renderModal() {
    const m = this.modal; if (!m) return;
    const box = document.getElementById('mopts');
    box.innerHTML = m.items.map((it, i) =>
      '<button class="opt' + (i === m.cursor ? ' cur' : '') + (it.disabled ? ' dis' : '') + (m.sel.has(i) ? ' sel' : '') + '" data-i="' + i + '">' +
      '<span class="car">▸</span>' + (m.multi && !it.done ? '<span class="chk">' + (m.sel.has(i) ? '■' : '□') + '</span>' : '') + esc(it.label) +
      (it.note ? '<span class="note">' + esc(it.note) + '</span>' : '') + '</button>').join('');
    box.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => {
      if (this.ghost()) return;
      const i = +b.dataset.i; if (m.items[i].disabled) return;
      m.cursor = i; this.modalActivate(i);
    }));
    const cur = box.querySelector('.cur'); if (cur && cur.scrollIntoView) cur.scrollIntoView({block: 'nearest'});
  },
  modalActivate(i) {
    const m = this.modal;
    if (m.multi && !m.items[i].done) {
      if (m.sel.has(i)) m.sel.delete(i); else if (m.sel.size < m.multi) m.sel.add(i);
      this.renderModal(); return;
    }
    if (m.multi && m.items[i].done && m.sel.size !== m.multi) return;
    this.closeModal(m.multi ? [...m.sel] : i);
  },
  closeModal(v) {
    const m = this.modal; this.modal = null;
    this.modalEl.classList.remove('show'); this.modalEl.innerHTML = '';
    if (m) m.resolve(v);
  },
  modalHandle(b) {
    const m = this.modal, n = m.items.length;
    const mb = document.getElementById('mbody');
    const move = d => { let i = m.cursor; for (let k = 0; k < n; k++) { i = (i + d + n) % n; if (!m.items[i].disabled) break; } m.cursor = i; this.renderModal(); };
    if (b === 'up') { if (n <= 1 && mb) mb.scrollTop -= 60; else move(-1); }
    else if (b === 'down') { if (n <= 1 && mb) mb.scrollTop += 60; else move(1); }
    else if (b === 'left' && mb) mb.scrollTop -= 120;
    else if (b === 'right' && mb) mb.scrollTop += 120;
    else if (b === 'a') { if (!m.items[m.cursor].disabled) this.modalActivate(m.cursor); }
    else if ((b === 'b' || b === 'start') && m.closable) this.closeModal(-1);
    return true;
  }
};

/* ---------- Save codec ---------- */
const SAVE_KEY = 'uptime.slice1.save';
function checksum(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
function encodeSave(obj) {
  const json = JSON.stringify(obj);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return 'UPT1.' + b64 + '.' + checksum(json);
}
function decodeSave(code) {
  code = String(code || '').trim().replace(/\s+/g, '');
  const parts = code.split('.');
  if (parts.length !== 3 || parts[0] !== 'UPT1') throw new Error('Not an Uptime save code.');
  const json = decodeURIComponent(escape(atob(parts[1])));
  if (checksum(json) !== parts[2]) throw new Error('Save code is damaged (checksum mismatch).');
  return JSON.parse(json);
}
function storeGet() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
function storeSet(v) { try { localStorage.setItem(SAVE_KEY, v); return true; } catch (e) { return false; } }
function storeDel() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ============================================================
   UPTIME · engine/series.js
   Series-level save (localStorage key 'uptime.series'), separate from each
   edition's own save, so later editions can read what happened earlier.
   Also the core of the Quiet Thread: a hidden, series-long intruder that lives
   off the land and never raises a normal alert. It is never part of the alert
   mix: there are no wild encounters for it, only clues an analyst may notice.
   ============================================================ */
'use strict';

const SERIES_KEY = 'uptime.series';
// Quiet Thread stages: 0 unseen · 1 noticed (a clue or two) · 2 suspected (3+ clues; hunt mode opens later)
const QT_SUSPECT = 3;

const Series = {
  data: null,
  blankQT() { return {stage: 0, cluesFound: [], evicted: false}; },
  blank() { return {v: 1, quietThread: this.blankQT(), editions: {}}; },
  normQT(q) {
    const b = this.blankQT();
    if (!q || typeof q !== 'object') return b;
    b.cluesFound = Array.isArray(q.cluesFound) ? q.cluesFound.filter(x => typeof x === 'string').filter((x, i, a) => a.indexOf(x) === i) : [];
    b.stage = Math.max(+q.stage || 0, qtStageFor(b.cluesFound.length));
    b.evicted = q.evicted === true;
    return b;
  },
  load() {
    let d = null;
    try { const raw = localStorage.getItem(SERIES_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    const out = this.blank();
    if (d && typeof d === 'object') {
      out.quietThread = this.normQT(d.quietThread);
      if (d.editions && typeof d.editions === 'object') out.editions = d.editions;
    }
    this.data = out;
    return out;
  },
  save() { try { localStorage.setItem(SERIES_KEY, JSON.stringify(this.data)); return true; } catch (e) { return false; } },
  qt() { if (!this.data) this.load(); return this.data.quietThread; },
  // Merge a copy carried in an edition save (e.g. an imported save code) into the series record.
  merge(q) {
    const cur = this.qt(), inc = this.normQT(q);
    inc.cluesFound.forEach(c => { if (!cur.cluesFound.includes(c)) cur.cluesFound.push(c); });
    cur.stage = Math.max(cur.stage, inc.stage, qtStageFor(cur.cluesFound.length));
    cur.evicted = cur.evicted || inc.evicted;
    this.save();
  },
  markEdition(id, info) { if (!this.data) this.load(); this.data.editions[id] = Object.assign({}, this.data.editions[id] || {}, info); this.save(); }
};
function qtStageFor(n) { return n >= QT_SUSPECT ? 2 : n >= 1 ? 1 : 0; }

function qtNote(id) {

  const q = Series.qt();
  if (q.cluesFound.includes(id)) return false;
  q.cluesFound.push(id);

}
function qtFmHtml() {
  const found = Series.qt().cluesFound.filter(id => QT_CLUES[id]);
  const others = Series.qt().cluesFound.length - found.length;
  if (!found.length && !others) return '';
  let h = '<h3>Unexplained</h3><p class="small">No alert fired for any of these. They may be nothing. (' + Series.qt().cluesFound.length + ' noted)</p>';
  for (const id of found) {
    const c = QT_CLUES[id], t = QT_TECH[c.tech];
    h += '<div class="fm"><b>' + esc(c.tech + ' ' + t.name) + '</b> <span class="tag">long campaign</span><br>' + esc(t.plain) +
      ' Tactic: ' + esc(t.tactic.join(', ')) + '.<br><small>What you noticed: ' + esc(c.seen) + ' (game)</small></div>';
  }
  if (others) h += '<div class="fm small">' + others + ' more noted in another edition.</div>';
  h += '<div class="fm small">' + esc(QT_FIELD_NOTES) + '</div>';
  return h;
}

/* ---------- Missed attacks surface ---------- */
async function surfaceMissed(force) {
  const hidden = G.m.missed - G.m.surfaced;
  if (hidden <= 0 || (!force && hidden < 2)) return;
  G.m.correctShown = Math.max(0, G.m.correctShown - hidden);
  G.m.surfaced = G.m.missed;
  bumpUptime(-0.05); G.rep -= 3 * hidden;
  await say('Incident review: ' + hidden + ' alert' + (hidden > 1 ? 's' : '') + ' closed as not malicious were real attacks. Your accuracy has been corrected.', 'Rae Okafor');
  await say('Fast closes look great on a scorecard until they don’t. Gaming a metric hides risk; it doesn’t remove it.', 'Rae Okafor');
  if (!force) {
    const spec = genAlert('mal'); spec.dwell0 = 45; spec.title = 'Follow-up: ' + spec.title;
    await say('One of them is still active. Investigate it now.');
    await doBattle(spec);
  }
}

/* ---------- End of slice ---------- */

  await surfaceMissed(true);

    qtSummaryHtml() +

  storeSet(encodeSave(G));

}

/* ---------- Engine hooks ---------- */
function alertWeight(t, w) {
  const th = THREATS[t];
  if (th.district === 'mail' && !(G.f && G.f.mrMet)) return 0;
  if (G.f.mrMet && inMail() && MR_HOME.includes(t)) w *= 3;
  if (G.f.mrSeal && t === 'lure') w *= 0.5;
  return w;
}
function alertHost() { return inMail() ? pick(MR_HOSTS) + ' · Mail Room' : null; }
// Staff report suspicious mail some of the time (game rates: 30%, 60% once the one-tap Report button exists).
// The report is a staff event the player sees on the alert. Benign and false-positive mail gets reported too,
// at the same rate, so the tag never gives the verdict away (and a report of safe mail is never a mistake).
function alertDecorate(spec) {
  if (!mrOn() || !MR_PHISH.includes(spec.threat)) return;
  spec.staffReport = rnd() < (hasTool('reportbird') ? 0.6 : 0.3);
  if (spec.staffReport) spec.host += ' · reported by staff';

  b.tqDone = true;
  MR().tq.push(Math.round((performance.now() - b.t0) / 100) / 10);
  if (MR().tq.length > 20) MR().tq.shift();
}
async function onAlertClosed(s, verdict, correct, r) {
  if (!mrOn() || s.story) return;
  // Report rate counts staff reports only: a phishing alert counts as reported when a staff member reported it
  // (decided when the alert arrived, and shown on it), never because the analyst closed it.
  if (MR_PHISH.includes(s.threat) && s.kind === 'mal') {

    if (s.staffReport) rep.reported++;

  if (s.threat === 'payee' && s.kind === 'mal' && correct && r.good) { MR().bec++; toast('BEC payment stopped'); }

  if (G.map !== 'mail') return false;

function mrInteract(ch, tx, ty) {
  if (!inMail()) return false;

  if (ch === 'H') { run(mrHelpDesk); return true; }

async function mrTalk(npc) {

}

/* ---------- Inbox room ---------- */
function mrMailHtml(m, rev) {
  let h = '<div class="mail"><div><b>' + esc(m.display) + '</b> ' + (rev.sender ? '&lt;' + esc(m.addr) + '&gt;' : '<span class="small">(the app shows the name, not the address)</span>') + '</div>';
  if (rev.sender && m.replyTo) h += '<div class="mh">Reply-To: ' + esc(m.replyTo) + '</div>';
  h += '<div class="mh">Subject: ' + esc(m.subject) + '</div><p>' + esc(m.body) + '</p>';
  if (m.linkText) h += '<p>Link: <u>' + esc(m.linkText) + '</u>' + (rev.link ? ' · hover shows <b>' + esc(m.linkHref) + '</b>' : '') + '</p>';
  if (m.attachment) h += '<p>Attachment: <b>' + esc(m.attachment) + '</b></p>';
  if (rev.auth) h += '<div class="mh">Authentication-Results (our gateway): ' + esc(m.auth) + '</div>';
  const L = {sender: 'Sender', link: m.linkText ? 'Link' : 'Link / attachment', tone: 'Tone', auth: 'Authentication'};
  for (const k of ['sender', 'link', 'tone', 'auth']) if (rev[k]) h += '<span class="cue">' + L[k] + ': ' + esc(m.cues[k]) + '</span>';
  return h + '</div>';
}
async function mrInboxRoom() {
  if (!G.f.mrMet) { await say('Staff desks. Bea should show you around first.'); return; }
  const m = MR();
  if (G.f.mrInbox) { await say('The inbox room is clear. Door code ' + MR_DOORCODE + '. Staff use the same cues now: name vs address, link text vs target, pressure, and what authentication does and doesn’t prove.'); return; }
  await say('The inbox room (a training room, game): the door locks until all six messages are sorted. Inspect what you like, then Trust or Report. Each right call gives one digit of the code.');
  for (let n = 0; n < MR_INBOX.length; n++) {
    if (m.inbox[n]) continue;
    const msg = MR_INBOX[n], rev = {};
    while (true) {
      const code = MR_DOORCODE.split('').map((c, j) => m.inbox[j] ? c : '_').join(' ');
      const items = [
        {label: 'Inspect the sender', disabled: !!rev.sender, meta: {k: 'sender'}},
        {label: msg.linkText ? 'Hover over the link' : 'Check the link or attachment', disabled: !!rev.link, meta: {k: 'link'}},
        {label: 'Read the tone', disabled: !!rev.tone, meta: {k: 'tone'}},
        {label: 'Check authentication results', disabled: !!rev.auth, meta: {k: 'auth'}},
        {label: 'A · Trust it', meta: {k: 'trust', good: msg.good === 'trust'}},
        {label: 'B · Report it', meta: {k: 'report', good: msg.good === 'report'}}];
      const i = await UI.openModal('Inbox room · message ' + (n + 1) + ' of 6 · code ' + code, mrMailHtml(msg, rev), items, {closable: false, cls: 'drill'});
      const k = items[i].meta.k;
      if (k !== 'trust' && k !== 'report') { rev[k] = true; continue; }
      const ok = k === msg.good;
      const all = {sender: 1, link: 1, tone: 1, auth: 1};
      const why = mrMailHtml(msg, all);
      if (!ok) {
        await UI.openModal('Not this one', '<p>' + (k === 'trust' ? 'This one should be reported.' : 'This one is fine. Reporting it wouldn’t have been a mistake (when in doubt, report), but learn the cues that make it safe.') + ' Here are all the cues:</p>' + why, [{label: 'Try again', meta: {good: true}}], {closable: false, cls: 'drill'});
        continue;
      }
      m.inbox[n] = true;
      await UI.openModal('Correct · digit ' + MR_DOORCODE[n], '<p>' + (k === 'report' ? 'Reported.' : 'Trusted.') + ' The cues:</p>' + why, [{label: 'Next message', meta: {good: true}}], {closable: false, cls: 'drill'});
      break;
    }
  }
  G.f.mrInbox = true;
  ['T1566.002', 'T1566.001', 'T1684.001'].forEach(t => unlock('tech', t));
  unlock('fact', 'dmarc'); unlock('fact', 'headers'); unlock('act', 'spotcue');
  touchCSF('Protect');
  mrReported(3);
  await say('Door code ' + MR_DOORCODE + '. The inbox room opens. Bea runs the same six messages with staff this week: three more people report the next simulated phish. (game)');
  await say('Report rate now ' + metricVals().report + '%. Remember: a DMARC pass says which domain sent a message, not that the message is honest.');
}

async function mrOsintPuzzle(i) {
  if (!G.f.mrOsintMet) { await say('An OSINT practice terminal. Talk to Wren first.'); return; }
  const p = MR_OSINT[i], m = MR();
  if (m.osint[i]) { await say('Solved. ' + p.explain); return; }
  while (true) {
    const k = await UI.openModal('OSINT · ' + p.title, '<div class="mail">' + esc(p.art) + '</div><p><b>' + esc(p.q) + '</b></p>', p.opts.map((o, j) => ({label: o, meta: {good: j === p.good}})), {closable: false, cls: 'drill'});
    if (k === p.good) break;
    await say('Not quite. Think like the attacker, then like the defender.');
  }
  await say('Correct. ' + p.explain);
  m.osint[i] = true; unlock('tech', p.tech); unlock('act', 'exposure'); touchCSF('Identify');
  if (m.osint.every(Boolean)) {
    G.f.mrOsintDone = true; m.rulebook = true;
    await say('All three. Here: a Filter Rulebook. Give it to a mail-gateway tool that has reached Lv 5 and it will grow.', 'Wren Takahashi');

}
async function mrEvolveCheck() {
  if (!G.mr || !G.mr.rulebook) return;
  const t = G.party.find(p => p.id === 'sieve' && p.lvl >= 5);
  if (!t) return;
  const i = await choose('Sieve (Lv ' + t.lvl + ') can use the Filter Rulebook. Evolve it?', [{label: 'Evolve Sieve', meta: {good: true}}, {label: 'Later'}]);
  if (i !== 0) return;
  G.mr.rulebook = false; t.id = 'sifter';
  await say('Sieve is evolving! Sieve → Sifter. New ability: Search and purge, every copy from every inbox.');
}

/* ---------- State ---------- */
function CR() {

    drills: {}, ttc: [], iso: {}, needed: 0, over: 0, work: 0, infected: [], dojo: [false, false, false], bossT0: null};

}
function crOn() { return !!(G && G.f && G.f.crMet && G.cr); }
function inClerks() { return CR_MAPS.includes(G.map); }
const CR_PRIO = CR_ADVISORIES.filter(a => a.prio).map(a => a.id);
function crHasPatch(h, id) { return !!(G.cr && G.cr.patched[h] && G.cr.patched[h][id]); }
function crLit(h) { return CR_PRIO.every(id => crHasPatch(h, id)); }
function crIsolated(h) { return !!(G.cr && G.cr.iso[h]); }
function crInfectedLive(h) { return !!(G.f.crContain && !G.f.crBoss && G.cr.infected.includes(h)); }
// Apply one bucket of the triage plan. The conference laptop is offline; the deferred laptop has the update
// installed but not restarted, so none of it is in effect there yet (game).
function crDeploy(bucket) {
  const c = CR(); if (!c.triage || c.deployed[bucket]) return 0;
  c.deployed[bucket] = true;
  const ids = CR_ADVISORIES.filter(a => a.applies && c.triage[a.id] === bucket).map(a => a.id);
  for (const h of CR_HOSTS_ALL) {
    if (h === CR_OFFLINE || h === CR_DEFERRED) continue;
    c.patched[h] = c.patched[h] || {};
    ids.forEach(id => { c.patched[h][id] = true; });
  }
  track();
  return ids.length;
}
function crPatchAll() {
  const c = CR();
  for (const h of CR_HOSTS_ALL) { c.patched[h] = c.patched[h] || {}; CR_ADVISORIES.filter(a => a.applies).forEach(a => { c.patched[h][a.id] = true; }); }
  track();
}
function crCompliance(kev) {
  const ads = CR_ADVISORIES.filter(a => a.applies && a.kev === kev);
  let have = 0;
  for (const h of CR_HOSTS_ALL) ads.forEach(a => { if (crHasPatch(h, a.id)) have++; });
  return Math.round(have / (ads.length * CR_HOSTS_ALL.length) * 100);
}

/* ---------- Engine hooks (wrapping the Mail Room versions) ---------- */

/* ---- engine/drill.js ---- */
/* ============================================================
   UPTIME · engine/drill.js
   Investigation drill: a new encounter type. One artefact, one question and a
   small query budget (usually 2). The player picks queries as (evidence source,
   question) pairs. Focused questions return a short, exact snippet for 1 Focus;
   broad ones return a wall of rows for 3 Focus; trap questions spend the budget
   and mislead. Then a verdict, the reasoning behind it, and alternative
   explanations the player ruled out (bonus). Credit needs evidence: with no
   decisive (key) query, a right verdict scores half and reasoning scores nothing,
   because that is a guess. An optional AI helper answers specific questions well
   and quietly truncates "everything".
   Inspired by Chris Sanders's Investigation Path posts (see CREDITS.md); every
   case is original. Drill data lives with each edition.

   Drill spec D:
   {id, title, intro(html), artefact(html), question, budget,
    sources: [{id, name, qs: [{q, kind: 'focus'|'broad'|'trap', key, res: [lines], wall: [row templates]}]}],
    ai: {everything: {text, wrong, reveal}, specific: {q, text}},
    verdicts: [{label, good, why}], reasons: [{label, good, why}],
    alts: [{label, good, why}], altPick, path(html), response: [lines], techs: [ids], acts: [keys]}
   ============================================================ */
'use strict';

const DRILL_COST = {focus: 1, broad: 3, trap: 1};

function drillPre(lines, cls) {
  return '<pre class="art' + (cls ? ' ' + cls : '') + '">' + lines.map(esc).join('\n') + '</pre>';
}
// A wall of rows for a broad query: noisy template rows, with the one row that matters buried deep.
function drillWall(q) {
  const rows = [], tpl = q.wall || ['…'];
  const n = q.rows || 1240;
  for (let i = 0; i < 18; i++) {
    let r = tpl[i % tpl.length];
    const mm = String((7 + i * 3) % 60).padStart(2, '0'), ss = String((13 + i * 17) % 60).padStart(2, '0');
    r = r.replace(/\{t\}/g, mm + ':' + ss).replace(/\{n\}/g, String(100 + (i * 37) % 900)).replace(/\{i\}/g, String(i + 1));
    rows.push(r);
  }
  if (q.buried) rows.splice(15, 0, q.buried);
  rows.push('… ' + (n - rows.length).toLocaleString('en-US') + ' more rows');
  return '<p class="small">' + n.toLocaleString('en-US') + ' rows returned. You skim the first screen.</p>' + drillPre(rows, 'wall');
}
function drillFindings(st) {
  if (!st.findings.length) return '<p class="small">No queries yet.</p>';
  return st.findings.map(f => '<div class="find"><b>' + esc(f.head) + '</b>' + f.html + '</div>').join('');
}
function drillKeysLeft(D, st) {
  let n = 0;
  D.sources.forEach(s => s.qs.forEach(q => { if (q.key && !st.used.includes(q)) n++; }));
  return n;
}

async function doDrill(D) {
  const st = {budget: D.budget || 2, used: [], findings: [], broad: 0, trap: 0, keys: 0, aiMode: null};
  UI.showPanel(false);
  touchCSF('Detect');
  const rules = '<p class="small">Query budget <b>' + st.budget + '</b>. A query is one evidence source plus one question. Focused questions return a short exact answer (1 Focus). Broad questions return a wall of rows (3 Focus). Then give a verdict and your reasoning, and name alternative explanations you ruled out. (Scoring is a game model.)</p>';
  await UI.openModal('Investigation drill · ' + D.title,
    D.intro + '<h3>Artefact</h3>' + D.artefact + '<p><b>Question:</b> ' + esc(D.question) + '</p>' + rules,
    [{label: 'Start investigating', meta: {good: true}}], {closable: false, cls: 'drill'});

  // ---- Queries ----
  while (true) {
    const keysLeft = drillKeysLeft(D, st);
    const items = D.sources.map(s => {
      const open = s.qs.filter(q => !st.used.includes(q));
      return {label: 'Query: ' + s.name, note: open.length + ' question' + (open.length === 1 ? '' : 's'),
        disabled: st.budget <= 0 || !open.length || G.focus < 1,
        meta: {src: s.id, good: st.budget > 0 && s.qs.some(q => q.key && !st.used.includes(q))}};
    });
    if (D.ai) items.push({label: 'Ask Tally (AI assistant)', note: 'no budget · 1 Focus', disabled: G.focus < 1, meta: {ai: true}});
    items.push({label: st.budget > 0 ? 'I have enough: decide' : 'Budget spent: decide', meta: {decide: true, good: st.budget <= 0 || keysLeft === 0}});
    const body = '<p>Budget left: <b>' + st.budget + '</b> · Focus <b>' + G.focus + '/' + G.focusMax + '</b></p>' +
      '<details><summary>Artefact</summary>' + D.artefact + '</details><p><b>Question:</b> ' + esc(D.question) + '</p><h3>Findings</h3>' + drillFindings(st);
    const i = await UI.openModal('Drill · ' + D.title, body, items, {closable: false, cls: 'drill'});
    const m = items[i].meta;
    if (m.decide) break;
    if (m.ai) { await drillAI(D, st); continue; }
    const src = D.sources.find(s => s.id === m.src);
    const qs = src.qs.filter(q => !st.used.includes(q));
    const qi = qs.map(q => ({label: q.q, note: q.kind === 'broad' ? 'broad · 3 Focus' : '1 Focus', disabled: G.focus < DRILL_COST[q.kind], meta: {good: !!q.key}}));
    qi.push({label: 'Back', meta: {back: true}});
    const k = await UI.openModal('Query: ' + src.name, '<p>Which question do you put to the <b>' + esc(src.name) + '</b>?</p>', qi, {closable: false, cls: 'drill'});
    if (qi[k].meta.back) continue;
    const q = qs[k];
    st.used.push(q); st.budget--;
    G.focus = Math.max(0, G.focus - DRILL_COST[q.kind]);
    let html;
    if (q.kind === 'broad') { st.broad++; html = drillWall(q); }
    else { if (q.kind === 'trap') st.trap++; if (q.key) st.keys++; html = drillPre(q.res); }
    if (q.note) html += '<p class="small">' + esc(q.note) + '</p>';
    st.findings.push({head: src.name + ': ' + q.q, html: html});
    await UI.openModal('Result', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});
  }

  // ---- Verdict, reasoning, alternatives ----
  const ctx = '<h3>Findings</h3>' + drillFindings(st);
  const v = await UI.openModal('Verdict', '<p><b>' + esc(D.question) + '</b></p>' + ctx,
    D.verdicts.map(x => ({label: x.label, meta: {good: !!x.good}})), {closable: false, cls: 'drill'});
  const r = await UI.openModal('Reasoning', '<p>Which reasoning supports your verdict best? Reason only from what your queries showed: reasoning about evidence you never looked at earns no credit.</p>' + ctx,
    D.reasons.map(x => ({label: x.label, meta: {good: !!x.good}})), {closable: false, cls: 'drill'});
  const pickN = D.altPick || 2;
  const altItems = D.alts.map(x => ({label: x.label, meta: {good: !!x.good}})).concat([{label: 'Done: these are my ' + pickN, done: true, meta: {done: true}}]);
  const alts = await UI.openModal('Alternative explanations',
    '<p>Bonus: pick the <b>' + pickN + '</b> alternative explanations a careful analyst should name and rule out before closing this.</p>',
    altItems, {multi: pickN, closable: false, cls: 'drill'});

  // ---- Score (game) and debrief ----
  const verdictOk = !!D.verdicts[v].good, reasonOk = !!D.reasons[r].good;
  const altOk = alts.filter(a => D.alts[a] && D.alts[a].good).length;
  const keyTotal = D.sources.reduce((n, s) => n + s.qs.filter(q => q.key).length, 0);
  const keyScore = Math.round(20 * Math.min(st.keys, Math.min(keyTotal, D.budget || 2)) / Math.min(keyTotal, D.budget || 2));
  const supported = st.keys > 0;
  let score = (verdictOk ? (supported ? 40 : 20) : 0) + (reasonOk && supported ? 20 : 0) + keyScore + altOk * 10 - st.broad * 5 - st.trap * 5;
  score = clamp(score, 0, 100);
  const aiWrong = st.aiMode === 'everything' && D.ai && D.ai.everything.wrong;
  let h = '<p class="big">Score ' + score + ' / 100 <span class="small">(game)</span></p>';
  h += '<p><b>Verdict:</b> ' + esc(D.verdicts[v].label) + ' — ' + (verdictOk ? 'correct. ' : 'not supported. ') + esc(D.verdicts[v].why || '') + '</p>';
  if (!verdictOk) h += '<p><b>Better verdict:</b> ' + esc(D.verdicts.find(x => x.good).label) + '</p>';
  h += '<p><b>Reasoning:</b> ' + (reasonOk ? (supported ? 'sound. ' : 'sound in principle, but it rests on evidence you never queried (no credit). ') : 'weak. ') + esc(D.reasons[r].why || '') + '</p>';
  if (verdictOk && !supported) h += '<p><b>Unsupported:</b> the right answer, but none of your queries reached the decisive evidence. In a real case that is a guess, and a guess can’t be defended in a report.</p>';
  h += '<p><b>Alternatives:</b> ' + altOk + ' of ' + pickN + ' worth ruling out.</p><ul>' +
    D.alts.filter(x => x.good).map(x => '<li>' + esc(x.label) + ': ' + esc(x.why) + '</li>').join('') + '</ul>';
  h += '<p><b>Queries:</b> ' + st.keys + ' focused on the decisive evidence' + (st.broad ? ', ' + st.broad + ' broad (a wall of rows costs time and Focus)' : '') + (st.trap ? ', ' + st.trap + ' that could only mislead' : '') + '.</p>';
  h += '<h3>The focused path</h3>' + D.path;
  if (st.aiMode) h += '<h3>About Tally</h3><p>' + esc(st.aiMode === 'everything' ? D.ai.everything.reveal : (st.keys ? 'You asked a specific question and checked it against the evidence. That is how an assistant helps.' : 'You asked a specific question, which is how an assistant helps. Tally was right this time, but you never confirmed its answer in the evidence yourself.')) + '</p>';
  h += '<h3>Response</h3><ul>' + D.response.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  h += '<p class="small">ATT&amp;CK: ' + D.techs.map(t => esc(t + ' ' + TECH[t].name)).join(' · ') + '</p>';
  D.techs.forEach(t => unlock('tech', t));
  (D.acts || []).forEach(a => unlock('act', a));
  unlock('act', 'drill');
  await UI.openModal('Debrief · ' + D.title, h, [{label: 'Continue', meta: {good: true}}], {closable: false, cls: 'drill'});
  await gainXP(Math.round(score / 4));
  return {score: score, supported: supported, verdictOk: verdictOk, reasonOk: reasonOk, alts: altOk, keys: st.keys, broad: st.broad, trap: st.trap, ai: st.aiMode, aiWrong: aiWrong};
}

async function drillAI(D, st) {
  const items = [
    {label: 'Give Tally everything (paste all the logs) and ask for a verdict', meta: {mode: 'everything'}},
    {label: 'Ask Tally: “' + D.ai.specific.q + '”', meta: {mode: 'specific'}},
    {label: 'Back', meta: {back: true}}];
  const i = await UI.openModal('Tally · AI assistant', '<p>Tally runs on your console. It answers in seconds. It can be wrong.</p>', items, {closable: false, cls: 'drill'});
  const m = items[i].meta;
  if (m.back) return;
  G.focus = Math.max(0, G.focus - 1);
  if (!st.aiMode || m.mode === 'everything') st.aiMode = m.mode;
  const a = m.mode === 'everything' ? D.ai.everything.text : D.ai.specific.text;
  const html = drillPre(['Tally: ' + a], 'ai');
  st.findings.push({head: 'Tally (AI): ' + (m.mode === 'everything' ? 'everything' : D.ai.specific.q), html: html});
  await UI.openModal('Tally says', html, [{label: 'Back to the investigation', meta: {good: true}}], {closable: false, cls: 'drill'});

/* ---- engine/game.js ---- */
/* ============================================================
   UPTIME · engine/game.js
   Shared game core: overworld, rendering, HUD, script runner, investigations
   (battles), alerts, scorecard, Field Manual, menus, save/load, title, main loop,
   debug hooks for tests. Each edition supplies its data and story (EDITION,
   newState, objective, interact, triggers, editionTile, summary, introScript...).
   ============================================================ */
'use strict';

let G = null;          // saved game state
let B = null;          // current battle (not saved)
let busy = 0;          // running scripts
let moving = null;     // current step animation
let fade = 0;          // map transition fade (0..1)
let started = false;   // past the title screen
let lastT = 0, encCooldown = 0, toastT = 0, shake = 0, titleOpen = false;

const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};

/* ---------- Helpers ---------- */
const say = (t, who) => UI.say(t, who);

function unlock(kind, key) { if (!G.fm[kind + ':' + key]) { G.fm[kind + ':' + key] = true; return true; } return false; }

function groupFixed(g) { return !!G.f[GROUPS[g].fix]; }
function tool() { return G.party[G.active]; }
function toolName(t) { return TOOLS[t.id].name + (t.tuned ? ' · Tuned' : ''); }
function hasTool(id) { return G.party.some(t => t.id === id); }

function npcHere(map, x, y) { return NPCS.find(n => n.map === map && n.x === x && n.y === y && (!n.cond || n.cond(G))); }
function mapRows(m) { return MAPS[m].rows; }

/* ---------- Metrics ---------- */
function metricVals() {
  const m = G.m;
  return {
    closed: m.closed,
    acc: m.judged ? Math.round(m.correctShown / m.judged * 100) : null,
    tta: m.ttaN ? +(m.ttaSum / m.ttaN).toFixed(1) : null,
    esc: m.esc ? Math.round(m.escOk / m.esc * 100) : null,
    evid: m.judged ? Math.round((m.evOk || 0) / m.judged * 100) : null,
    uptime: +G.uptime.toFixed(2),
    mfa: Math.round(G.mfaSet.length / ACCOUNTS_TOTAL * 100),
    patch: Math.round(Object.keys(GROUPS).filter(groupFixed).length / 4 * 100),
    ...(typeof editionMetricVals === 'function' ? editionMetricVals() : {})
  };
}
const METRICS = [
  {k: 'closed', label: 'Alerts closed (read with accuracy)', unit: '', higher: true},
  {k: 'acc', label: 'Verdict accuracy', unit: '%', higher: true},
  {k: 'evid', label: 'Verdicts with evidence ≥ 40', unit: '%', higher: true},
  {k: 'tta', label: 'Time to acknowledge (game seconds)', unit: ' s', higher: false},
  {k: 'esc', label: 'Escalation precision (real, with evidence ÷ all)', unit: '%', higher: true},
  {k: 'uptime', label: 'District uptime', unit: '%', higher: true},
  {k: 'mfa', label: 'MFA coverage', unit: '%', higher: true},
  {k: 'patch', label: 'Hardening (baseline fixes)', unit: '%', higher: true}
];
if (typeof EDITION_METRICS !== 'undefined') METRICS.push(...EDITION_METRICS);
function track() {
  const v = metricVals();
  for (const d of METRICS) {
    if (d.when && !d.when()) continue;
    const x = v[d.k]; if (x === null || x === undefined) continue;
    const t = G.track[d.k] || (G.track[d.k] = {best: x, worst: x});
    if (d.higher) { t.best = Math.max(t.best, x); t.worst = Math.min(t.worst, x); }
    else { t.best = Math.min(t.best, x); t.worst = Math.max(t.worst, x); }
  }
}
function bumpUptime(d) { G.uptime = clamp(+(G.uptime + d).toFixed(3), 99.0, 100); track(); }

/* ---------- Tiles ---------- */
function tileChar(map, x, y) { const r = mapRows(map); if (y < 0 || y >= r.length || x < 0 || x >= r[0].length) return null; return r[y][x]; }
function tileDef(map, x, y) {
  const ch = tileChar(map, x, y); if (ch === null) return null;
  let d = Object.assign({ch: ch}, TILES[ch]);
  if (d.group) { const lit = groupFixed(d.group); d.spr = lit ? 'L' : 'B'; d.pal = lit ? 'L' : 'B'; }
  return editionTile(d, ch, x, y);
}
function doorAt(map, x, y) { const d = MAPS[map].doors; return d && d[x + ',' + y]; }
function blocked(map, x, y) {
  const d = tileDef(map, x, y); if (!d) return true;
  if (d.solid) return true;
  const door = doorAt(map, x, y); if (door && door.locked) return true;
  if (npcHere(map, x, y)) return true;
  return false;
}

/* ---------- Rendering ---------- */
function camera() {
  const r = mapRows(G.map), mw = r[0].length * TS, mh = r.length * TS;
  let px = G.x * TS, py = G.y * TS;
  if (moving) { const t = moving.t; px = (moving.fx + (moving.tx - moving.fx) * t) * TS; py = (moving.fy + (moving.ty - moving.fy) * t) * TS; }
  let cx = mw <= VW ? -(VW - mw) / 2 : clamp(px + 8 - VW / 2, 0, mw - VW);
  let cy = mh <= VH ? -(VH - mh) / 2 : clamp(py + 8 - VH / 2, 0, mh - VH);
  return {cx: Math.round(cx), cy: Math.round(cy), px: px, py: py};
}
function drawWorld(ctx) {
  ctx.fillStyle = '#10141f'; ctx.fillRect(0, 0, VW, VH);
  const r = mapRows(G.map), cam = camera();
  const x0 = Math.max(0, Math.floor(cam.cx / TS)), y0 = Math.max(0, Math.floor(cam.cy / TS));
  const x1 = Math.min(r[0].length - 1, Math.floor((cam.cx + VW) / TS)), y1 = Math.min(r.length - 1, Math.floor((cam.cy + VH) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = tileDef(G.map, x, y);
    const sx = x * TS - cam.cx, sy = y * TS - cam.cy;
    if (d.under) { const u = TILES[d.under]; ctx.drawImage(sprite(u.spr, u.pal), sx, sy); }
    ctx.drawImage(sprite(d.spr, d.pal), sx, sy);
  }
  // entities sorted by y
  const ents = NPCS.filter(n => n.map === G.map && (!n.cond || n.cond(G))).map(n => ({x: n.x * TS, y: n.y * TS, spr: n.spr || 'player', pal: n.pal, dir: n.dir}));
  const walkFrame = moving && moving.t > 0.25 && moving.t < 0.75;
  ents.push({x: cam.px, y: cam.py, spr: 'player', pal: 'player', dir: G.dir, me: true, step: walkFrame});
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    const variant = e.dir === 'up' && e.spr === 'player' ? 'back' : (e.step ? 'step' : '');
    ctx.drawImage(sprite(e.spr, e.pal, {variant: variant}), Math.round(e.x - cam.cx), Math.round(e.y - cam.cy - (e.step ? 1 : 0)));
  }
  if (fade > 0) { ctx.fillStyle = 'rgba(16,20,31,' + fade + ')'; ctx.fillRect(0, 0, VW, VH); }
}
function ellipse(ctx, cx, cy, rx, ry, c1, c2) {
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) {
    const d = (x / rx) ** 2 + (y / ry) ** 2;
    if (d <= 1) { ctx.fillStyle = d > 0.7 ? c1 : c2; ctx.fillRect(cx + x, cy + y, 1, 1); }
  }
}
let platformCache = null;
function drawBattle(ctx) {
  if (!platformCache) {
    const c = document.createElement('canvas'); c.width = VW; c.height = VH;
    const x = c.getContext('2d');
    x.fillStyle = '#dbeaf7'; x.fillRect(0, 0, VW, 96);
    x.fillStyle = '#c9e3a8'; x.fillRect(0, 96, VW, VH - 96);
    ellipse(x, 252, 84, 40, 7, '#5aa64b', '#a6d96a');
    ellipse(x, 76, 114, 44, 7, '#5aa64b', '#a6d96a');
    platformCache = c;
  }
  ctx.drawImage(platformCache, 0, 0);
  if (!B) return;
  const sh = shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
  let es = B.spec.enemy;
  if (!B.spec.story && !B.revealed) es = {spr: 'beacon', pal: 'beacon'};
  const bob = Math.round(Math.sin(performance.now() / 300) * 1);
  ctx.drawImage(sprite(es.spr, es.pal), 236 + sh, 50 + bob, 32, 32);
  const t = tool();
  if (t) ctx.drawImage(sprite(TOOLS[t.id].spr, TOOLS[t.id].spr, {variant: t.tuned ? 'tuned' : ''}), 60, 80, 32, 32);
}

/* ---------- HUD ---------- */
let hudStr = '';

  el.style.display = '';

/* ---------- Script runner ---------- */
async function run(fn) {
  busy++;
  try { await fn(); }
  catch (e) { console.error(e); }
  finally {
    busy--;
    if (!busy) { UI.hidePanel(); hudUpdate(); autosave(); }
  }
}
function autosave() { if (G && started && !B) storeSet(encodeSave(G)); }

/* ---------- Movement ---------- */
function tryMove(dir) {
  G.dir = dir;
  const [dx, dy] = DIRS[dir];
  const tx = G.x + dx, ty = G.y + dy;
  const door = doorAt(G.map, tx, ty);
  if (door && door.locked) { run(async () => { await say(door.locked); }); return; }
  if (blocked(G.map, tx, ty)) return;
  moving = {fx: G.x, fy: G.y, tx: tx, ty: ty, t: 0};
}
function stepDone() {
  G.x = moving.tx; G.y = moving.ty; moving = null;
  G.steps++;
  if (G.f.logs) G.m.events += 37 + Math.floor(rnd() * 20);
  if (G.steps % 12 === 0 && G.f.starter) G.queue = Math.min(9, G.queue + 1);
  if (G.auto && G.steps % 15 === 0 && G.queue > 0 && hasTool('ledger')) {
    if (rnd() < G.fpWeight / (G.fpWeight + 50) * 0.8) {
      G.queue--; G.m.autoClosed++;
      if (rnd() < 0.02) G.m.missed++;
      toast('Ledger auto-closed a known false positive');
    }
  }
  if (encCooldown > 0) encCooldown--;
  const door = doorAt(G.map, G.x, G.y);
  if (door && door.to) { run(() => warp(door.to, door.x, door.y, door.dir)); return; }
  if (triggers()) return;
  const d = tileDef(G.map, G.x, G.y);
  if (d.grass && G.party.length && encCooldown <= 0 && rnd() < 0.12) {
    encCooldown = 4;
    run(async () => { await randomAlert('grass'); });
  }
}
async function warp(map, x, y, dir) {
  if (!UI.turbo) for (let i = 1; i <= 6; i++) { fade = i / 6; await sleep(25); }
  G.map = map; G.x = x; G.y = y; G.dir = dir || G.dir;
  if (!UI.turbo) for (let i = 5; i >= 0; i--) { fade = i / 6; await sleep(25); }
  fade = 0;
}
/* ---------- Shifts, days, briefing ---------- */
async function endShift(reason) {
  const body = '<p>Day ' + G.day + ' is over' + (reason === 'focus' ? ': your Focus ran out' : '') + '.</p>' +
    '<p>Alerts closed today: <b>' + G.m.today + '</b>. Queue left overnight: <b>' + G.queue + '</b>.</p>' +
    (G.f.overnight ? '<p>An unfinished alert waited overnight; its dwell grew.</p>' : '');
  await UI.openModal('End of shift', body, [{label: 'Go home', meta: {good: true}}], {closable: false});
  if (G.f.overnight) { bumpUptime(-0.01); G.rep -= 1; G.f.overnight = false; }
  G.day++; G.m.today = 0; G.focus = G.focusMax;
  await briefing();
  await surfaceMissed(false);
}
async function briefing() {
  const L = typeof briefList === 'function' ? briefList() : BRIEFS;
  const a = L[(G.day * 2) % L.length], b = L[(G.day * 2 + 1) % L.length];
  const body = '<p>Morning briefing, Day ' + G.day + '. Two items from the threat-intel feed:</p>' +
    '<ol><li>' + esc(a.text) + '</li><li>' + esc(b.text) + '</li></ol>' +
    '<p>Act on one and that threat’s odds drop by half for a week (game).</p>';

    {label: a.act, meta: {good: true}}, {label: b.act}, {label: 'Note both, act on neither'}], {closable: false});
  touchCSF('Identify');

/* ---------- Alerts ---------- */
// Threat for an alert. Only malicious alerts use the entry-route weights (MAL_WEIGHTS, game) and the
// briefing / Key Badge halving; false-positive and benign alerts pick a rule evenly (edition hooks still apply).
function alertThreatWeights(kind) {
  return MAL_WEIGHTS.map(x => {
    let w = kind === 'mal' ? x.w : 10;
    if (kind === 'mal' && G.brief[x.t] && G.brief[x.t] >= G.day) w *= 0.5;
    if (kind === 'mal' && G.badge && x.t === 'sprayer') w *= 0.5;
    if (typeof alertWeight === 'function') w = alertWeight(x.t, w);
    return {t: x.t, w: w};
  });
}
function genAlert(forceKind) {
  const kind = forceKind || weighted([{k: 'fp', w: G.fpWeight}, {k: 'benign', w: 30}, {k: 'mal', w: 20}]).k;
  const wts = alertThreatWeights(kind);
  const t = weighted(wts).t;
  const th = THREATS[t], tpl = ALERTS[t], v = tpl[kind];
  const chain = ALERT_CHAINS[t];
  const spec = {
    kind: kind, threat: t, tech: th.tech, tags: th.tags, story: false, group: 'a',
    title: tpl.rule, host: (typeof alertHost === 'function' && alertHost()) || pick(HOSTS) + ' · Front Desk',
    enemy: kind === 'mal' ? {spr: th.spr, pal: th.pal} : kind === 'fp' ? {spr: 'noise', pal: 'noise'} : {spr: 'player', pal: 'staffer'},
    clues: v.clues, truth: v.truth, resp: tpl.mal.resp,
    rate: kind === 'mal' ? 12 + Math.floor(rnd() * 5) : 8,
    chain: [{at: 40, text: chain[0]}, {at: 75, text: chain[1]}]
  };
  if (typeof alertDecorate === 'function') alertDecorate(spec);
  return spec;
}
async function randomAlert(src) {
  if (!G.party.length) { await say('No tool on your console yet. Talk to Rae.'); return; }
  if (G.focus <= 0) { await say('You’re out of Focus. End your shift at your desk.'); return; }
  const spec = genAlert();
  await doBattle(spec);

async function openQueue() {

function eff(spec) {
  const C = CLASSES[TOOLS[tool().id].cls];
  const tac = TECH[spec.tech].tactic, tags = spec.tags || [];
  if ((C.weakTags || []).some(t => tags.includes(t))) return 0.5;
  let strong = tac.some(t => C.strong.includes(t));
  if (C.needsLogs && !G.f.logs) strong = false;
  if ((C.strongTags || []).some(t => tags.includes(t))) strong = true;
  return strong ? 2 : 1;
}
function power() { const t = tool(); return (1 + 0.08 * (t.lvl - 3)) * (t.tuned ? 1.25 : 1); }
function effLabel(m) { return m >= 2 ? 'strong ×2' : m <= 0.5 ? 'weak ×0.5' : ''; }
function bhud() {

  if (!B) { card.classList.remove('show'); tp.classList.remove('show'); return; }
  const s = B.spec, t = tool();
  card.innerHTML = '<div class="bt">ALERT · ' + esc(s.title) + '</div><div class="bs">' + esc(s.host) + '</div>' +

    bar('Focus', G.focus / G.focusMax * 100, '#5aa64b', G.focus + '/' + G.focusMax);

}

async function doBattle(spec) {

    await say((spec.story ? 'INCIDENT! ' : 'ALERT! ') + spec.title + '. (' + spec.host + ')');
    while (result === null) {
      bhud();
      const t = tool();
      const m = eff(spec);
      const items = TOOLS[t.id].abil.map(k => {
        const a = ABIL[k];
        return {label: a.name + ' (' + a.cost + ')', note: (a.type === 'inv' ? 'investigate' : 'contain') + (effLabel(m) ? ' · ' + effLabel(m) : ''),
          disabled: a.cost > G.focus, meta: {kind: 'ability', key: k, type: a.type, cost: a.cost, eff: m, disrupt: a.disrupt || 0}};
      });
      items.push({label: 'Close alert', note: 'verdict + response', meta: {kind: 'close'}});
      items.push({label: 'Switch tool', disabled: G.party.length < 2, meta: {kind: 'switch'}});
      if (!spec.story) items.push({label: G.rank === 'Intern' ? 'Ask Rae (escalate)' : /^Tier 2/.test(G.rank) ? 'Escalate to Rae (incident lead)' : 'Escalate to Tier 2', note: 'bring evidence', meta: {kind: 'escalate'}});
      const lastClue = B.clue > 0 ? 'Latest: ' + spec.clues[B.clue - 1] : 'What do you check first?';

      if (meta.kind === 'ability') { await useAbility(meta.key, m); }
      else if (meta.kind === 'switch') {
        const opts = G.party.map((p, j) => ({label: toolName(p) + ' Lv ' + p.lvl, disabled: j === G.active, meta: {idx: j}})).concat([{label: 'Back'}]);
        const j = await choose('Switch to which tool? (Takes a moment: the attacker gets a step.)', opts, {cancel: true});

      } else if (meta.kind === 'close') {
        const r = await closeFlow(); if (r === 'back') continue;
        if (r) { result = r; break; }
      } else if (meta.kind === 'escalate') {
        result = await escalate(); break;
      }

      const r2 = await attackerStep(); if (r2) { result = r2; break; }

}
function ackNow() {

async function useAbility(k, m) {
  const a = ABIL[k], s = B.spec;

  if (typeof onAbility === 'function') onAbility(k, B);

    let gain = a.ev * m * power();
    if (a.social && (s.tags || []).includes('voice')) gain *= 1.5;

async function attackerStep() {

    if (s.kind === 'mal') {

      return s.story ? 'lose' : 'escalated';

async function closeFlow() {
  const s = B.spec;
  const v = await choose('Verdict?', [
    {label: 'False positive', note: 'the rule is wrong', meta: {verdict: 'fp'}},
    {label: 'Benign', note: 'real, but expected', meta: {verdict: 'benign'}},
    {label: 'Malicious', note: 'an attack', meta: {verdict: 'mal'}},
    {label: 'Back', meta: {back: true}}], {cancel: true});
  if (v < 0 || v === 3) return 'back';
  const verdict = ['fp', 'benign', 'mal'][v];
  let resp;
  if (verdict === 'fp') resp = [{label: 'Close and file a tuning request for the noisy rule', good: true, tune: true}, {label: 'Close as false positive', good: true}];
  else if (verdict === 'benign') resp = [{label: 'Close and note why it’s expected', good: true}, {label: 'Close', good: true}];
  else resp = s.resp;
  const ri = await choose('Response?', resp.map(r => ({label: r.label, meta: {good: !!r.good}})).concat([{label: 'Back', meta: {back: true}}]), {cancel: true});
  if (ri < 0 || ri === resp.length) return 'back';
  const r = resp[ri];
  const correct = verdict === s.kind;
  if (s.story) {
    if (!correct) { await say('Rae: Not that verdict. Look at the evidence again.'); return null; }
    if (!r.good) { await say('Rae: Right verdict, wrong response.' + (r.why ? ' ' + r.why : ' Think about what actually stops this attacker.')); if (r.disrupt) { bumpUptime(-0.01 * r.disrupt); } return null; }
  }
  // scoring
  G.m.closed++; G.m.today++; G.m.judged++;
  if (B.ev >= 40) G.m.evOk = (G.m.evOk || 0) + 1;
  B.revealed = correct || s.kind !== 'mal';
  const fresh = unlock('tech', s.tech);
  touchCSF('Detect');
  let xp = 10 + Math.floor(B.ev / 10);
  let msg = '';
  if (correct) {
    G.m.correctShown++;
    msg = 'Correct. ' + s.truth;
    if (s.kind === 'mal') {
      xp += 10; touchCSF('Respond');
      if (!r.good) { xp = Math.floor(xp / 2); msg += r.why ? ' Right call, weak response: ' + r.why : ' Right call, heavy-handed response.'; }
      if (r.disrupt) { G.rep -= 2 * r.disrupt; bumpUptime(-0.01 * r.disrupt); }
    }
    if (verdict === 'fp' && r.tune) { G.fpWeight = Math.max(25, G.fpWeight - 4); msg += ' Tuning request accepted: fewer false positives from now on.'; }
  } else if (s.kind === 'mal') {
    // a missed attack: nobody knows yet
    G.m.correctShown++; G.m.missed++;
    msg = 'Closed.'; xp = 4;
  } else {
    msg = 'Rae reviewed it: ' + s.truth;
    xp = 3; if (verdict === 'mal') G.rep -= 2;
  }
  if (s.kind !== 'mal' && B.disrupt > 0) {
    G.rep -= 3 * B.disrupt; bumpUptime(-0.01 * B.disrupt); G.m.overreact++;
    msg += ' But you disrupted people’s work for an alert that wasn’t an attack: reputation and uptime drop.';
  }
  if (s.kind === 'fp') { G.focus = Math.max(0, G.focus - 2); msg += ' (False positives drain Focus: −2.)'; }
  await say(msg);
  if (correct && s.kind === 'mal' && r.good && !s.story) await scopeQuestion();
  if (typeof onAlertClosed === 'function') await onAlertClosed(s, verdict, correct, r);
  await say('ATT&CK: the rule maps to ' + s.tech + ' ' + TECH[s.tech].name + ' (' + TECH[s.tech].tactic.join(', ') + ').' + (fresh ? ' Added to the Field Manual.' : ''));

}

  if (i < 0) return;
  const m = items[i].meta;
  if (m.i !== undefined) G.active = m.i;
  if (m.tune) { const t = G.party.find(p => p.id === m.tune); t.tuned = true; G.items.guide = 0; await UI.openModal('Tuned', '<p>' + esc(TOOLS[t.id].name) + ' was Tuned. Power ×1.25.</p>', [{label: 'OK'}]); }
}
async function exportSave() {
  const code = encodeSave(G);
  await UI.openModal('Export save code', '<p>Copy this code somewhere safe. Import it on any device.</p><textarea id="codebox" readonly rows="6">' + esc(code) + '</textarea>', [{label: 'Done'}]);
}
function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }

/* ---------- Title ---------- */
async function titleScreen() {
  titleOpen = true;
  const has = !!storeGet();
  const items = [];
  if (has) items.push({label: 'Continue', meta: {k: 'cont'}});
  items.push({label: 'New game', meta: {k: 'new'}}, {label: 'Import save code', meta: {k: 'import'}}, {label: 'Credits', meta: {k: 'credits'}});
  const body = '<div class="title"><div class="logo">UPTIME</div><div>' + esc(EDITION.title) + '</div></div>' +
    '<p>' + esc(EDITION.blurb) + '</p>' +
    '<p class="small">Move: arrows / D-pad · A: Z · B: X · Start: Enter · Select: Shift (alert queue)</p>' +
    '<p class="small">Build ' + BUILD_ID + ' · ' + BUILD_TS + '</p>';
  const i = await UI.openModal('', body, items, {closable: false, cls: 'titlebox'});
  const k = items[i].meta.k;
  titleOpen = false;
  if (k === 'cont') {
    try { G = decodeSave(storeGet()); fixupState(); qtAdopt(); started = true; hudUpdate(); }
    catch (e) { await UI.openModal('Continue', '<p>That save could not be read: ' + esc(e.message) + '</p>', [{label: 'OK'}]); return titleScreen(); }
    return;
  }
  if (k === 'credits') { await UI.openModal('Credits', creditsHtml(), [{label: 'Back'}]); return titleScreen(); }
  if (k === 'import') { const ok = await importFlow(); if (!ok) return titleScreen(); return; }
  newGame();
}
function fixupState() {
  const base = newState(G.seed || 1);
  for (const k in base) if (G[k] === undefined) G[k] = base[k];
  for (const k in base.m) if (G.m[k] === undefined) G.m[k] = base.m[k];
  for (const k in base.targets) if (G.targets[k] === undefined) G.targets[k] = base.targets[k];
  if (G.targets.esc === 1) G.targets.esc = base.targets.esc; // older saves: the escalation target was a count
  if (!G.qt) G.qt = Series.blankQT();
}
let seedOverride = null;
function newGame() {
  const seed = seedOverride !== null ? seedOverride : (Date.now() >>> 0);
  rng = makeRng(seed);
  G = newState(seed); started = true;
  qtMirror();
  track(); hudUpdate();
  run(introScript);
}
async function importFlow() {
  const i = await UI.openModal('Import save code', '<p>Paste a save code, then choose Load.</p><textarea id="codebox" rows="6" placeholder="UPT1.…"></textarea>', [{label: 'Load'}, {label: 'Cancel'}]);
  // the textarea is removed when the modal closes, so read it on click (see modal hook below)
  if (i !== 0) return false;
  try {
    G = decodeSave(lastImportText); fixupState(); qtAdopt(); started = true; storeSet(encodeSave(G)); hudUpdate();
    await UI.openModal('Import', '<p>Save loaded. Day ' + G.day + ', ' + esc(G.rank) + '.</p>', [{label: 'OK'}]);
    return true;
  } catch (e) {
    await UI.openModal('Import', '<p>' + esc(e.message) + '</p>', [{label: 'OK'}]);
    return false;
  }
}
let lastImportText = '';
document.addEventListener('input', e => { if (e.target && e.target.id === 'codebox') lastImportText = e.target.value; }, true);

/* ---------- Main loop ---------- */
function frame(t) {
  const dt = Math.min(50, t - (lastT || t)); lastT = t;
  UI.tick(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) document.getElementById('toast').classList.remove('show'); }
  if (shake > 0) shake -= dt;
  if (G && started) {
    if (!titleOpen) G.playMs += dt;
    if (moving) {
      moving.t += dt / (UI.turbo ? 45 : 140);
      if (moving.t >= 1) {
        const mv = moving; stepDone();
        if (!busy && !UI.mode && !UI.modal && !moving) {
          const held = ['up', 'down', 'left', 'right'].find(d => Input.held[d]);
          const tap = Input.taps.find(b => DIRS[b]);
          Input.taps = Input.taps.filter(b => !DIRS[b]);
          const nd = tap || held;
          if (nd) tryMove(nd);
        }
      }
    } else if (!busy && !UI.mode && !UI.modal) {
      const tap = Input.taps.find(b => DIRS[b]);
      Input.taps = Input.taps.filter(b => !DIRS[b]);
      const held = ['up', 'down', 'left', 'right'].find(d => Input.held[d]);
      const nd = tap || held;
      if (nd) tryMove(nd);
    } else { Input.taps = Input.taps.filter(b => !DIRS[b]); }
    if (B) drawBattle(Screen.ctx); else drawWorld(Screen.ctx);
    hudUpdate();
  } else {
    drawTitleBg(Screen.ctx, t);
  }
  requestAnimationFrame(frame);
}
function drawTitleBg(ctx, t) {
  for (let y = 0; y < 12; y++) for (let x = 0; x < 21; x++) {
    const k = (x + y) % 7 === 0 ? 'L' : (x * 3 + y) % 5 === 0 ? 'K' : 'G';
    ctx.drawImage(sprite(S[k] ? k : 'G', k), x * 16 - (Math.floor(t / 60) % 16), y * 16);
  }
}

/* ---------- Button dispatch ---------- */
function onButton(b) {
  if (UI.modal || UI.mode) { UI.handle(b); Input.taps = []; return; }
  if (!G || !started || busy || moving) return;
  if (b === 'a') interact();
  else if (b === 'start') run(startMenu);
  else if (b === 'select') run(openQueue);
}

/* ---------- Debug / test hooks (no effect on play) ---------- */
window.__UPTIME = {
  peek() {
    let ui = null;
    if (UI.modal) ui = {type: 'modal', options: UI.modal.items.map(o => ({label: o.label, meta: o.meta || null, disabled: !!o.disabled, done: !!o.done})), cursor: UI.modal.cursor, multi: UI.modal.multi, sel: [...UI.modal.sel]};
    else if (UI.mode === 'say') ui = {type: 'say', typing: UI.typing, text: UI.full};
    else if (UI.mode === 'choice') ui = {type: 'choice', options: UI.choice.items.map(o => ({label: o.label, meta: o.meta || null, disabled: !!o.disabled})), cursor: UI.choice.cursor, cols: UI.choice.cols, text: UI.text.textContent};
    if (!G) return {started: false, ui: ui};
    const solid = mapRows(G.map).map((r, y) => r.split('').map((c, x) => blocked(G.map, x, y) ? 1 : 0));
    return {
      started: started, map: G.map, x: G.x, y: G.y, dir: G.dir, moving: !!moving, busy: busy, day: G.day, focus: G.focus,
      f: G.f, rank: G.rank, ui: ui, objective: objective(), solid: solid, doors: MAPS[G.map].doors,
      battle: B ? {kind: B.spec.kind, ev: B.ev, dwell: B.dwell, story: !!B.spec.story, tech: B.spec.tech} : null,
      party: G.party, metrics: metricVals(), m: G.m, fm: fmPct(), queue: G.queue, mfa: G.mfaSet.length, summary: !!G.f.summaryShown,
      qt: Series.qt(),
      extra: typeof peekExtra === 'function' ? peekExtra() : null
    };
  },
  turbo(on) { UI.turbo = !!on; },
  seed(n) { seedOverride = n >>> 0; },
  state() { return G; },
  series() { return Series.load(); }
};

/* ---------- Boot ---------- */
function boot() {
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('touch', !!touch);
  Series.load();
  Screen.init(); UI.init(); Input.init();
  Input.handler = onButton;
  document.querySelectorAll('.buildid').forEach(e => e.textContent = BUILD_ID + ' · ' + BUILD_TS);
  requestAnimationFrame(frame);
  titleScreen();
}
window.addEventListener('DOMContentLoaded', boot);

</script>
</body>
